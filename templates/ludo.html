<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Battle - fm4bat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0b0e14;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 20px;
        }
        .navbar {
            width: 100%; max-width: 480px; background: #12151c; display: flex;
            justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 1px solid #1e222d;
        }
        .brand-logo { font-size: 16px; font-weight: 900; color: #f1c40f; font-style: italic; text-decoration: none; }
        
        .ludo-container {
            width: 100%; max-width: 480px;
            background: #141822;
            border: 2px solid #2a2f40;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .players-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .player-card {
            background: #1c212e;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 5px 8px;
            width: 48%;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .player-avatar {
            width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid #f1c40f;
        }
        .player-info { display: flex; flex-direction: column; font-size: 10px; }
        .player-name { font-weight: bold; color: #fff; }
        .player-coins { color: #f1c40f; font-weight: bold; }

        /* Classic 15x15 Ludo Board */
        .board {
            width: 360px; height: 360px;
            background: #ffffff;
            border: 6px solid #222;
            position: relative;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            box-shadow: 0 15px 35px rgba(0,0,0,0.85);
            border-radius: 4px;
        }

        /* 4 Corner Bases */
        .base-red { grid-column: 1 / 7; grid-row: 10 / 16; background: #e74c3c; padding: 12px; display: flex; align-items: center; justify-content: center; border: 2px solid #222; }
        .base-green { grid-column: 1 / 7; grid-row: 1 / 7; background: #2ecc71; padding: 12px; display: flex; align-items: center; justify-content: center; border: 2px solid #222; }
        .base-yellow { grid-column: 10 / 16; grid-row: 1 / 7; background: #f1c40f; padding: 12px; display: flex; align-items: center; justify-content: center; border: 2px solid #222; }
        .base-blue { grid-column: 10 / 16; grid-row: 10 / 16; background: #3498db; padding: 12px; display: flex; align-items: center; justify-content: center; border: 2px solid #222; }

        /* Inner White Square with Circles */
        .inner-base {
            width: 100%; height: 100%; background: #fff; border-radius: 6px;
            display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr);
            padding: 10px; gap: 10px; align-items: center; justify-items: center;
        }
        .token-spot {
            width: 26px; height: 26px; background: #ddd; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 14px;
            border: 2px solid #999; cursor: pointer; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Center Home */
        .center-home {
            grid-column: 7 / 10; grid-row: 7 / 10; background: #111;
            display: flex; justify-content: center; align-items: center; font-size: 24px;
            border: 2px solid #222;
        }

        /* Track Grid Cells */
        .cell {
            background: #fff;
            border: 1px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
        }
        .green-track { background: #2ecc71; }
        .red-track { background: #e74c3c; }
        .yellow-track { background: #f1c40f; }
        .blue-track { background: #3498db; }

        .control-panel {
            width: 100%; max-width: 480px;
            background: #12151c;
            padding: 12px 15px;
            margin-top: 8px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #1e222d;
        }
        .dice-box {
            width: 50px; height: 50px; background: #fff; color: #111; font-size: 24px; font-weight: bold; border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 10px rgba(255,255,255,0.15);
        }
        .status-msg { font-size: 11px; color: #34d399; font-weight: bold; text-align: center; flex: 1; padding: 0 8px; }
        
        .roll-btn {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white; border: none; padding: 9px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        .roll-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="/dashboard" class="brand-logo">⚔️ LUDO BATTLE (ARMY)</a>
        <a href="/dashboard" style="color: #8a99ad; text-decoration: none; font-size: 11px;">🏠 Lobby</a>
    </div>

    <div class="ludo-container">
        <!-- Players Header -->
        <div class="players-row">
            <div class="player-card">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100" class="player-avatar" alt="Bhoomi">
                <div class="player-info">
                    <span class="player-name">Bhoomi</span>
                    <span class="player-coins">🪙 9,010</span>
                </div>
            </div>
            <div class="player-card">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100" class="player-avatar" alt="Irafan">
                <div class="player-info">
                    <span class="player-name">Irafan</span>
                    <span class="player-coins">🪙 1,010</span>
                </div>
            </div>
        </div>

        <!-- Classic Ludo Board Layout -->
        <div class="board">
            <!-- 4 Bases -->
            <div class="base-green">
                <div class="inner-base">
                    <div class="token-spot">🪖</div>
                    <div class="token-spot">🪖</div>
                    <div class="token-spot">🪖</div>
                    <div class="token-spot">🪖</div>
                </div>
            </div>

            <div class="base-yellow">
                <div class="inner-base">
                    <div class="token-spot">🪖</div>
                    <div class="token-spot">🪖</div>
                    <div class="token-spot">🪖</div>
                    <div class="token-spot">🪖</div>
                </div>
            </div>

            <div class="center-home">🏆</div>

            <div class="base-red">
                <div class="inner-base">
                    <div class="token-spot">🪖</div>
                    <div class="token-spot">🪖</div>
                    <div class="token-spot">🪖</div>
                    <div class="token-spot" id="active-token">🚀</div>
                </div>
            </div>

            <div class="base-blue">
                <div class="inner-base">
                    <div class="token-spot">🪖</div>
                    <div class="token-helmet">🪖</div>
                    <div class="token-helmet">🪖</div>
                    <div class="token-helmet">🪖</div>
                </div>
            </div>

            <!-- Path Track Cells matching reference image layout -->
            <div class="cell green-track" style="grid-column: 2; grid-row: 7;" id="cell-1">START</div>
            <div class="cell" style="grid-column: 3; grid-row: 7;" id="cell-2"></div>
            <div class="cell" style="grid-column: 4; grid-row: 7;" id="cell-3">⭐</div>
            <div class="cell" style="grid-column: 5; grid-row: 7;" id="cell-4"></div>
            <div class="cell" style="grid-column: 6; grid-row: 7;" id="cell-5"></div>
            
            <div class="cell red-track" style="grid-column: 7; grid-row: 14;" id="cell-6"></div>
            <div class="cell red-track" style="grid-column: 7; grid-row: 13;" id="cell-7">⭐</div>
            <div class="cell red-track" style="grid-column: 7; grid-row: 12;" id="cell-8"></div>
        </div>

        <!-- Bottom Players -->
        <div class="players-row" style="margin-top: 8px; margin-bottom: 0;">
            <div class="player-card" style="border-color: #34d399;">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100" class="player-avatar" alt="Guest_3">
                <div class="player-info">
                    <span class="player-name">Guest_3 (You)</span>
                    <span class="player-coins">🪙 9,010</span>
                </div>
            </div>
            <div class="player-card">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="player-avatar" alt="Rose">
                <div class="player-info">
                    <span class="player-name">Rose</span>
                    <span class="player-coins">🪙 17,010</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Controls & Dice -->
    <div class="control-panel">
        <div class="dice-box" id="dice-value">🎲</div>
        <div class="status-msg" id="game-status">Roll a 6 to start your track journey!</div>
        <button class="roll-btn" id="roll-dice-btn" onclick="rollDice()">Roll Dice</button>
    </div>

    <script>
        let pos = 0;
        const totalSteps = 8;

        function rollDice() {
            const diceEl = document.getElementById("dice-value");
            const statusEl = document.getElementById("game-status");
            const rollBtn = document.getElementById("roll-dice-btn");
            const token = document.getElementById("active-token");

            rollBtn.disabled = true;
            let anim = setInterval(() => {
                diceEl.innerText = Math.floor(Math.random() * 6) + 1;
            }, 80);

            setTimeout(() => {
                clearInterval(anim);
                let roll = Math.floor(Math.random() * 6) + 1;
                diceEl.innerText = roll;

                if (pos === 0) {
                    if (roll === 6) {
                        pos = 1;
                        token.innerText = "";
                        document.getElementById("cell-1").innerHTML = "🚀";
                        statusEl.innerText = `Rolled 6! Token entered the track!`;
                    } else {
                        statusEl.innerText = `Rolled ${roll}. Need 6 to exit base!`;
                    }
                } else {
                    document.getElementById(`cell-${pos}`).innerHTML = pos === 1 ? "START" : (pos === 3 || pos === 7 ? "⭐" : "");
                    pos += roll;
                    if (pos >= totalSteps) {
                        pos = totalSteps;
                        document.getElementById(`cell-${totalSteps}`).innerHTML = "👑";
                        statusEl.innerText = `🎉 Victory! Reached Home! Won 500 Coins!`;
                        setTimeout(() => {
                            window.location.href = "/dashboard";
                        }, 1500);
                    } else {
                        document.getElementById(`cell-${pos}`).innerHTML = "🚀";
                        statusEl.innerText = `Rolled ${roll}. Moving along the track boxes!`;
                    }
                }
                rollBtn.disabled = false;
            }, 600);
        }
    </script>
</body>
</html>
