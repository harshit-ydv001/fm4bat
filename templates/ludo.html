<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Battle - fm4bat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0b0e14;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 20px;
        }
        .navbar {
            width: 100%; max-width: 480px; background: #12151c; display: flex;
            justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 1px solid #1e222d;
        }
        .brand-logo { font-size: 16px; font-weight: 900; color: #f1c40f; font-style: italic; text-decoration: none; }
        
        .ludo-container {
            width: 100%; max-width: 480px;
            background: #141822;
            border: 2px solid #2a2f40;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .players-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .player-card {
            background: #1c212e;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 5px 8px;
            width: 48%;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .player-avatar {
            width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid #f1c40f;
        }
        .player-info { display: flex; flex-direction: column; font-size: 10px; }
        .player-name { font-weight: bold; color: #fff; }
        .player-coins { color: #f1c40f; font-weight: bold; }

        /* EXACT 100% LUDO BOARD REPLICA */
        .board {
            width: 350px; height: 350px;
            background: #12151c;
            border: 4px solid #1f293d;
            position: relative;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            border-radius: 4px;
        }

        /* 4 Corner Bases */
        .base-red { grid-column: 1 / 7; grid-row: 1 / 7; background: #e74c3c; border: 2px solid #c0392b; display: flex; justify-content: center; align-items: center; }
        .base-green { grid-column: 10 / 16; grid-row: 1 / 7; background: #2ecc71; border: 2px solid #27ae60; display: flex; justify-content: center; align-items: center; }
        .base-blue { grid-column: 1 / 7; grid-row: 10 / 16; background: #3498db; border: 2px solid #2980b9; display: flex; justify-content: center; align-items: center; }
        .base-yellow { grid-column: 10 / 16; grid-row: 10 / 16; background: #f1c40f; border: 2px solid #f39c12; display: flex; justify-content: center; align-items: center; }

        /* Inner Dark Square with 4 Token Circles */
        .bunker-box {
            width: 76%; height: 76%; background: #0c0f16; border-radius: 6px; 
            display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr);
            padding: 8px; gap: 8px; align-items: center; justify-items: center;
        }
        
        .token-circle {
            width: 22px; height: 22px; background: #fff; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 11px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); border: 2px solid #333; cursor: pointer;
        }
        .token-circle.active { border-color: #00ffcc; box-shadow: 0 0 8px #00ffcc; }

        /* Center Home (Trophy) */
        .center-home {
            grid-column: 7 / 10; grid-row: 7 / 10; background: #111; 
            display: flex; justify-content: center; align-items: center; font-size: 22px;
            border: 2px solid #222;
        }

        /* Cross Tracks (Paths) matching exact design */
        .path-v-top { grid-column: 7 / 10; grid-row: 1 / 7; background: #27ae60; border: 1px solid #1e8449; }
        .path-v-bottom { grid-column: 7 / 10; grid-row: 10 / 16; background: #f1c40f; border: 1px solid #d4ac0d; }
        .path-h-left { grid-column: 1 / 7; grid-row: 7 / 10; background: #e74c3c; border: 1px solid #b03a2e; }
        .path-h-right { grid-column: 10 / 16; grid-row: 7 / 10; background: #3498db; border: 1px solid #2471a3; }

        /* Control Panel */
        .control-panel {
            width: 100%; max-width: 480px;
            background: #12151c;
            padding: 12px 15px;
            margin-top: 8px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #1e222d;
        }
        .dice-box {
            width: 50px; height: 50px; background: #fff; color: #111; font-size: 24px; font-weight: bold; border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 10px rgba(255,255,255,0.15);
        }
        .status-msg { font-size: 11px; color: #34d399; font-weight: bold; text-align: center; flex: 1; padding: 0 8px; }
        
        .roll-btn {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white; border: none; padding: 9px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        .roll-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="/dashboard" class="brand-logo">⚔️ LUDO BATTLE</a>
        <a href="/dashboard" style="color: #8a99ad; text-decoration: none; font-size: 11px;">🏠 Lobby</a>
    </div>

    <div class="ludo-container">
        <!-- Top Players -->
        <div class="players-row">
            <div class="player-card">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100" class="player-avatar" alt="Bhoomi">
                <div class="player-info">
                    <span class="player-name">Bhoomi</span>
                    <span class="player-coins">🪙 9,010</span>
                </div>
            </div>
            <div class="player-card">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100" class="player-avatar" alt="Irafan">
                <div class="player-info">
                    <span class="player-name">Irafan</span>
                    <span class="player-coins">🪙 1,010</span>
                </div>
            </div>
        </div>

        <!-- 100% Exact Ludo Board Replica -->
        <div class="board">
            <!-- Red Base -->
            <div class="base-red">
                <div class="bunker-box">
                    <div class="token-circle">🪖</div>
                    <div class="token-circle">🪖</div>
                    <div class="token-circle">🪖</div>
                    <div class="token-circle active" id="token-active">🚀</div>
                </div>
            </div>
            
            <!-- Green Base -->
            <div class="base-green">
                <div class="bunker-box">
                    <div class="token-circle">🟩</div>
                    <div class="token-circle">🟩</div>
                    <div class="token-circle">🟩</div>
                    <div class="token-circle">🟩</div>
                </div>
            </div>

            <!-- Cross Paths & Center -->
            <div class="path-v-top"></div>
            <div class="path-h-left"></div>
            <div class="center-home">🏆</div>
            <div class="path-h-right"></div>
            <div class="path-v-bottom"></div>

            <!-- Blue Base -->
            <div class="base-blue">
                <div class="bunker-box">
                    <div class="token-circle">🟦</div>
                    <div class="token-circle">🟦</div>
                    <div class="token-circle">🟦</div>
                    <div class="token-circle">🟦</div>
                </div>
            </div>

            <!-- Yellow Base -->
            <div class="base-yellow">
                <div class="bunker-box">
                    <div class="token-circle">⭐</div>
                    <div class="token-circle">⭐</div>
                    <div class="token-circle">⭐</div>
                    <div class="token-circle">⭐</div>
                </div>
            </div>
        </div>

        <!-- Bottom Players -->
        <div class="players-row" style="margin-top: 8px; margin-bottom: 0;">
            <div class="player-card" style="border-color: #34d399;">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100" class="player-avatar" alt="Guest_3">
                <div class="player-info">
                    <span class="player-name">Guest_3 (You)</span>
                    <span class="player-coins">🪙 9,010</span>
                </div>
            </div>
            <div class="player-card">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="player-avatar" alt="Rose">
                <div class="player-info">
                    <span class="player-name">Rose</span>
                    <span class="player-coins">🪙 17,010</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Controls & Dice -->
    <div class="control-panel">
        <div class="dice-box" id="dice-value">🎲</div>
        <div class="status-msg" id="game-status">Roll a 6 to open your commando token!</div>
        <button class="roll-btn" id="roll-dice-btn" onclick="rollDice()">Roll Dice</button>
    </div>

    <script>
        let isOpen = false;
        let steps = 0;

        function rollDice() {
            const diceEl = document.getElementById("dice-value");
            const statusEl = document.getElementById("game-status");
            const rollBtn = document.getElementById("roll-dice-btn");
            const activeToken = document.getElementById("token-active");

            rollBtn.disabled = true;
            let rollAnim = setInterval(() => {
                diceEl.innerText = Math.floor(Math.random() * 6) + 1;
            }, 80);

            setTimeout(() => {
                clearInterval(rollAnim);
                let roll = Math.floor(Math.random() * 6) + 1;
                diceEl.innerText = roll;

                if (!isOpen) {
                    if (roll === 6) {
                        isOpen = true;
                        activeToken.innerText = "👑";
                        statusEl.innerText = `Rolled 6! Token is now active on track!`;
                    } else {
                        statusEl.innerText = `Rolled ${roll}. Need 6 to open token!`;
                    }
                } else {
                    steps += roll;
                    if (steps >= 5) {
                        statusEl.innerText = `🎉 Victory! Reached Home! Won 500 Coins!`;
                        setTimeout(() => {
                            window.location.href = "/dashboard";
                        }, 1500);
                    } else {
                        statusEl.innerText = `Rolled ${roll}. Advanced to step ${steps}/5!`;
                    }
                }
                rollBtn.disabled = false;
            }, 600);
        }
    </script>
</body>
</html>
