<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Battle - fm4bat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0b0e14;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 20px;
        }
        .navbar {
            width: 100%; max-width: 480px; background: #12151c; display: flex;
            justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 1px solid #1e222d;
        }
        .brand-logo { font-size: 16px; font-weight: 900; color: #f1c40f; font-style: italic; text-decoration: none; }
        
        .ludo-container {
            width: 100%; max-width: 480px;
            background: #141822;
            border: 2px solid #2a2f40;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .players-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .player-card {
            background: #1c212e;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 5px 8px;
            width: 48%;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .player-avatar {
            width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid #f1c40f;
        }
        .player-info { display: flex; flex-direction: column; font-size: 10px; }
        .player-name { font-weight: bold; color: #fff; }
        .player-coins { color: #f1c40f; font-weight: bold; }

        .board {
            width: 360px; height: 360px;
            background: #3a4732;
            border: 8px solid #232d1e;
            position: relative;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            box-shadow: 0 15px 35px rgba(0,0,0,0.85);
            border-radius: 6px;
            overflow: hidden;
        }

        .base-red { 
            grid-column: 1 / 7; grid-row: 1 / 7; 
            background: linear-gradient(135deg, #8b251c 0%, #5a140e 100%); 
            border: 4px solid #3d0d09; 
            display: flex; justify-content: center; align-items: center; 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }
        .base-green { 
            grid-column: 10 / 16; grid-row: 1 / 7; 
            background: linear-gradient(135deg, #1b5e36 0%, #0f361f 100%); 
            border: 4px solid #082212; 
            display: flex; justify-content: center; align-items: center; 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }
        .base-blue { 
            grid-column: 1 / 7; grid-row: 10 / 16; 
            background: linear-gradient(135deg, #164e7a 0%, #0c2d47 100%); 
            border: 4px solid #061928; 
            display: flex; justify-content: center; align-items: center; 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }
        .base-yellow { 
            grid-column: 10 / 16; grid-row: 10 / 16; 
            background: linear-gradient(135deg, #8a7314 0%, #52430b 100%); 
            border: 4px solid #2d2404; 
            display: flex; justify-content: center; align-items: center; 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .bunker-box {
            width: 78%; height: 78%; 
            background: radial-gradient(circle, #3d2817 0%, #21150c 100%); 
            border-radius: 12px; 
            display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr);
            padding: 8px; gap: 10px; align-items: center; justify-items: center;
            box-shadow: inset 0 6px 12px rgba(0,0,0,0.9);
            border: 3px solid #140d07;
        }
        
        .token-helmet {
            width: 30px; height: 30px; background: #222; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6), inset 0 2px 3px rgba(255,255,255,0.3); 
            border: 2px solid #555; cursor: pointer;
        }

        .center-home {
            grid-column: 7 / 10; grid-row: 7 / 10; 
            background: #1a1e18; 
            display: flex; justify-content: center; align-items: center; font-size: 26px;
            border: 3px solid #0f120e;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        /* Playable Track Cells (Rashta) */
        .track-cell {
            background: #d4c5a9;
            border: 1px solid #b5a485;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
        }
        .track-cell.green-path { background: #278c52; }

        .control-panel {
            width: 100%; max-width: 480px;
            background: #12151c;
            padding: 12px 15px;
            margin-top: 8px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #1e222d;
        }
        .dice-box {
            width: 50px; height: 50px; background: #fff; color: #111; font-size: 24px; font-weight: bold; border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 10px rgba(255,255,255,0.15);
        }
        .status-msg { font-size: 11px; color: #34d399; font-weight: bold; text-align: center; flex: 1; padding: 0 8px; }
        
        .roll-btn {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white; border: none; padding: 9px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        .roll-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="/dashboard" class="brand-logo">[cite: 1]⚔️ LUDO BATTLE (ARMY)</a>
        <a href="/dashboard" style="color: #8a99ad; text-decoration: none; font-size: 11px;">[cite: 1]🏠 Lobby</a>
    </div>

    <div class="ludo-container">
        <div class="players-row">
            <div class="player-card">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100" class="player-avatar" alt="Bhoomi">
                <div class="player-info">
                    <span class="player-name">[cite: 1]Bhoomi</span>
                    <span class="player-coins">[cite: 1]🪙 9,010</span>
                </div>
            </div>
            <div class="player-card">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100" class="player-avatar" alt="Irafan">
                <div class="player-info">
                    <span class="player-name">[cite: 1]Irafan</span>
                    <span class="player-coins">[cite: 1]🪙 1,010</span>
                </div>
            </div>
        </div>

        <div class="board">
            <div class="base-red">
                <div class="bunker-box">
                    <div class="token-helmet">🪖</div>
                    <div class="token-helmet">🪖</div>
                    <div class="token-helmet">🪖</div>
                    <div class="token-helmet" id="token-4">🪖</div>
                </div>
            </div>
            
            <div class="base-green">
                <div class="bunker-box">
                    <div class="token-helmet">🪖</div>
                    <div class="token-helmet">🪖</div>
                    <div class="token-helmet">🪖</div>
                    <div class="token-helmet">🪖</div>
                </div>
            </div>

            <div class="center-home">🏆</div>

            <div class="base-blue">
                <div class="bunker-box">
                    <div class="token-helmet">🪖</div>
                    <div class="token-helmet">🪖</div>
                    <div class="token-helmet">🪖</div>
                    <div class="token-helmet">🪖</div>
                </div>
            </div>

            <div class="base-yellow">
                <div class="bunker-box">
                    <div class="token-helmet">🪖</div>
                    <div class="token-helmet">🪖</div>
                    <div class="token-helmet">🪖</div>
                    <div class="token-helmet">🪖</div>
                </div>
            </div>

            <!-- Track Cells (Rashta) -->
            <div class="track-cell" style="grid-column: 7; grid-row: 1;"></div>
            <div class="track-cell green-path" style="grid-column: 8; grid-row: 1;" id="cell-1"></div>
            <div class="track-cell" style="grid-column: 9; grid-row: 1;"></div>

            <div class="track-cell" style="grid-column: 7; grid-row: 2;"></div>
            <div class="track-cell green-path" style="grid-column: 8; grid-row: 2;" id="cell-2"></div>
            <div class="track-cell" style="grid-column: 9; grid-row: 2;"></div>

            <div class="track-cell" style="grid-column: 7; grid-row: 3;"></div>
            <div class="track-cell green-path" style="grid-column: 8; grid-row: 3;" id="cell-3"></div>
            <div class="track-cell" style="grid-column: 9; grid-row: 3;"></div>

            <div class="track-cell" style="grid-column: 7; grid-row: 4;"></div>
            <div class="track-cell green-path" style="grid-column: 8; grid-row: 4;" id="cell-4"></div>
            <div class="track-cell" style="grid-column: 9; grid-row: 4;"></div>

            <div class="track-cell" style="grid-column: 7; grid-row: 5;"></div>
            <div class="track-cell green-path" style="grid-column: 8; grid-row: 5;" id="cell-5"></div>
            <div class="track-cell" style="grid-column: 9; grid-row: 5;"></div>

            <div class="track-cell" style="grid-column: 7; grid-row: 6;"></div>
            <div class="track-cell green-path" style="grid-column: 8; grid-row: 6;" id="cell-6"></div>
            <div class="track-cell" style="grid-column: 9; grid-row: 6;"></div>
        </div>

        <div class="players-row" style="margin-top: 8px; margin-bottom: 0;">
            <div class="player-card" style="border-color: #34d399;">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100" class="player-avatar" alt="Guest_3">
                <div class="player-info">
                    <span class="player-name">[cite: 1]Guest_3 (You)</span>
                    <span class="player-coins">[cite: 1]🪙 9,010</span>
                </div>
            </div>
            <div class="player-card">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="player-avatar" alt="Rose">
                <div class="player-info">
                    <span class="player-name">[cite: 1]Rose</span>
                    <span class="player-coins">[cite: 1]🪙 17,010</span>
                </div>
            </div>
        </div>
    </div>

    <div class="control-panel">
        <div class="dice-box" id="dice-value">[cite: 1]🎲</div>
        <div class="status-msg" id="game-status">[cite: 1]Roll a 6 to deploy your commando token onto the track!</div>
        <button class="roll-btn" id="roll-dice-btn" onclick="rollDice()">[cite: 1]Roll Dice</button>
    </div>

    <script>
        let currentPos = 0;
        const maxTrackSteps = 6;

        function rollDice() {
            const diceEl = document.getElementById("dice-value");
            const statusEl = document.getElementById("game-status");
            const rollBtn = document.getElementById("roll-dice-btn");
            const token4 = document.getElementById("token-4");

            rollBtn.disabled = true;
            let rollAnim = setInterval(() => {
                diceEl.innerText = Math.floor(Math.random() * 6) + 1;
            }, 80);

            setTimeout(() => {
                clearInterval(rollAnim);
                let roll = Math.floor(Math.random() * 6) + 1;
                diceEl.innerText = roll;

                if (currentPos === 0) {
                    if (roll === 6) {
                        currentPos = 1;
                        token4.innerHTML = "";
                        document.getElementById("cell-6").innerHTML = "🚀";
                        statusEl.innerText = `Rolled 6! Commando deployed onto the track path!`;
                    } else {
                        statusEl.innerText = `Rolled ${roll}. Need a 6 to exit base!`;
                    }
                } else {
                    let prevCellId = maxTrackSteps - currentPos + 1;
                    if(prevCellId >= 1 && prevCellId <= 6) {
                        document.getElementById(`cell-${prevCellId}`).innerHTML = "";
                    }

                    currentPos += roll;
                    if (currentPos >= maxTrackSteps) {
                        document.getElementById("cell-1").innerHTML = "👑";
                        statusEl.innerText = `🎉 Victory! Commando reached Trophy Home! Won 500 Coins!`;
                        setTimeout(() => {
                            window.location.href = "/dashboard";
                        }, 1500);
                    } else {
                        let newCellId = maxTrackSteps - currentPos + 1;
                        document.getElementById(`cell-${newCellId}`).innerHTML = "🚀";
                        statusEl.innerText = `Rolled ${roll}. Moving along the track path!`;
                    }
                }
                rollBtn.disabled = false;
            }, 600);
        }
    </script>
</body>
</html>
