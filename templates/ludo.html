<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Battle - fm4bat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0b0e14;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 20px;
        }
        .navbar {
            width: 100%; max-width: 480px; background: #12151c; display: flex;
            justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 1px solid #1e222d;
        }
        .brand-logo { font-size: 18px; font-weight: 900; color: #f1c40f; font-style: italic; text-decoration: none; }
        
        .ludo-container {
            width: 100%; max-width: 480px;
            background: #141822;
            border: 2px solid #2a2f40;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            position: relative;
        }

        /* Player Profiles Header/Footer Row */
        .players-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .player-card {
            background: #1c212e;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 6px;
            width: 48%;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .player-avatar {
            width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid #f1c40f;
        }
        .player-info { display: flex; flex-direction: column; font-size: 11px; }
        .player-name { font-weight: bold; color: #fff; }
        .player-coins { color: #f1c40f; font-weight: bold; }

        /* The Ludo Board */
        .board {
            width: 360px; height: 360px;
            background: #2b3548;
            border: 4px solid #111;
            position: relative;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* Bases */
        .base-red { grid-column: 1 / 7; grid-row: 1 / 7; background: rgba(231, 76, 60, 0.3); border: 2px solid #e74c3c; display: flex; justify-content: center; align-items: center; }
        .base-green { grid-column: 10 / 16; grid-row: 1 / 7; background: rgba(46, 204, 113, 0.3); border: 2px solid #2ecc71; display: flex; justify-content: center; align-items: center; }
        .base-blue { grid-column: 1 / 7; grid-row: 10 / 16; background: rgba(52, 152, 219, 0.3); border: 2px solid #3498db; display: flex; justify-content: center; align-items: center; }
        .base-yellow { grid-column: 10 / 16; grid-row: 10 / 16; background: rgba(241, 196, 15, 0.3); border: 2px solid #f1c40f; display: flex; justify-content: center; align-items: center; }

        .bunker-box {
            width: 70%; height: 70%; background: #181d28; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 24px;
        }

        .center-home {
            grid-column: 7 / 10; grid-row: 7 / 10; background: #111; display: flex; justify-content: center; align-items: center; font-size: 18px;
        }

        /* Dice Control Panel */
        .control-panel {
            width: 100%; max-width: 480px;
            background: #12151c;
            padding: 15px;
            margin-top: 10px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #1e222d;
        }
        .dice-box {
            width: 55px; height: 55px; background: #fff; color: #111; font-size: 26px; font-weight: bold; border-radius: 10px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 10px rgba(255,255,255,0.2);
            transition: transform 0.1s;
        }
        .dice-box:active { transform: scale(0.9); }
        .status-msg { font-size: 13px; color: #34d399; font-weight: bold; text-align: center; flex: 1; padding: 0 10px; }
        
        .roll-btn {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }
        .roll-btn:hover { background: linear-gradient(135deg, #d97706 0%, #b45309 100%); }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="/dashboard" class="brand-logo">⚔️ LUDO BATTLE</a>
        <a href="/dashboard" style="color: #8a99ad; text-decoration: none; font-size: 12px;">🏠 Lobby</a>
    </div>

    <div class="ludo-container">
        <!-- Top Players (Bhoomi & Irafan) -->
        <div class="players-row">
            <div class="player-card">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100" class="player-avatar" alt="Bhoomi">
                <div class="player-info">
                    <span class="player-name">Bhoomi</span>
                    <span class="player-coins">🪙 9,010</span>
                </div>
            </div>
            <div class="player-card">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100" class="player-avatar" alt="Irafan">
                <div class="player-info">
                    <span class="player-name">Irafan</span>
                    <span class="player-coins">🪙 1,010</span>
                </div>
            </div>
        </div>

        <!-- The Fast Ludo Board -->
        <div class="board">
            <div class="base-red"><div class="bunker-box" id="token-red">🪖</div></div>
            <div class="base-green"><div class="bunker-box" id="token-green">🟩</div></div>
            <div class="center-home">🏆</div>
            <div class="base-blue"><div class="bunker-box" id="token-blue">🟦</div></div>
            <div class="base-yellow"><div class="bunker-box" id="token-yellow">⭐</div></div>
        </div>

        <!-- Bottom Players (Guest_3 & Rose) -->
        <div class="players-row" style="margin-top: 10px; margin-bottom: 0;">
            <div class="player-card" style="border-color: #34d399;">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100" class="player-avatar" alt="Guest_3">
                <div class="player-info">
                    <span class="player-name">Guest_3 (You)</span>
                    <span class="player-coins" id="my-coins">🪙 9,010</span>
                </div>
            </div>
            <div class="player-card">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="player-avatar" alt="Rose">
                <div class="player-info">
                    <span class="player-name">Rose</span>
                    <span class="player-coins">🪙 17,010</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Controls & Dice -->
    <div class="control-panel">
        <div class="dice-box" id="dice-value">🎲</div>
        <div class="status-msg" id="game-status">Roll the dice to start your commando run!</div>
        <button class="roll-btn" id="roll-dice-btn" onclick="rollDice()">Roll Dice</button>
    </div>

    <script>
        let playerPos = 0; // 0 means in base, 1 to 6 steps to home
        const winningStep = 6;

        function rollDice() {
            const diceEl = document.getElementById("dice-value");
            const statusEl = document.getElementById("game-status");
            const rollBtn = document.getElementById("roll-dice-btn");
            const tokenRed = document.getElementById("token-red");

            rollBtn.disabled = true;
            let rollAnim = setInterval(() => {
                let randomNum = Math.floor(Math.random() * 6) + 1;
                diceEl.innerText = randomNum;
            }, 80);

            setTimeout(() => {
                clearInterval(rollAnim);
                let finalRoll = Math.floor(Math.random() * 6) + 1;
                diceEl.innerText = finalRoll;

                if (playerPos === 0) {
                    if (finalRoll >= 4) {
                        playerPos = 1;
                        tokenRed.innerText = "🚀";
                        statusEl.innerText = `Rolled ${finalRoll}! Commando deployed onto the path!`;
                    } else {
                        statusEl.innerText = `Rolled ${finalRoll}. Need 4 or more to exit bunker!`;
                    }
                } else {
                    playerPos += finalRoll;
                    if (playerPos >= winningStep) {
                        playerPos = winningStep;
                        tokenRed.innerText = "👑";
                        statusEl.innerText = `🎉 Victory! Commando reached home! Won 500 tokens!`;
                        setTimeout(() => {
                            alert("Congratulations! You won the Ludo Fast Battle!");
                            window.location.href = "/dashboard";
                        }, 1500);
                    } else {
                        statusEl.innerText = `Rolled ${finalRoll}. Moved forward to step ${playerPos}/${winningStep}!`;
                    }
                }
                rollBtn.disabled = false;
            }, 600);
        }
    </script>
</body>
</html>
