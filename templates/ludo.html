<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Battle - fm4bat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0b0e14;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 20px;
        }
        .navbar {
            width: 100%; max-width: 480px; background: #12151c; display: flex;
            justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 1px solid #1e222d;
        }
        .brand-logo { font-size: 16px; font-weight: 900; color: #f1c40f; font-style: italic; text-decoration: none; }
        
        .ludo-container {
            width: 100%; max-width: 480px;
            background: #141822;
            border: 2px solid #2a2f40;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .players-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .player-card {
            background: #1c212e;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 5px 8px;
            width: 48%;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .player-avatar {
            width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid #f1c40f;
        }
        .player-info { display: flex; flex-direction: column; font-size: 10px; }
        .player-name { font-weight: bold; color: #fff; }
        .player-coins { color: #f1c40f; font-weight: bold; }

        /* Full 15x15 Classic Ludo Board Grid Layout */
        .board {
            width: 360px; height: 360px;
            background: #ffffff;
            border: 4px solid #111;
            position: relative;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            box-shadow: 0 15px 35px rgba(0,0,0,0.85);
            border-radius: 4px;
        }

        /* 4 Corner Bases */
        .base-green { grid-column: 1 / 7; grid-row: 1 / 7; background: #2ecc71; padding: 10px; border: 2px solid #111; display: flex; align-items: center; justify-content: center; }
        .base-yellow { grid-column: 10 / 16; grid-row: 1 / 7; background: #f1c40f; padding: 10px; border: 2px solid #111; display: flex; align-items: center; justify-content: center; }
        .base-red { grid-column: 1 / 7; grid-row: 10 / 16; background: #e74c3c; padding: 10px; border: 2px solid #111; display: flex; align-items: center; justify-content: center; }
        .base-blue { grid-column: 10 / 16; grid-row: 10 / 16; background: #3498db; padding: 10px; border: 2px solid #111; display: flex; align-items: center; justify-content: center; }

        .inner-box {
            width: 100%; height: 100%; background: #fff; border-radius: 6px;
            display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr);
            padding: 8px; gap: 8px; align-items: center; justify-items: center;
        }
        .token-circle {
            width: 26px; height: 26px; background: #e0e0e0; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 14px;
            border: 2px solid #999; cursor: pointer;
        }

        /* Center Home */
        .center-home {
            grid-column: 7 / 10; grid-row: 7 / 10; background: #111;
            display: flex; justify-content: center; align-items: center; font-size: 24px;
            border: 2px solid #111;
        }

        /* Track Grid Cells */
        .cell {
            background: #fff;
            border: 1px solid #dcdcdc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 8px;
            font-weight: bold;
        }
        .cell-green { background: #2ecc71; color: #fff; }
        .cell-yellow { background: #f1c40f; color: #000; }
        .cell-red { background: #e74c3c; color: #fff; }
        .cell-blue { background: #3498db; color: #fff; }

        .control-panel {
            width: 100%; max-width: 480px;
            background: #12151c;
            padding: 12px 15px;
            margin-top: 8px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #1e222d;
        }
        .dice-box {
            width: 50px; height: 50px; background: #fff; color: #111; font-size: 24px; font-weight: bold; border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 10px rgba(255,255,255,0.15);
        }
        .status-msg { font-size: 11px; color: #34d399; font-weight: bold; text-align: center; flex: 1; padding: 0 8px; }
        
        .roll-btn {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white; border: none; padding: 9px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        .roll-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="/dashboard" class="brand-logo">⚔️ LUDO BATTLE (ARMY)</a>
        <a href="/dashboard" style="color: #8a99ad; text-decoration: none; font-size: 11px;">🏠 Lobby</a>
    </div>

    <div class="ludo-container">
        <!-- Players Header -->
        <div class="players-row">
            <div class="player-card">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100" class="player-avatar" alt="Bhoomi">
                <div class="player-info">
                    <span class="player-name">Bhoomi</span>
                    <span class="player-coins">🪙 9,010</span>
                </div>
            </div>
            <div class="player-card">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100" class="player-avatar" alt="Irafan">
                <div class="player-info">
                    <span class="player-name">Irafan</span>
                    <span class="player-coins">🪙 1,010</span>
                </div>
            </div>
        </div>

        <!-- 100% Complete Classic Ludo Board Grid -->
        <div class="board">
            <!-- Bases -->
            <div class="base-green">
                <div class="inner-box">
                    <div class="token-circle">🪖</div>
                    <div class="token-circle">🪖</div>
                    <div class="token-circle">🪖</div>
                    <div class="token-circle">🪖</div>
                </div>
            </div>

            <div class="base-yellow">
                <div class="inner-box">
                    <div class="token-circle">🪖</div>
                    <div class="token-circle">🪖</div>
                    <div class="token-circle">🪖</div>
                    <div class="token-circle">🪖</div>
                </div>
            </div>

            <div class="center-home">🏆</div>

            <div class="base-red">
                <div class="inner-box">
                    <div class="token-circle">🪖</div>
                    <div class="token-circle">🪖</div>
                    <div class="token-circle">🪖</div>
                    <div class="token-circle" id="active-token">🚀</div>
                </div>
            </div>

            <div class="base-blue">
                <div class="inner-box">
                    <div class="token-circle">🪖</div>
                    <div class="token-circle">🪖</div>
                    <div class="token-circle">🪖</div>
                    <div class="token-circle">🪖</div>
                </div>
            </div>

            <!-- COMPLETE TRACK CELLS (ALL ARMS & HOME LANES) -->
            <!-- Top Arm (Cols 7-9, Rows 1-6) -->
            <div class="cell" style="grid-column: 7; grid-row: 1;"></div>
            <div class="cell cell-green" style="grid-column: 8; grid-row: 1;" id="track-1">START</div>
            <div class="cell" style="grid-column: 9; grid-row: 1;"></div>

            <div class="cell cell-yellow" style="grid-column: 7; grid-row: 2;" id="track-2">⭐</div>
            <div class="cell cell-yellow" style="grid-column: 8; grid-row: 2;"></div>
            <div class="cell" style="grid-column: 9; grid-row: 2;"></div>

            <div class="cell" style="grid-column: 7; grid-row: 3;" id="track-3"></div>
            <div class="cell cell-yellow" style="grid-column: 8; grid-row: 3;"></div>
            <div class="cell" style="grid-column: 9; grid-row: 3;"></div>

            <div class="cell" style="grid-column: 7; grid-row: 4;" id="track-4"></div>
            <div class="cell cell-yellow" style="grid-column: 8; grid-row: 4;"></div>
            <div class="cell" style="grid-column: 9; grid-row: 4;"></div>

            <div class="cell" style="grid-column: 7; grid-row: 5;" id="track-5"></div>
            <div class="cell cell-yellow" style="grid-column: 8; grid-row: 5;"></div>
            <div class="cell" style="grid-column: 9; grid-row: 5;"></div>

            <div class="cell" style="grid-column: 7; grid-row: 6;"></div>
            <div class="cell cell-yellow" style="grid-column: 8; grid-row: 6;"></div>
            <div class="cell" style="grid-column: 9; grid-row: 6;"></div>

            <!-- Right Arm (Cols 10-15, Rows 7-9) -->
            <div class="cell" style="grid-column: 10; grid-row: 7;"></div>
            <div class="cell" style="grid-column: 11; grid-row: 7;"></div>
            <div class="cell" style="grid-column: 12; grid-row: 7;"></div>
            <div class="cell" style="grid-column: 13; grid-row: 7;"></div>
            <div class="cell" style="grid-column: 14; grid-row: 7;" id="track-17">⭐</div>
            <div class="cell" style="grid-column: 15; grid-row: 7;"></div>

            <div class="cell cell-blue" style="grid-column: 10; grid-row: 8;"></div>
            <div class="cell cell-blue" style="grid-column: 11; grid-row: 8;"></div>
            <div class="cell cell-blue" style="grid-column: 12; grid-row: 8;"></div>
            <div class="cell cell-blue" style="grid-column: 13; grid-row: 8;"></div>
            <div class="cell cell-blue" style="grid-column: 14; grid-row: 8;"></div>
            <div class="cell cell-blue" style="grid-column: 15; grid-row: 8;"></div>

            <div class="cell" style="grid-column: 10; grid-row: 9;" id="track-18"></div>
            <div class="cell" style="grid-column: 11; grid-row: 9;" id="track-19"></div>
            <div class="cell" style="grid-column: 12; grid-row: 9;"></div>
            <div class="cell" style="grid-column: 13; grid-row: 9;"></div>
            <div class="cell" style="grid-column: 14; grid-row: 9;"></div>
            <div class="cell" style="grid-column: 15; grid-row: 9;"></div>

            <!-- Left Arm (Cols 1-6, Rows 7-9) -->
            <div class="cell" style="grid-column: 1; grid-row: 7;"></div>
            <div class="cell" style="grid-column: 2; grid-row: 7;" id="track-6">⭐</div>
            <div class="cell" style="grid-column: 3; grid-row: 7;" id="track-7"></div>
            <div class="cell" style="grid-column: 4; grid-row: 7;" id="track-8"></div>
            <div class="cell" style="grid-column: 5; grid-row: 7;" id="track-9"></div>
            <div class="cell" style="grid-column: 6; grid-row: 7;" id="track-10"></div>

            <div class="cell cell-green" style="grid-column: 1; grid-row: 8;" id="track-15"></div>
            <div class="cell cell-green" style="grid-column: 2; grid-row: 8;"></div>
            <div class="cell cell-green" style="grid-column: 3; grid-row: 8;"></div>
            <div class="cell cell-green" style="grid-column: 4; grid-row: 8;"></div>
            <div class="cell cell-green" style="grid-column: 5; grid-row: 8;"></div>
            <div class="cell cell-green" style="grid-column: 6; grid-row: 8;"></div>

            <div class="cell" style="grid-column: 1; grid-row: 9;"></div>
            <div class="cell" style="grid-column: 2; grid-row: 9;"></div>
            <div class="cell" style="grid-column: 3; grid-row: 9;"></div>
            <div class="cell" style="grid-column: 4; grid-row: 9;"></div>
            <div class="cell" style="grid-column: 5; grid-row: 9;" id="track-11">⭐</div>
            <div class="cell" style="grid-column: 6; grid-row: 9;" id="track-12"></div>

            <!-- Bottom Arm (Cols 7-9, Rows 10-15) -->
            <div class="cell" style="grid-column: 7; grid-row: 10;" id="track-13"></div>
            <div class="cell cell-red" style="grid-column: 8; grid-row: 10;"></div>
            <div class="cell" style="grid-column: 9; grid-row: 10;"></div>

            <div class="cell" style="grid-column: 7; grid-row: 11;" id="track-14"></div>
            <div class="cell cell-red" style="grid-column: 8; grid-row: 11;"></div>
            <div class="cell cell-red" style="grid-column: 9; grid-row: 11;" id="track-16">⭐</div>

            <div class="cell" style="grid-column: 7; grid-row: 12;"></div>
            <div class="cell cell-red" style="grid-column: 8; grid-row: 12;"></div>
            <div class="cell" style="grid-column: 9; grid-row: 12;"></div>

            <div class="cell" style="grid-column: 7; grid-row: 13;"></div>
            <div class="cell cell-red" style="grid-column: 8; grid-row: 13;"></div>
            <div class="cell" style="grid-column: 9; grid-row: 13;"></div>

            <div class="cell" style="grid-column: 7; grid-row: 14;"></div>
            <div class="cell cell-red" style="grid-column: 8; grid-row: 14;"></div>
            <div class="cell" style="grid-column: 9; grid-row: 14;"></div>

            <div class="cell" style="grid-column: 7; grid-row: 15;"></div>
            <div class="cell cell-red" style="grid-column: 8; grid-row: 15;" id="track-max"></div>
            <div class="cell" style="grid-column: 9; grid-row: 15;"></div>
        </div>

        <!-- Bottom Players -->
        <div class="players-row" style="margin-top: 8px; margin-bottom: 0;">
            <div class="player-card" style="border-color: #34d399;">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100" class="player-avatar" alt="Guest_3">
                <div class="player-info">
                    <span class="player-name">Guest_3 (You)</span>
                    <span class="player-coins">🪙 9,010</span>
                </div>
            </div>
            <div class="player-card">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="player-avatar" alt="Rose">
                <div class="player-info">
                    <span class="player-name">Rose</span>
                    <span class="player-coins">🪙 17,010</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Controls & Dice -->
    <div class="control-panel">
        <div class="dice-box" id="dice-value">🎲</div>
        <div class="status-msg" id="game-status">Roll a 6 to start your track journey!</div>
        <button class="roll-btn" id="roll-dice-btn" onclick="rollDice()">Roll Dice</button>
    </div>

    <script>
        let currentStep = 0;
        const maxSteps = 18;

        function rollDice() {
            const diceEl = document.getElementById("dice-value");
            const statusEl = document.getElementById("game-status");
            const rollBtn = document.getElementById("roll-dice-btn");
            const token = document.getElementById("active-token");

            rollBtn.disabled = true;
            let anim = setInterval(() => {
                diceEl.innerText = Math.floor(Math.random() * 6) + 1;
            }, 80);

            setTimeout(() => {
                clearInterval(anim);
                let roll = Math.floor(Math.random() * 6) + 1;
                diceEl.innerText = roll;

                if (currentStep === 0) {
                    if (roll === 6) {
                        currentStep = 1;
                        token.innerText = "";
                        document.getElementById("track-1").innerHTML = "🚀";
                        statusEl.innerText = `Rolled 6! Token entered the complete track!`;
                    } else {
                        statusEl.innerText = `Rolled ${roll}. Need a 6 to exit base!`;
                    }
                } else {
                    let oldEl = currentStep === maxSteps ? document.getElementById("track-max") : document.getElementById(`track-${currentStep}`);
                    if(oldEl) {
                        oldEl.innerHTML = (currentStep === 1 ? "START" : "");
                    }

                    currentStep += roll;
                    if (currentStep >= maxSteps) {
                        currentStep = maxSteps;
                        document.getElementById("track-max").innerHTML = "👑";
                        statusEl.innerText = `🎉 Victory! Reached Home! Won 500 Coins!`;
                        setTimeout(() => {
                            window.location.href = "/dashboard";
                        }, 1500);
                    } else {
                        let newEl = document.getElementById(`track-${currentStep}`);
                        if(newEl) {
                            newEl.innerHTML = "🚀";
                        } else {
                            document.getElementById("track-max").innerHTML = "🚀";
                        }
                        statusEl.innerText = `Rolled ${roll}. Moving along the full track boxes!`;
                    }
                }
                rollBtn.disabled = false;
            }, 600);
        }
    </script>
</body>
</html>
