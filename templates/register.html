<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - fm4bat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0b0e14; color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
        }
        .auth-card {
            width: 100%; max-width: 440px; background: #141822;
            border: 1px solid #2a2f40; border-radius: 16px; padding: 28px 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .brand-title { font-size: 26px; font-weight: 900; color: #f1c40f; text-align: center; margin-bottom: 20px; font-style: italic; }
        
        .tab-buttons { display: flex; margin-bottom: 24px; background: #0f131a; border-radius: 10px; padding: 4px; border: 1px solid #2a2f40; }
        .tab-btn { flex: 1; background: none; border: none; color: #8a99ad; padding: 10px; font-weight: bold; font-size: 14px; cursor: pointer; border-radius: 8px; text-decoration: none; text-align: center; transition: 0.3s; }
        .tab-btn.active { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: #fff; box-shadow: 0 4px 12px rgba(59,130,246,0.3); }

        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; position: relative; }
        .form-group label { font-size: 12px; color: #cbd5e1; font-weight: bold; }
        
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .form-group input {
            width: 100%;
            background: #0f131a; border: 1.5px solid #2a2f40; border-radius: 10px;
            padding: 12px 42px 12px 14px; color: #fff; font-size: 14px; outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus { border-color: #3b82f6; }

        .toggle-password {
            position: absolute; right: 14px; background: none; border: none;
            color: #94a3b8; cursor: pointer; font-size: 16px;
        }
        
        .submit-btn {
            width: 100%; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: #fff; border: none; padding: 13px; border-radius: 10px;
            font-weight: 900; font-size: 14px; cursor: pointer; margin-top: 6px;
            text-transform: uppercase; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: transform 0.2s;
        }
        .submit-btn:hover { transform: scale(1.02); }

        .error-msg { background: rgba(231, 76, 60, 0.15); border: 1px solid #e74c3c; color: #e74c3c; padding: 10px; border-radius: 8px; font-size: 12px; text-align: center; margin-bottom: 14px; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand-title">⚡ fm4bat Gaming</div>
        
        <div class="tab-buttons">
            <a href="/login" class="tab-btn">Login</a>
            <a href="/register" class="tab-btn active">Sign Up</a>
        </div>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <!-- Signup Form -->
        <form action="/register" method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label>Email or Mobile</label>
                <input type="text" name="identifier" required placeholder="Enter email or mobile">
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" name="password" id="signup-pass" required placeholder="Create a password">
                    <button type="button" class="toggle-password" onclick="togglePassword('signup-pass', this)">👁️</button>
                </div>
            </div>
            <button type="submit" class="submit-btn">Register & Start</button>
        </form>
    </div>

    <script>
        function togglePassword(fieldId, btn) {
            const field = document.getElementById(fieldId);
            if (field.type === "password") {
                field.type = "text";
                btn.innerText = "🙈";
            } else {
                field.type = "password";
                btn.innerText = "👁️";
            }
        }
    </script>

</body>
</html>
