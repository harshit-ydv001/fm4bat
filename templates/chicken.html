<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Road - Fm4bat</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .game-wrapper {
            width: 100%;
            max-width: 680px;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #475569;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            padding: 12px 18px;
            border-bottom: 2px solid #374151;
            font-weight: bold;
            font-size: 14px;
        }
        .logo-box {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ef4444;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px #000;
        }
        .online-tag {
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 12px;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .balance-box {
            background: #1f2937;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #4b5563;
            color: #22c55e;
            font-size: 15px;
        }
        .canvas-area {
            position: relative;
            width: 100%;
            height: 420px;
            background: #27272a;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .control-panel {
            background: #1e293b;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            border-top: 1px solid #334155;
        }
        .bet-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .quick-bets {
            display: flex;
            gap: 6px;
        }
        .q-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            transition: 0.1s;
        }
        .q-btn:hover {
            background: #475569;
        }
        .main-bet-input {
            flex: 1;
            display: flex;
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #475569;
            overflow: hidden;
        }
        .main-bet-input button {
            background: #334155;
            color: white;
            border: none;
            padding: 0 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .main-bet-input input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            outline: none;
        }
        .diff-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .diff-buttons {
            display: flex;
            gap: 6px;
        }
        .diff-btn {
            background: #334155;
            color: #94a3b8;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .diff-btn.active {
            background: #eab308;
            color: #000;
        }
        .action-button {
            background: #22c55e;
            color: #ffffff;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
            transition: 0.1s;
        }
        .action-button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="logo-box">🐔 CHICKEN ROAD</div>
            <div class="online-tag">Online: 11703</div>
            <div class="balance-box" id="balanceDisplay">₹1000.00</div>
        </div>

        <!-- Canvas Game View -->
        <div class="canvas-area">
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <div class="bet-row">
                <div class="quick-bets">
                    <button class="q-btn" onclick="setBet(2)">2</button>
                    <button class="q-btn" onclick="setBet(5)">5</button>
                    <button class="q-btn" onclick="setBet(10)">10</button>
                    <button class="q-btn" onclick="setBet(20)">20</button>
                </div>
                <div class="main-bet-input">
                    <button onclick="changeBet(-1)">-</button>
                    <input type="text" id="betInput" value="1.00">
                    <button onclick="changeBet(1)">+</button>
                </div>
            </div>

            <div class="diff-row">
                <span style="font-size: 13px; color: #94a3b8; font-weight: 600;">Difficulty</span>
                <div class="diff-buttons">
                    <button class="diff-btn active" data-diff="easy" onclick="setDiff('easy', this)">Easy</button>
                    <button class="diff-btn" data-diff="medium" onclick="setDiff('medium', this)">Medium</button>
                    <button class="diff-btn" data-diff="hard" onclick="setDiff('hard', this)">Hard</button>
                    <button class="diff-btn" data-diff="hardcore" onclick="setDiff('hardcore', this)">Hardcore</button>
                </div>
            </div>

            <button id="actionBtn" class="action-button" onclick="handleActionButton()">Play</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 680;
        canvas.height = 420;

        let balance = 1000.00;
        let gameState = 'IDLE'; // IDLE, PLAYING, WON, GAMEOVER
        let currentLane = 0; // 0 = grass, 1 to 5 = lanes
        let difficulty = 'easy';

        const multipliers = [1.00, 1.10, 1.25, 1.50, 1.80, 2.20];

        // Lanes setup with realistic vehicle types
        const lanes = [
            { y: 350, speed: 0, cars: [] },
            { y: 290, speed: 2.2, cars: [{x: 120, type: 'police', color: '#ffffff'}, {x: 460, type: 'taxi', color: '#eab308'}] },
            { y: 230, speed: -2.8, cars: [{x: 200, type: 'car', color: '#3b82f6'}, {x: 520, type: 'truck', color: '#f97316'}] },
            { y: 170, speed: 3.2, cars: [{x: 100, type: 'ice', color: '#06b6d4'}, {x: 420, type: 'fire', color: '#ef4444'}] },
            { y: 110, speed: -3.8, cars: [{x: 180, type: 'taxi', color: '#eab308'}, {x: 480, type: 'car', color: '#a855f7'}] },
            { y: 50, speed: 4.2, cars: [{x: 250, type: 'truck', color: '#22c55e'}, {x: 550, type: 'police', color: '#ffffff'}] }
        ];

        let chicken = { x: 50, y: 350, animFrame: 0 };

        function setBet(val) {
            if (gameState === 'PLAYING') return;
            document.getElementById('betInput').value = val.toFixed(2);
        }

        function changeBet(amt) {
            if (gameState === 'PLAYING') return;
            let val = parseFloat(document.getElementById('betInput').value) || 1;
            val = Math.max(1, val + amt);
            document.getElementById('betInput').value = val.toFixed(2);
        }

        function setDiff(d, btn) {
            if (gameState === 'PLAYING') return;
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            difficulty = d;
        }

        function handleActionButton() {
            let bet = parseFloat(document.getElementById('betInput').value) || 1.00;

            if (gameState === 'IDLE' || gameState === 'GAMEOVER' || gameState === 'WON') {
                if (balance < bet) {
                    alert("Insufficient Balance!");
                    return;
                }
                balance -= bet;
                updateBalance();
                gameState = 'PLAYING';
                currentLane = 0;
                chicken.x = 50;
                chicken.y = lanes[0].y;
                document.getElementById('actionBtn').innerText = "GO / NEXT LANE";
                document.getElementById('actionBtn').style.background = "#eab308";
                document.getElementById('actionBtn').style.color = "#000";
            } else if (gameState === 'PLAYING') {
                if (currentLane < 5) {
                    let risk = difficulty === 'easy' ? 0.05 : difficulty === 'medium' ? 0.15 : difficulty === 'hard' ? 0.25 : 0.40;
                    if (currentLane >= 2 && Math.random() < risk) {
                        gameState = 'GAMEOVER';
                        document.getElementById('actionBtn').innerText = "CRASHED! PLAY AGAIN";
                        document.getElementById('actionBtn').style.background = "#ef4444";
                        document.getElementById('actionBtn').style.color = "#fff";
                        return;
                    }

                    currentLane++;
                    chicken.y = lanes[currentLane].y;

                    if (currentLane === 5) {
                        gameState = 'WON';
                        let winAmt = bet * multipliers[5];
                        balance += winAmt;
                        updateBalance();
                        document.getElementById('actionBtn').innerText = `WON ₹${winAmt.toFixed(2)}! PLAY AGAIN`;
                        document.getElementById('actionBtn').style.background = "#22c55e";
                        document.getElementById('actionBtn').style.color = "#fff";
                    } else {
                        document.getElementById('actionBtn').innerText = `CASH OUT / NEXT (${multipliers[currentLane]}x)`;
                    }
                }
            }
        }

        function updateBalance() {
            document.getElementById('balanceDisplay').innerText = `₹${balance.toFixed(2)}`;
        }

        function updateGame() {
            lanes.forEach((lane, index) => {
                if (index === 0) return;
                let speedMult = difficulty === 'medium' ? 1.3 : difficulty === 'hard' ? 1.6 : difficulty === 'hardcore' ? 2.0 : 1.0;
                lane.cars.forEach(car => {
                    car.x += lane.speed * speedMult;
                    if (car.x > canvas.width + 60) car.x = -90;
                    if (car.x < -90) car.x = canvas.width + 60;

                    // Collision detection
                    if (gameState === 'PLAYING' && currentLane === index) {
                        if (Math.abs(chicken.x - car.x) < 40) {
                            gameState = 'GAMEOVER';
                            document.getElementById('actionBtn').innerText = "CRASHED! PLAY AGAIN";
                            document.getElementById('actionBtn').style.background = "#ef4444";
                            document.getElementById('actionBtn').style.color = "#fff";
                        }
                    }
                });
            });
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Left Grass Area (Start platform)
            ctx.fillStyle = '#166534';
            ctx.fillRect(0, 0, 110, canvas.height);
            ctx.fillStyle = '#15803d';
            ctx.fillRect(90, 0, 20, canvas.height);

            // Trees on grass
            ctx.fillStyle = '#14532d';
            ctx.beginPath(); ctx.arc(55, 90, 26, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(55, 230, 26, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(55, 370, 26, 0, Math.PI*2); ctx.fill();

            // 2. Asphalt Road background
            ctx.fillStyle = '#262626';
            ctx.fillRect(110, 0, canvas.width - 110, canvas.height);

            // White dashed lane markers
            ctx.strokeStyle = '#a1a1aa';
            ctx.lineWidth = 2;
            ctx.setLineDash([12, 12]);
            for (let i = 1; i < 6; i++) {
                let yPos = i * 60;
                ctx.beginPath();
                ctx.moveTo(110, yPos);
                ctx.lineTo(canvas.width, yPos);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            // 3. Multiplier Manholes (Circles) on the right side of lanes
            lanes.forEach((lane, index) => {
                if (index === 0) return;
                let circleX = 490 + (index * 28);
                
                // Manhole cover outer rim
                ctx.fillStyle = '#52525b';
                ctx.beginPath(); ctx.arc(circleX, lane.y + 30, 24, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#d4d4d8'; ctx.lineWidth = 2; ctx.stroke();

                // Multiplier label
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`${multipliers[index]}x`, circleX, lane.y + 34);
            });

            // 4. Draw detailed Vehicles (Cars, Trucks, Police, etc.)
            lanes.forEach((lane, index) => {
                if (index === 0) return;
                lane.cars.forEach(car => {
                    ctx.save();
                    ctx.translate(car.x, lane.y + 10);

                    // Vehicle body base
                    ctx.fillStyle = car.color;
                    ctx.roundRect(0, 0, 56, 36, 6);
                    ctx.fill();
                    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();

                    // Windshield
                    ctx.fillStyle = '#93c5fd';
                    ctx.fillRect(12, 6, 22, 12);

                    // Details based on vehicle type
                    if (car.type === 'police') {
                        ctx.fillStyle = '#ef4444'; ctx.fillRect(20, -4, 6, 4);
                        ctx.fillStyle = '#3b82f6'; ctx.fillRect(28, -4, 6, 4);
                    } else if (car.type === 'truck') {
                        ctx.fillStyle = '#1e293b';
                        ctx.fillRect(40, 2, 14, 32);
                    }

                    ctx.restore();
                });
            });

            // 5. Draw Animated Chicken Player
            let targetX = currentLane === 0 ? 60 : 200 + (currentLane * 55);
            chicken.x += (targetX - chicken.x) * 0.2;

            ctx.font = '30px Arial';
            ctx.textAlign = 'center';
            let chickenEmoji = gameState === 'GAMEOVER' ? '💥' : '🐔';
            ctx.fillText(chickenEmoji, chicken.x, chicken.y + 38);
        }

        function gameLoop() {
            updateGame();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
