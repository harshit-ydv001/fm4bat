<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Road 2 - Fm4bat</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }
        .game-wrapper {
            width: 100%;
            max-width: 760px;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            overflow: hidden;
            border: 1px solid #475569;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            padding: 10px 16px;
            border-bottom: 2px solid #374151;
            font-size: 13px;
        }
        .logo-main { color: #ffffff; font-weight: 900; font-size: 16px; }
        .logo-sub { color: #ef4444; font-weight: 900; font-size: 16px; }
        .balance-pill { color: #22c55e; font-weight: bold; font-size: 14px; }
        .canvas-area {
            position: relative;
            width: 100%;
            background: #27272a;
            aspect-ratio: 720 / 420;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .control-panel {
            background: #1e293b;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top: 1px solid #334155;
        }
        .bet-presets { display: flex; gap: 12px; align-items: center; justify-content: center; }
        .quick-bet-chips { display: flex; gap: 6px; }
        .chip-btn { background: #334155; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .action-bar { display: flex; width: 100%; }
        .play-main-btn {
            width: 100%;
            background: #22c55e;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }
        .playing-btns-group { display: flex; width: 100%; gap: 10px; }
        .cashout-action-btn { flex: 2; background: #eab308; color: #000; border: none; padding: 14px; font-size: 16px; font-weight: 900; border-radius: 8px; cursor: pointer; text-align: center; }
        .go-action-btn { flex: 1; background: #22c55e; color: #fff; border: none; padding: 14px; font-size: 18px; font-weight: 900; border-radius: 8px; cursor: pointer; text-align: center; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="top-bar">
            <div class="logo-area">
                <span class="logo-main">CHICKEN</span><span class="logo-sub">2ROAD</span>
            </div>
            <div class="balance-pill" id="balanceDisplay">999 693.3 Ⓢ</div>
        </div>

        <div class="canvas-area">
            <canvas id="gameCanvas" width="720" height="420"></canvas>
        </div>

        <div class="control-panel">
            <div class="bet-presets">
                <div class="quick-bet-chips">
                    <button class="chip-btn" onclick="setBetVal(2)">2 $</button>
                    <button class="chip-btn" onclick="setBetVal(3)">3 $</button>
                    <button class="chip-btn" onclick="setBetVal(8)">8 $</button>
                    <button class="chip-btn" onclick="setBetVal(20)">20 $</button>
                </div>
            </div>

            <div class="action-bar">
                <button id="playBtn" class="play-main-btn" onclick="startPlay()">PLAY</button>
                <div id="playingActionBtns" class="playing-btns-group" style="display: none;">
                    <button id="cashoutBtn" class="cashout-action-btn" onclick="cashOutGame()">CASH OUT <span id="cashoutAmt">28.8</span> $</button>
                    <button id="goBtn" class="go-action-btn" onclick="goNextLane()">GO</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let balance = 999693.30;
        let gameState = 'IDLE'; 
        let currentStep = 0; // 0 to 5 lanes
        let betAmount = 20.00;
        let lastTime = 0;

        // Exact image filenames from your folder
        const imgBg = new Image(); imgBg.src = '/static/images/BG Chicken Road 2.png';
        const imgChicken = new Image(); imgChicken.src = '/static/images/chicken.png';
        const imgRip = new Image(); imgRip.src = '/static/images/cheken_rip.png';
        const imgBarrier = new Image(); imgBarrier.src = '/static/images/barrier (1).png';
        const imgHatch = new Image(); imgHatch.src = '/static/images/hatch.png';
        const imgCar = new Image(); imgCar.src = '/static/images/car.png';

        const multipliers = [1.44, 2.21, 3.45, 5.53, 9.09];
        const laneXPositions = [185, 290, 395, 500, 605]; // Exact X positions matching reference background

        // 5 Traffic Lanes configuration matching video reference
        let lanes = [
            { x: 185, dir: 1, speed: 140, cars: [{y: 30}] },
            { x: 290, dir: -1, speed: 170, cars: [{y: 320}] },
            { x: 395, dir: 1, speed: 150, cars: [{y: 80}] },
            { x: 500, dir: -1, speed: 190, cars: [{y: 280}] },
            { x: 605, dir: 1, speed: 160, cars: [{y: 50}] }
        ];

        let chicken = { x: 75, y: 310 };

        function setBetVal(val) {
            if (gameState === 'PLAYING') return;
            betAmount = val;
        }

        function startPlay() {
            if (balance < betAmount) {
                alert("Insufficient balance!");
                return;
            }
            balance -= betAmount;
            document.getElementById('balanceDisplay').innerText = `${balance.toFixed(1)} Ⓢ`;
            gameState = 'PLAYING';
            currentStep = 0;
            chicken.x = 75;
            chicken.y = 310;

            document.getElementById('playBtn').style.display = 'none';
            document.getElementById('playingActionBtns').style.display = 'flex';
            updateCashoutDisplay();
        }

        function goNextLane() {
            if (gameState === 'PLAYING' && currentStep < 5) {
                // Check collision on target lane
                let targetLane = lanes[currentStep];
                let hitCar = false;
                targetLane.cars.forEach(car => {
                    if (car.y > 100 && car.y < 350) {
                        hitCar = true;
                    }
                });

                if (hitCar || Math.random() < 0.05) {
                    gameState = 'GAMEOVER';
                    endGame("CRASHED! PLAY AGAIN", "#ef4444");
                    return;
                }

                currentStep++;
                if (currentStep >= 5) {
                    let winAmt = betAmount * multipliers[4];
                    balance += winAmt;
                    gameState = 'WON';
                    endGame(`WON ₹${winAmt.toFixed(2)}! PLAY AGAIN`, "#22c55e");
                } else {
                    chicken.x = laneXPositions[currentStep - 1] - 15;
                    updateCashoutDisplay();
                }
            }
        }

        function cashOutGame() {
            if (gameState === 'PLAYING' && currentStep > 0) {
                let mult = multipliers[currentStep - 1];
                let winAmt = betAmount * mult;
                balance += winAmt;
                document.getElementById('balanceDisplay').innerText = `${balance.toFixed(1)} Ⓢ`;
                gameState = 'WON';
                endGame(`CASH OUT ₹${winAmt.toFixed(2)}! PLAY AGAIN`, "#22c55e");
            }
        }

        function updateCashoutDisplay() {
            let mult = multipliers[Math.min(currentStep, multipliers.length - 1)];
            let amt = betAmount * mult;
            document.getElementById('cashoutAmt').innerText = `${amt.toFixed(1)} $`;
        }

        function endGame(text, bgColor) {
            document.getElementById('playingActionBtns').style.display = 'none';
            let playBtn = document.getElementById('playBtn');
            playBtn.style.display = 'block';
            playBtn.innerText = text;
            playBtn.style.background = bgColor;
        }

        function update(deltaTime) {
            if (gameState !== 'PLAYING') return;

            lanes.forEach((lane, index) => {
                if (index < currentStep) return; // Stop active traffic check behind barriers

                lane.cars.forEach(car => {
                    car.y += lane.speed * lane.dir * deltaTime;

                    if (car.y > canvas.height + 60) car.y = -100;
                    if (car.y < -100) car.y = canvas.height + 60;

                    // Collision detection with chicken
                    if (gameState === 'PLAYING' && currentStep === index) {
                        let chickenBox = { x: chicken.x, y: chicken.y, w: 35, h: 35 };
                        let carBox = { x: lane.x - 22, y: car.y, w: 44, h: 60 };

                        if (
                            chickenBox.x < carBox.x + carBox.w &&
                            chickenBox.x + chickenBox.w > carBox.x &&
                            chickenBox.y < carBox.y + carBox.h &&
                            chickenBox.y + chickenBox.h > carBox.y
                        ) {
                            gameState = 'GAMEOVER';
                            endGame("CRASHED! PLAY AGAIN", "#ef4444");
                        }
                    }
                });
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Reference Background (BG Chicken Road 2.png) perfectly fitted
            if (imgBg.complete && imgBg.naturalWidth > 0) {
                ctx.drawImage(imgBg, 0, 0, canvas.width, canvas.height);
            }

            // 2. Draw Barriers on crossed lanes (barrier (1).png)
            for (let i = 0; i < currentStep; i++) {
                let lx = laneXPositions[i];
                if (imgBarrier.complete) {
                    ctx.drawImage(imgBarrier, lx - 25, 230, 50, 32);
                }
            }

            // 3. Draw Cars inside active road lanes (car.png)
            lanes.forEach((lane, index) => {
                if (index < currentStep) return;
                lane.cars.forEach(car => {
                    if (imgCar.complete) {
                        ctx.save();
                        ctx.translate(lane.x, car.y + 30);
                        if (lane.dir === -1) ctx.scale(1, -1);
                        ctx.drawImage(imgCar, -22, -30, 44, 60);
                        ctx.restore();
                    }
                });
            });

            // 4. Chicken positioning & rendering (chicken.png or cheken_rip.png)
            if (gameState === 'GAMEOVER') {
                if (imgRip.complete) {
                    ctx.drawImage(imgRip, chicken.x - 10, chicken.y - 10, 45, 45);
                }
            } else {
                if (imgChicken.complete) {
                    ctx.drawImage(imgChicken, chicken.x, chicken.y, 40, 40);
                }
            }
        }

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let deltaTime = (timestamp - lastTime) / 1000;
            if (deltaTime > 0.1) deltaTime = 0.1;
            lastTime = timestamp;

            update(deltaTime);
            draw();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
