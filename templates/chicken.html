<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Road Game - Fm4bat</title>
    <link rel="stylesheet" href="/static/css/chicken.css">
    <style>
        body { background-color: #0b0f19; color: #fff; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; }
        .game-wrapper { width: 100%; max-width: 720px; background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #475569; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #111827; padding: 10px 16px; border-bottom: 2px solid #374151; }
        .canvas-area { position: relative; width: 100%; height: 420px; background: #27272a; }
        canvas { display: block; width: 100%; height: 100%; }
        .control-panel { background: #1e293b; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
        .action-bar { display: flex; width: 100%; }
        .play-main-btn { width: 100%; background: #22c55e; color: #fff; border: none; padding: 14px; font-size: 18px; font-weight: 900; border-radius: 8px; cursor: pointer; text-align: center; }
        .playing-btns-group { display: flex; width: 100%; gap: 10px; }
        .cashout-action-btn { flex: 2; background: #eab308; color: #000; border: none; padding: 14px; font-size: 16px; font-weight: 900; border-radius: 8px; cursor: pointer; }
        .go-action-btn { flex: 1; background: #22c55e; color: #fff; border: none; padding: 14px; font-size: 18px; font-weight: 900; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="top-bar">
            <div><span style="color:#fff; font-weight:900;">CHICKEN</span><span style="color:#ef4444; font-weight:900;">2ROAD</span></div>
            <div id="balanceDisplay" style="color:#22c55e; font-weight:bold;">1,000,000.00 Ⓢ</div>
        </div>

        <div class="canvas-area">
            <canvas id="gameCanvas" width="720" height="420"></canvas>
        </div>

        <div class="control-panel">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span>Difficulty: <strong id="diffLabel" style="color:#22c55e;">Easy</strong></span>
                <button onclick="toggleDifficulty()" style="padding:4px 8px; background:#374151; color:#fff; border:none; border-radius:4px; cursor:pointer;">Change</button>
            </div>
            <div class="action-bar">
                <button id="playBtn" class="play-main-btn" onclick="startPlay()">PLAY</button>
                <div id="playingActionBtns" class="playing-btns-group" style="display: none;">
                    <button id="cashoutBtn" class="cashout-action-btn" onclick="cashOutGame()">COLLECT TOKENS (<span id="cashoutAmt">0.0</span>)</button>
                    <button id="goBtn" class="go-action-btn" onclick="goNextLane()">GO</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game State Variables
        let balance = 1000000.00;
        let gameState = 'IDLE'; // IDLE, PLAYING, WON, GAMEOVER
        let currentStep = 0;
        let cameraY = 0;
        let difficulty = 'easy';
        let lastTime = 0;

        // Authoritative Road Boundaries (Strictly inside asphalt road)
        const roadLeft = 160;
        const roadRight = 680;
        const roadWidth = roadRight - roadLeft;
        const laneCount = 5;
        const laneWidth = roadWidth / laneCount;

        const multipliers = [1.00, 1.09, 1.25, 1.43, 1.66, 1.94, 2.30, 2.80];

        // Load PNG Assets cleanly with alpha transparency support
        const imgBg = new Image(); imgBg.src = '/static/images/bg.png';
        const imgChicken = new Image(); imgChicken.src = '/static/images/chicken.png';
        const imgRip = new Image(); imgRip.src = '/static/images/cheken_rip.png';
        const imgBarrier = new Image(); imgBarrier.src = '/static/images/barrier.png';
        const imgCarSheet = new Image(); imgCarSheet.src = '/static/images/car-1.png';

        // Lanes setup strictly using road boundaries
        let lanes = [];
        function initLanes() {
            lanes = [];
            for (let i = 0; i < 25; i++) {
                let laneCenter = roadLeft + (i % laneCount) + (i % laneCount + 0.5) * laneWidth;
                // Correct precise lane center mapping
                let preciseX = roadLeft + ((i % laneCount) + 0.5) * laneWidth;
                lanes.push({
                    x: preciseX,
                    dir: i % 2 === 0 ? 1 : -1, // Alternating directions (1: Down, -1: Up)
                    speed: 140 + (i % 3) * 35, // pixels per second
                    cars: [
                        { y: -100 - (i * 120), type: i % 4 },
                        { y: 500 + (i * 120), type: (i + 1) % 4 }
                    ]
                });
            }
        }
        initLanes();

        let chicken = { x: 70, y: 340, worldY: 340 };

        function toggleDifficulty() {
            if (gameState === 'PLAYING') return;
            if (difficulty === 'easy') difficulty = 'medium';
            else if (difficulty === 'medium') difficulty = 'hard';
            else if (difficulty === 'hard') difficulty = 'hardcore';
            else difficulty = 'easy';
            document.getElementById('diffLabel').innerText = difficulty.toUpperCase();
        }

        function startPlay() {
            balance -= 3.00;
            document.getElementById('balanceDisplay').innerText = `${balance.toFixed(2)} Ⓢ`;
            gameState = 'PLAYING';
            currentStep = 0;
            cameraY = 0;
            chicken.x = 70;
            chicken.worldY = 340;
            initLanes();

            document.getElementById('playBtn').style.display = 'none';
            document.getElementById('playingActionBtns').style.display = 'flex';
            updateCashoutDisplay();
        }

        function goNextLane() {
            if (gameState === 'PLAYING') {
                currentStep++;
                cameraY = currentStep * 65; // Smooth camera scroll
                updateCashoutDisplay();
            }
        }

        function cashOutGame() {
            if (gameState === 'PLAYING' && currentStep > 0) {
                let mult = multipliers[Math.min(currentStep, multipliers.length - 1)];
                let winAmt = 3.00 * mult;
                balance += winAmt;
                document.getElementById('balanceDisplay').innerText = `${balance.toFixed(2)} Ⓢ`;
                gameState = 'WON';
                endGame(`COLLECTED ₹${winAmt.toFixed(2)}! PLAY AGAIN`, "#22c55e");
            }
        }

        function updateCashoutDisplay() {
            let mult = multipliers[Math.min(currentStep + 1, multipliers.length - 1)];
            let amt = 3.00 * mult;
            document.getElementById('cashoutAmt').innerText = amt.toFixed(2);
        }

        function endGame(text, bgColor) {
            document.getElementById('playingActionBtns').style.display = 'none';
            let playBtn = document.getElementById('playBtn');
            playBtn.style.display = 'block';
            playBtn.innerText = text;
            playBtn.style.background = bgColor;
        }

        function update(deltaTime) {
            if (gameState !== 'PLAYING') return;

            let speedMultiplier = difficulty === 'medium' ? 1.3 : difficulty === 'hard' ? 1.6 : difficulty === 'hardcore' ? 2.0 : 1.0;

            lanes.forEach((lane, index) => {
                if (index < currentStep) return; // Stop traffic behind barriers

                lane.cars.forEach(car => {
                    car.y += lane.speed * lane.dir * speedMultiplier * deltaTime;

                    // Recycling vehicles cleanly within road bounds
                    if (car.y > canvas.height + 100) car.y = -150;
                    if (car.y < -150) car.y = canvas.height + 100;

                    // Precise Bounding Box Collision Detection
                    if (gameState === 'PLAYING' && currentStep === index) {
                        let chickenBox = {
                            x: chicken.x - 14,
                            y: chicken.y - 14,
                            w: 28,
                            h: 28
                        };
                        let carBox = {
                            x: lane.x - 20,
                            y: car.y,
                            w: 40,
                            h: 50
                        };

                        // Check collision
                        if (
                            chickenBox.x < carBox.x + carBox.w &&
                            chickenBox.x + chickenBox.w > carBox.x &&
                            chickenBox.y < carBox.y + carBox.h &&
                            chickenBox.y + chickenBox.h > carBox.y
                        ) {
                            gameState = 'GAMEOVER';
                            endGame("CRASHED! PLAY AGAIN", "#ef4444");
                        }
                    }
                });
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(0, cameraY);

            // Draw Background seamlessly
            if (imgBg.complete && imgBg.naturalWidth > 0) {
                for (let i = -2; i < 5; i++) {
                    ctx.drawImage(imgBg, 0, i * canvas.height, canvas.width, canvas.height);
                }
            }

            // Draw Barriers behind chicken on crossed lanes (Strictly on road lanes)
            for (let i = 0; i < currentStep; i++) {
                let lane = lanes[i];
                if (imgBarrier.complete) {
                    ctx.drawImage(imgBarrier, lane.x - 22, 280 - (i * 65), 44, 26);
                }
            }

            // Draw Cars (Strictly constrained between roadLeft and roadRight)
            if (imgCarSheet.complete && imgCarSheet.naturalWidth > 0) {
                let totalCars = 4;
                let sw = imgCarSheet.naturalWidth / totalCars;
                let sh = imgCarSheet.naturalHeight;

                lanes.forEach((lane, index) => {
                    if (index < currentStep) return;
                    lane.cars.forEach(car => {
                        // Strict boundary enforcement
                        if (lane.x >= roadLeft && lane.x <= roadRight) {
                            ctx.save();
                            ctx.translate(lane.x, car.y + 25);
                            if (lane.dir === -1) ctx.scale(1, -1);
                            
                            ctx.drawImage(
                                imgCarSheet,
                                car.type * sw, 0, sw, sh,
                                -20, -25, 40, 50
                            );
                            ctx.restore();
                        }
                    });
                });
            }

            // Draw Multiplier Hatches for upcoming lanes
            lanes.forEach((lane, index) => {
                if (index >= currentStep) {
                    let hatchY = 340 - (index * 65);
                    if (imgHatch.complete) {
                        ctx.drawImage(imgHatch, lane.x - 24, hatchY - 24, 48, 48);
                    }
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 11px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`${multipliers[Math.min(index + 1, multipliers.length - 1)]}x`, lane.x, hatchY + 4);
                }
            });

            // Smooth Chicken Movement towards target lane center
            let targetX = currentStep === 0 ? 70 : lanes[currentStep - 1].x;
            chicken.x += (targetX - chicken.x) * 0.2;
            let targetY = 340 - (currentStep * 65);
            chicken.y += (targetY - chicken.y) * 0.2;

            if (gameState === 'GAMEOVER') {
                if (imgRip.complete) {
                    ctx.drawImage(imgRip, chicken.x - 20, chicken.y - 20, 40, 40);
                }
            } else {
                if (imgChicken.complete) {
                    ctx.drawImage(imgChicken, chicken.x - 18, chicken.y - 18, 36, 36);
                }
            }

            ctx.restore();
        }

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let deltaTime = (timestamp - lastTime) / 1000;
            if (deltaTime > 0.1) deltaTime = 0.1; // Cap delta time
            lastTime = timestamp;

            update(deltaTime);
            draw();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
