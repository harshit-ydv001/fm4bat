<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Road Game - Fm4bat</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .game-container {
            width: 100%;
            max-width: 450px;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            height: 350px;
            background: #111827;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .controls-section {
            padding: 15px;
            background: #1e293b;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .bet-control {
            display: flex;
            align-items: center;
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
            overflow: hidden;
        }
        .bet-control button {
            background: #334155;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: bold;
        }
        .bet-control input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
        }
        .difficulty-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .diff-btn {
            background: #334155;
            color: #94a3b8;
            border: none;
            padding: 8px 4px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .diff-btn.active {
            background: #3b82f6;
            color: white;
        }
        .action-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .action-btn:hover {
            background: #16a34a;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Header -->
        <div class="game-header">
            <span>🐔 CHICKEN ROAD</span>
            <span>Balance: ₹1000.00</span>
        </div>

        <!-- Canvas Game Area -->
        <div class="canvas-container">
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- Controls Section -->
        <div class="controls-section">
            <!-- Bet Control -->
            <div class="bet-control">
                <button id="decreaseBet">-</button>
                <input type="text" id="betAmount" value="1.00">
                <button id="increaseBet">+</button>
            </div>

            <!-- Difficulty Selector -->
            <div class="difficulty-selector">
                <button class="diff-btn active" data-diff="easy">Easy</button>
                <button class="diff-btn" data-diff="medium">Medium</button>
                <button class="diff-btn" data-diff="hard">Hard</button>
                <button class="diff-btn" data-diff="hardcore">Hardcore</button>
            </div>

            <!-- Action Button -->
            <button id="actionBtn" class="action-btn">Play</button>
        </div>
    </div>

    <!-- Inline Game Script -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 400;
        canvas.height = 350;

        let gameState = 'IDLE';
        let currentLane = 0;
        let betAmount = 1.00;
        let currentMultiplier = 1.00;
        let difficulty = 'easy';

        const multipliers = [1.00, 1.10, 1.25, 1.50, 1.80, 2.20];

        const lanes = [
            { y: 300, cars: [], speed: 0 },
            { y: 250, cars: [], speed: 2 },
            { y: 200, cars: [], speed: -3 },
            { y: 150, cars: [], speed: 2.5 },
            { y: 100, cars: [], speed: -3.5 },
            { y: 50, cars: [], speed: 4 }
        ];

        function setupDifficulty() {
            let speedMultiplier = 1;
            if (difficulty === 'medium') speedMultiplier = 1.3;
            if (difficulty === 'hard') speedMultiplier = 1.7;
            if (difficulty === 'hardcore') speedMultiplier = 2.2;

            lanes.forEach((lane, index) => {
                if (index === 0 || index === 5) return;
                lane.cars = [
                    { x: 50, width: 40, color: '#ef4444' },
                    { x: 220, width: 40, color: '#eab308' }
                ];
                lane.currentSpeed = lane.speed * speedMultiplier;
            });
        }

        let chicken = { x: 180, y: 300, size: 20 };

        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (gameState === 'PLAYING') return;
                document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                difficulty = e.target.dataset.diff;
                setupDifficulty();
            });
        });

        const betInput = document.getElementById('betAmount');
        document.getElementById('decreaseBet').addEventListener('click', () => {
            if (gameState === 'PLAYING') return;
            let val = parseFloat(betInput.value) || 1;
            if (val > 1) {
                betInput.value = (val - 1).toFixed(2);
            }
        });
        document.getElementById('increaseBet').addEventListener('click', () => {
            if (gameState === 'PLAYING') return;
            let val = parseFloat(betInput.value) || 1;
            betInput.value = (val + 1).toFixed(2);
        });

        const actionBtn = document.getElementById('actionBtn');
        actionBtn.addEventListener('click', () => {
            if (gameState === 'IDLE' || gameState === 'GAMEOVER' || gameState === 'WON') {
                startGame();
            } else if (gameState === 'PLAYING') {
                moveChickenForward();
            }
        });

        function startGame() {
            betAmount = parseFloat(betInput.value) || 1.00;
            gameState = 'PLAYING';
            currentLane = 0;
            currentMultiplier = multipliers[0];
            chicken.x = 180;
            chicken.y = lanes[0].y;
            setupDifficulty();
            actionBtn.innerText = "TAP TO CROSS LANE";
            actionBtn.style.background = "#eab308";
        }

        function moveChickenForward() {
            if (currentLane < 5) {
                currentLane++;
                chicken.y = lanes[currentLane].y;
                currentMultiplier = multipliers[currentLane];

                if (currentLane === 5) {
                    gameState = 'WON';
                    let winnings = (betAmount * currentMultiplier).toFixed(2);
                    actionBtn.innerText = `COLLECTED ₹${winnings}! PLAY AGAIN`;
                    actionBtn.style.background = "#22c55e";
                } else {
                    actionBtn.innerText = `COLLECT / NEXT (${currentMultiplier}x)`;
                }
            }
        }

        function update() {
            if (gameState === 'PLAYING') {
                lanes.forEach((lane, index) => {
                    if (index === 0 || index === 5) return;
                    lane.cars.forEach(car => {
                        car.x += lane.currentSpeed;
                        if (car.x > canvas.width) car.x = -car.width;
                        if (car.x < -car.width) car.x = canvas.width;

                        if (currentLane === index) {
                            if (chicken.x < car.x + car.width &&
                                chicken.x + chicken.size > car.x &&
                                chicken.y < lane.y + 25 &&
                                chicken.y + chicken.size > lane.y) {
                                gameState = 'GAMEOVER';
                                actionBtn.innerText = "CRASHED! PLAY AGAIN";
                                actionBtn.style.background = "#ef4444";
                            }
                        }
                    });
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            lanes.forEach((lane, index) => {
                if (index > 0 && index < 5) {
                    ctx.fillStyle = '#374151';
                    ctx.fillRect(0, lane.y, canvas.width, 30);

                    lane.cars.forEach(car => {
                        ctx.fillStyle = car.color;
                        ctx.fillRect(car.x, lane.y + 5, car.width, 20);
                    });
                }
            });

            lanes.forEach((lane, index) => {
                if (index > 0) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.font = '12px Arial';
                    ctx.fillText(`${multipliers[index]}x`, 10, lane.y + 20);
                }
            });

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(chicken.x + 10, chicken.y + 10, 10, 0, Math.PI * 2);
            ctx.fill();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        setupDifficulty();
        loop();
    </script>
</body>
</html>
