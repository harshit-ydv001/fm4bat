<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Road Game - Fm4bat</title>
    <link rel="stylesheet" href="/static/css/chicken.css">
</head>
<body>

    <div class="game-wrapper">
        <div class="top-bar">
            <div class="logo-area">
                <span class="logo-main">CHICKEN</span><span class="logo-sub">2ROAD</span>
            </div>
            <div class="live-wins-ticker" id="liveWinsTicker">
                <span class="win-badge">👑 Milanos</span> <span class="win-amt">+₹3816.00</span>
            </div>
            <div class="header-right">
                <button class="info-btn">ⓘ How to play?</button>
                <div class="balance-pill" id="balanceDisplay">₹1000.00 Ⓢ</div>
                <button class="fullscreen-btn">⛶</button>
            </div>
        </div>

        <div class="canvas-area">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="control-panel">
            <div class="bet-presets">
                <div class="min-max-group">
                    <button class="mm-btn" onclick="setBetMin()">MIN</button>
                    <input type="number" id="betMultiplierInput" value="3" style="width: 35px; text-align:center; background:#111827; color:#fff; border:1px solid #374151; border-radius:4px;">
                    <button class="mm-btn" onclick="setBetMax()">MAX</button>
                </div>
                <div class="quick-bet-chips">
                    <button class="chip-btn" onclick="setBetVal(2)">2 $</button>
                    <button class="chip-btn" onclick="setBetVal(3)">3 $</button>
                    <button class="chip-btn" onclick="setBetVal(8)">8 $</button>
                    <button class="chip-btn" onclick="setBetVal(20)">20 $</button>
                </div>
            </div>

            <div class="settings-row">
                <div class="diff-selector">
                    <span class="diff-label">Difficulty</span>
                    <div class="diff-buttons">
                        <button class="diff-btn active" onclick="setDifficulty('easy', this)">Easy</button>
                        <button class="diff-btn" onclick="setDifficulty('medium', this)">Medium</button>
                        <button class="diff-btn" onclick="setDifficulty('hard', this)">Hard</button>
                        <button class="diff-btn" onclick="setDifficulty('hardcore', this)">Hardcore</button>
                    </div>
                </div>
                <div class="chance-text">Chance of being shot down</div>
            </div>

            <div class="action-bar">
                <button id="playBtn" class="play-main-btn" onclick="startPlay()">Play</button>
                <div id="playingActionBtns" class="playing-btns-group" style="display: none;">
                    <button id="cashoutBtn" class="cashout-action-btn" onclick="cashOutGame()">CASH OUT <span id="cashoutAmt">0.0</span> $</button>
                    <button id="goBtn" class="go-action-btn" onclick="goNextLane()">GO</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 720;
        canvas.height = 380;

        let balance = 1000.00;
        let gameState = 'IDLE'; 
        let currentLane = 0; 
        let difficulty = 'easy';

        const multipliers = [1.00, 1.44, 2.21, 3.45, 5.53, 9.09];

        const lanes = [
            { x: 180, speed: 2.2, cars: [{y: 40, color: '#eab308'}, {y: 220, color: '#3b82f6'}] },
            { x: 280, speed: -2.8, cars: [{y: 80, color: '#ef4444'}, {y: 260, color: '#ffffff'}] },
            { x: 380, speed: 3.2, cars: [{y: 60, color: '#06b6d4'}, {y: 240, color: '#a855f7'}] },
            { x: 480, speed: -3.8, cars: [{y: 120, color: '#eab308'}, {y: 280, color: '#22c55e'}] },
            { x: 580, speed: 4.2, cars: [{y: 40, color: '#ef4444'}, {y: 180, color: '#ffffff'}] }
        ];

        let chicken = { x: 50, y: 190 };

        const playBtn = document.getElementById('playBtn');
        const playingActionBtns = document.getElementById('playingActionBtns');
        const cashoutBtn = document.getElementById('cashoutBtn');
        const cashoutAmt = document.getElementById('cashoutAmt');
        const goBtn = document.getElementById('goBtn');

        function setBetVal(val) {
            if (gameState === 'PLAYING') return;
            document.getElementById('betMultiplierInput').value = val;
        }
        function setBetMin() { setBetVal(2); }
        function setBetMax() { setBetVal(20); }

        function setDifficulty(diff, btn) {
            if (gameState === 'PLAYING') return;
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            difficulty = diff;
        }

        function getBetAmount() {
            return parseFloat(document.getElementById('betMultiplierInput').value) || 3.00;
        }

        function startPlay() {
            let bet = getBetAmount();
            if (balance < bet) {
                alert("Insufficient Balance!");
                return;
            }
            balance -= bet;
            updateBalance();
            gameState = 'PLAYING';
            currentLane = 0;
            chicken.x = 50;

            playBtn.style.display = 'none';
            playingActionBtns.style.display = 'flex';
            updateCashoutDisplay();
        }

        function goNextLane() {
            if (gameState === 'PLAYING' && currentLane < 5) {
                let risk = difficulty === 'easy' ? 0.05 : difficulty === 'medium' ? 0.15 : difficulty === 'hard' ? 0.25 : 0.40;
                if (currentLane >= 1 && Math.random() < risk) {
                    gameState = 'GAMEOVER';
                    endGame("CRASHED! PLAY AGAIN", "#ef4444");
                    return;
                }

                currentLane++;
                if (currentLane === 5) {
                    gameState = 'WON';
                    let winAmt = (getBetAmount() * multipliers[5]).toFixed(2);
                    balance += parseFloat(winAmt);
                    updateBalance();
                    endGame(`WON ₹${winAmt}! PLAY AGAIN`, "#22c55e");
                } else {
                    updateCashoutDisplay();
                }
            }
        }

        function cashOutGame() {
            if (gameState === 'PLAYING' && currentLane > 0) {
                let winAmt = (getBetAmount() * multipliers[currentLane]).toFixed(2);
                balance += parseFloat(winAmt);
                updateBalance();
                gameState = 'WON';
                endGame(`CASHED OUT ₹${winAmt}! PLAY AGAIN`, "#22c55e");
            }
        }

        function updateCashoutDisplay() {
            let amt = (getBetAmount() * multipliers[currentLane]).toFixed(1);
            cashoutAmt.innerText = amt;
        }

        function endGame(text, bgColor) {
            playingActionBtns.style.display = 'none';
            playBtn.style.display = 'block';
            playBtn.innerText = text;
            playBtn.style.background = bgColor;
        }

        function updateBalance() {
            document.getElementById('balanceDisplay').innerText = `₹${balance.toFixed(2)} Ⓢ`;
        }

        function update() {
            lanes.forEach((lane, index) => {
                // Cars stop moving on lanes where barrier is already placed
                if (index < currentLane) return;

                let speedMult = difficulty === 'medium' ? 1.3 : difficulty === 'hard' ? 1.6 : difficulty === 'hardcore' ? 2.0 : 1.0;
                lane.cars.forEach(car => {
                    car.y += lane.speed * speedMult;
                    if (car.y > canvas.height + 30) car.y = -50;
                    if (car.y < -50) car.y = canvas.height + 30;

                    // Collision check with car on active lane
                    if (gameState === 'PLAYING' && currentLane === index + 1) {
                        if (Math.abs(chicken.y - car.y) < 25 && Math.abs(chicken.x - lane.x) < 25) {
                            gameState = 'GAMEOVER';
                            endGame("CRASHED! PLAY AGAIN", "#ef4444");
                        }
                    }
                });
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grass area
            ctx.fillStyle = '#166534';
            ctx.fillRect(0, 0, 100, canvas.height);
            ctx.fillStyle = '#15803d';
            ctx.fillRect(85, 0, 15, canvas.height);

            ctx.font = '35px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('🌳', 50, 80);
            ctx.fillText('🌳', 50, 240);

            // Road
            ctx.fillStyle = '#374151';
            ctx.fillRect(100, 0, canvas.width - 100, canvas.height);

            ctx.strokeStyle = '#9ca3af';
            ctx.lineWidth = 2;
            ctx.setLineDash([12, 12]);
            for (let i = 1; i < 5; i++) {
                let xPos = 100 + (i * 120);
                ctx.beginPath();
                ctx.moveTo(xPos, 0);
                ctx.lineTo(xPos, canvas.height);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            // Manholes (Circles)
            lanes.forEach((lane, index) => {
                let circleX = lane.x;
                let circleY = 320;

                ctx.fillStyle = '#1f2937';
                ctx.beginPath();
                ctx.arc(circleX, circleY, 24, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#4b5563';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`${multipliers[index + 1]}x`, circleX, circleY + 4);
            });

            // Barriers on crossed lanes (Cars stop here)
            for (let i = 0; i < currentLane; i++) {
                let barrierX = lanes[i].x;
                ctx.font = '30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🚧', barrierX, 160);
            }

            // Cars
            lanes.forEach((lane, index) => {
                if (index < currentLane) return; // Do not animate cars behind barriers
                lane.cars.forEach(car => {
                    ctx.fillStyle = car.color;
                    ctx.fillRect(lane.x - 18, car.y, 36, 45);
                    ctx.fillStyle = '#93c5fd';
                    ctx.fillRect(lane.x - 12, car.y + 8, 24, 12);
                });
            });

            // Chicken landing directly inside the multiplier circle
            let targetX = currentLane === 0 ? 50 : lanes[currentLane - 1].x;
            chicken.x += (targetX - chicken.x) * 0.2;
            chicken.y = currentLane === 0 ? 190 : 310; // Lands right inside the circle

            ctx.font = '35px Arial';
            let chickenEmoji = gameState === 'GAMEOVER' ? '💥' : '🐔';
            ctx.fillText(chickenEmoji, chicken.x, chicken.y);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
