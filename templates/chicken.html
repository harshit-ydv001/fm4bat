<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Road Game - Fm4bat</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .game-container {
            width: 100%;
            max-width: 420px;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            font-weight: bold;
        }
        .lanes-container {
            padding: 15px;
            background: #0b0f19;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .lane-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .lane-mult {
            font-size: 14px;
            font-weight: bold;
            color: #94a3b8;
            width: 45px;
        }
        .lane-track {
            flex: 1;
            height: 24px;
            background: #0f172a;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .obstacle {
            position: absolute;
            width: 35px;
            height: 18px;
            background: #ef4444;
            border-radius: 4px;
            text-align: center;
            line-height: 18px;
            font-size: 12px;
        }
        .player-pos {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
        }
        .controls-section {
            padding: 15px;
            background: #1e293b;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .bet-control {
            display: flex;
            align-items: center;
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
            overflow: hidden;
        }
        .bet-control button {
            background: #334155;
            color: white;
            border: none;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .bet-control input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            outline: none;
        }
        .difficulty-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .diff-btn {
            background: #334155;
            color: #94a3b8;
            border: none;
            padding: 8px 4px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .diff-btn.active {
            background: #3b82f6;
            color: white;
        }
        .action-btn {
            background: #eab308;
            color: #000;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .action-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Header -->
        <div class="game-header">
            <span>🐔 CHICKEN ROAD</span>
            <span>Balance: ₹1000.00</span>
        </div>

        <!-- Lane Game View -->
        <div class="lanes-container" id="lanesContainer">
            <!-- Dynamically generated lanes -->
        </div>

        <!-- Controls Section -->
        <div class="controls-section">
            <div class="bet-control">
                <button id="decreaseBet">-</button>
                <input type="text" id="betAmount" value="1.00">
                <button id="increaseBet">+</button>
            </div>

            <div class="difficulty-selector">
                <button class="diff-btn active" data-diff="easy">Easy</button>
                <button class="diff-btn" data-diff="medium">Medium</button>
                <button class="diff-btn" data-diff="hard">Hard</button>
                <button class="diff-btn" data-diff="hardcore">Hardcore</button>
            </div>

            <button id="actionBtn" class="action-btn">PLAY</button>
        </div>
    </div>

    <script>
        let gameState = 'IDLE'; // IDLE, PLAYING, WON, GAMEOVER
        let currentLane = 0; // 0 to 5
        let betAmount = 1.00;
        let difficulty = 'easy';
        const multipliers = [1.00, 1.10, 1.25, 1.50, 1.80, 2.20];

        let obstaclePositions = [20, 70, 40, 60, 30]; // Moving offsets for lanes 1 to 5

        const lanesContainer = document.getElementById('lanesContainer');
        const actionBtn = document.getElementById('actionBtn');
        const betInput = document.getElementById('betAmount');

        function renderLanes() {
            lanesContainer.innerHTML = '';
            // Render from top (lane 5) to bottom (lane 0)
            for (let i = 5; i >= 0; i--) {
                const row = document.createElement('div');
                row.className = 'lane-row';

                const multSpan = document.createElement('span');
                multSpan.className = 'lane-mult';
                multSpan.innerText = `${multipliers[i]}x`;

                const track = document.createElement('div');
                track.className = 'lane-track';

                if (i > 0 && i < 5) {
                    const obs = document.createElement('div');
                    obs.className = 'obstacle';
                    obs.innerText = '🚗';
                    obs.style.left = `${obstaclePositions[i-1]}%`;
                    track.appendChild(obs);
                }

                if (currentLane === i) {
                    const chicken = document.createElement('div');
                    chicken.className = 'player-pos';
                    chicken.innerText = gameState === 'GAMEOVER' ? '💥' : '🐔';
                    track.appendChild(chicken);
                }

                row.appendChild(multSpan);
                row.appendChild(track);
                lanesContainer.appendChild(row);
            }
        }

        // Controls
        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (gameState === 'PLAYING') return;
                document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                difficulty = e.target.dataset.diff;
            });
        });

        document.getElementById('decreaseBet').addEventListener('click', () => {
            if (gameState === 'PLAYING') return;
            let val = parseFloat(betInput.value) || 1;
            if (val > 1) betInput.value = (val - 1).toFixed(2);
        });

        document.getElementById('increaseBet').addEventListener('click', () => {
            if (gameState === 'PLAYING') return;
            let val = parseFloat(betInput.value) || 1;
            betInput.value = (val + 1).toFixed(2);
        });

        actionBtn.addEventListener('click', () => {
            if (gameState === 'IDLE' || gameState === 'GAMEOVER' || gameState === 'WON') {
                startGame();
            } else if (gameState === 'PLAYING') {
                stepForward();
            }
        });

        function startGame() {
            betAmount = parseFloat(betInput.value) || 1.00;
            gameState = 'PLAYING';
            currentLane = 0;
            actionBtn.innerText = "TAP TO CROSS LANE";
            actionBtn.style.background = "#eab308";
            renderLanes();
        }

        function stepForward() {
            if (currentLane < 5) {
                // Check hit probability based on difficulty
                let hitChance = difficulty === 'easy' ? 0.05 : difficulty === 'medium' ? 0.15 : difficulty === 'hard' ? 0.25 : 0.40;
                if (currentLane > 2 && Math.random() < hitChance) {
                    // Crashed!
                    gameState = 'GAMEOVER';
                    actionBtn.innerText = "CRASHED! PLAY AGAIN";
                    actionBtn.style.background = "#ef4444";
                    renderLanes();
                    return;
                }

                currentLane++;
                if (currentLane === 5) {
                    gameState = 'WON';
                    let winAmt = (betAmount * multipliers[5]).toFixed(2);
                    actionBtn.innerText = `COLLECTED ₹${winAmt}! PLAY AGAIN`;
                    actionBtn.style.background = "#22c55e";
                } else {
                    actionBtn.innerText = `COLLECT / NEXT (${multipliers[currentLane]}x)`;
                }
                renderLanes();
            }
        }

        // Animate obstacles slightly
        setInterval(() => {
            if (gameState === 'PLAYING') {
                for(let i=0; i<obstaclePositions.length; i++) {
                    obstaclePositions[i] += (i % 2 === 0 ? 2 : -2);
                    if (obstaclePositions[i] > 85) obstaclePositions[i] = 10;
                    if (obstaclePositions[i] < 10) obstaclePositions[i] = 85;
                }
                renderLanes();
            }
        }, 150);

        renderLanes();
    </script>
</body>
</html>
