<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Road Game - Fm4bat</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .game-wrapper {
            width: 100%;
            max-width: 820px;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            overflow: hidden;
            border: 1px solid #475569;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            padding: 10px 16px;
            border-bottom: 2px solid #374151;
            font-size: 13px;
        }
        .logo-main { color: #ffffff; font-weight: 900; font-size: 16px; }
        .logo-sub { color: #ef4444; font-weight: 900; font-size: 16px; }
        .balance-pill { color: #22c55e; font-weight: bold; font-size: 14px; }
        .canvas-area {
            position: relative;
            width: 100%;
            background: #27272a;
            aspect-ratio: 16 / 9;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .control-panel {
            background: #1e293b;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top: 1px solid #334155;
        }
        .bet-presets { display: flex; gap: 12px; align-items: center; justify-content: center; }
        .quick-bet-chips { display: flex; gap: 6px; }
        .chip-btn { background: #334155; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .action-bar { display: flex; width: 100%; }
        .play-main-btn {
            width: 100%;
            background: #22c55e;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }
        .playing-btns-group { display: flex; width: 100%; gap: 10px; }
        .cashout-action-btn { flex: 2; background: #eab308; color: #000; border: none; padding: 14px; font-size: 16px; font-weight: 900; border-radius: 8px; cursor: pointer; text-align: center; }
        .go-action-btn { flex: 1; background: #22c55e; color: #fff; border: none; padding: 14px; font-size: 18px; font-weight: 900; border-radius: 8px; cursor: pointer; text-align: center; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="top-bar">
            <div class="logo-area">
                <span class="logo-main">CHICKEN</span><span class="logo-sub">2ROAD</span>
            </div>
            <div class="balance-pill" id="balanceDisplay">1 000 000.00 Ⓢ</div>
        </div>

        <div class="canvas-area">
            <canvas id="gameCanvas" width="960" height="540"></canvas>
        </div>

        <div class="control-panel">
            <div class="bet-presets">
                <div class="quick-bet-chips">
                    <button class="chip-btn" onclick="setBetVal(2)">2 $</button>
                    <button class="chip-btn" onclick="setBetVal(3)">3 $</button>
                    <button class="chip-btn" onclick="setBetVal(8)">8 $</button>
                    <button class="chip-btn" onclick="setBetVal(20)">20 $</button>
                </div>
            </div>

            <div class="action-bar">
                <button id="playBtn" class="play-main-btn" onclick="startPlay()">PLAY</button>
                <div id="playingActionBtns" class="playing-btns-group" style="display: none;">
                    <button id="cashoutBtn" class="cashout-action-btn" onclick="cashOutGame()">COLLECT TOKENS (<span id="cashoutAmt">0.0</span>)</button>
                    <button id="goBtn" class="go-action-btn" onclick="goNextLane()">GO</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let balance = 1000000.00;
        let gameState = 'IDLE'; 
        let currentStep = 0;
        let cameraX = 0; 
        let lastTime = 0;

        // Assets
        const imgChicken = new Image(); imgChicken.src = '/static/images/chicken.png';
        const imgRip = new Image(); imgRip.src = '/static/images/cheken_rip.png';
        const imgBarrier = new Image(); imgBarrier.src = '/static/images/barrier.png';
        const imgHatch = new Image(); imgHatch.src = '/static/images/hatch_2.png';
        const imgCarSheet = new Image(); imgCarSheet.src = '/static/images/car-1.png';

        const multipliers = [1.00, 1.09, 1.25, 1.43, 1.66, 1.94, 2.30, 2.80, 3.50, 4.50];

        let lanes = [];
        function initLanes() {
            lanes = [];
            for (let i = 0; i < 25; i++) {
                lanes.push({
                    x: 300 + (i * 160),
                    dir: i % 2 === 0 ? 1 : -1,
                    speed: 180 + (i % 3) * 45,
                    cars: [
                        { y: -150 - (i * 110), type: i % 4 },
                        { y: 650 + (i * 110), type: (i + 1) % 4 }
                    ]
                });
            }
        }
        initLanes();

        let chicken = { x: 100, y: 270 };

        function setBetVal(val) {
            if (gameState === 'PLAYING') return;
        }

        function startPlay() {
            balance -= 3.00;
            document.getElementById('balanceDisplay').innerText = `${balance.toFixed(2)} Ⓢ`;
            gameState = 'PLAYING';
            currentStep = 0;
            cameraX = 0;
            chicken.x = 100;
            initLanes();

            document.getElementById('playBtn').style.display = 'none';
            document.getElementById('playingActionBtns').style.display = 'flex';
            updateCashoutDisplay();
        }

        function goNextLane() {
            if (gameState === 'PLAYING') {
                currentStep++;
                cameraX = currentStep * 160; 
                updateCashoutDisplay();
            }
        }

        function cashOutGame() {
            if (gameState === 'PLAYING' && currentStep > 0) {
                let mult = multipliers[Math.min(currentStep, multipliers.length - 1)];
                let winAmt = 3.00 * mult;
                balance += winAmt;
                document.getElementById('balanceDisplay').innerText = `${balance.toFixed(2)} Ⓢ`;
                gameState = 'WON';
                endGame(`COLLECTED ₹${winAmt.toFixed(2)}! PLAY AGAIN`, "#22c55e");
            }
        }

        function updateCashoutDisplay() {
            let mult = multipliers[Math.min(currentStep + 1, multipliers.length - 1)];
            let amt = 3.00 * mult;
            document.getElementById('cashoutAmt').innerText = amt.toFixed(2);
        }

        function endGame(text, bgColor) {
            document.getElementById('playingActionBtns').style.display = 'none';
            let playBtn = document.getElementById('playBtn');
            playBtn.style.display = 'block';
            playBtn.innerText = text;
            playBtn.style.background = bgColor;
        }

        function update(deltaTime) {
            if (gameState !== 'PLAYING') return;

            lanes.forEach((lane, index) => {
                if (index < currentStep) return; 

                lane.cars.forEach(car => {
                    car.y += lane.speed * lane.dir * deltaTime;

                    if (car.y > canvas.height + 150) car.y = -200;
                    if (car.y < -200) car.y = canvas.height + 150;

                    if (gameState === 'PLAYING' && currentStep === index) {
                        let chickenBox = { x: chicken.x - 20, y: chicken.y - 20, w: 40, h: 40 };
                        let carBox = { x: lane.x - 30, y: car.y, w: 60, h: 75 };

                        if (
                            chickenBox.x < carBox.x + carBox.w &&
                            chickenBox.x + chickenBox.w > carBox.x &&
                            chickenBox.y < carBox.y + carBox.h &&
                            chickenBox.y + chickenBox.h > carBox.y
                        ) {
                            gameState = 'GAMEOVER';
                            endGame("CRASHED! PLAY AGAIN", "#ef4444");
                        }
                    }
                });
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Fixed Left Sidewalk Area
            ctx.fillStyle = '#15803d';
            ctx.fillRect(0, 0, 180, canvas.height);
            ctx.fillStyle = '#9ca3af';
            ctx.fillRect(180, 0, 20, canvas.height);

            ctx.font = '50px Arial';
            ctx.fillText('🌳', 60, 120);
            ctx.fillText('🌳', 60, 320);
            ctx.fillText('🌳', 60, 480);

            // 2. Scrolling Road Area
            ctx.save();
            ctx.translate(-cameraX, 0);

            ctx.fillStyle = '#374151';
            ctx.fillRect(200, 0, 4000, canvas.height);

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.setLineDash([20, 20]);
            for (let i = 0; i < 25; i++) {
                let dashX = 380 + (i * 160);
                ctx.beginPath();
                ctx.moveTo(dashX, 0);
                ctx.lineTo(dashX, canvas.height);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            for (let i = 0; i < currentStep; i++) {
                let lane = lanes[i];
                if (imgBarrier.complete) {
                    ctx.drawImage(imgBarrier, lane.x - 30, 230, 60, 36);
                }
            }

            if (imgCarSheet.complete && imgCarSheet.naturalWidth > 0) {
                let totalCars = 4;
                let sw = imgCarSheet.naturalWidth / totalCars;
                let sh = imgCarSheet.naturalHeight;

                lanes.forEach((lane, index) => {
                    if (index < currentStep) return;
                    lane.cars.forEach(car => {
                        ctx.save();
                        ctx.translate(lane.x, car.y + 35);
                        if (lane.dir === -1) ctx.scale(1, -1);
                        
                        ctx.drawImage(
                            imgCarSheet,
                            car.type * sw, 0, sw, sh,
                            -30, -35, 60, 75
                        );
                        ctx.restore();
                    });
                });
            }

            lanes.forEach((lane, index) => {
                if (index >= currentStep) {
                    if (imgHatch.complete) {
                        ctx.drawImage(imgHatch, lane.x - 35, 235, 70, 70);
                    }
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 15px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`${multipliers[Math.min(index + 1, multipliers.length - 1)]}x`, lane.x, 275);
                }
            });

            ctx.restore();

            // 3. Chicken on Left Sidewalk
            let targetChickenX = 100 + (currentStep * 160);
            chicken.x += (targetChickenX - chicken.x) * 0.2;

            if (gameState === 'GAMEOVER') {
                if (imgRip.complete) {
                    ctx.drawImage(imgRip, chicken.x - 30, chicken.y - 30, 60, 60);
                }
            } else {
                if (imgChicken.complete) {
                    ctx.drawImage(imgChicken, chicken.x - 28, chicken.y - 28, 56, 56);
                }
            }
        }

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let deltaTime = (timestamp - lastTime) / 1000;
            if (deltaTime > 0.1) deltaTime = 0.1;
            lastTime = timestamp;

            update(deltaTime);
            draw();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
