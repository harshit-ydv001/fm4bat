<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Road - Fm4bat</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px 10px; /* Added padding to prevent cutting off */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            /* OVERFLOW HIDDEN REMOVED - SO YOU CAN SCROLL TO THE PLAY BUTTON! */
        }
        .game-wrapper {
            width: 100%;
            max-width: 720px;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #475569;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            padding: 12px 18px;
            border-bottom: 2px solid #374151;
            font-weight: bold;
            font-size: 14px;
        }
        .logo-box {
            color: #ef4444;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px #000;
        }
        .online-tag {
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 12px;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .balance-box {
            background: #1f2937;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #4b5563;
            color: #22c55e;
            font-size: 15px;
        }
        .canvas-area {
            position: relative;
            width: 100%;
            height: 420px;
            background: #27272a;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .control-panel {
            background: #1e293b;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border-top: 1px solid #334155;
        }
        .bet-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .quick-bets {
            display: flex;
            gap: 6px;
        }
        .q-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .q-btn:hover {
            background: #475569;
        }
        .main-bet-input {
            flex: 1;
            display: flex;
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #475569;
            overflow: hidden;
        }
        .main-bet-input button {
            background: #334155;
            color: white;
            border: none;
            padding: 0 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .main-bet-input input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            outline: none;
        }
        .diff-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .diff-buttons {
            display: flex;
            gap: 6px;
        }
        .diff-btn {
            background: #334155;
            color: #94a3b8;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .diff-btn.active {
            background: #eab308;
            color: #000;
        }
        .action-container {
            display: flex;
            gap: 10px;
        }
        .btn-cashout {
            flex: 1;
            background: #eab308;
            color: #000;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            display: none;
        }
        .btn-go {
            flex: 1;
            background: #22c55e;
            color: #fff;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            display: none;
        }
        .action-button {
            width: 100%;
            background: #22c55e;
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 20px;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="top-bar">
            <div class="logo-box">🐔 CHICKEN ROAD</div>
            <div class="online-tag">Online: 11703</div>
            <div class="balance-box" id="balanceDisplay">₹1000.00</div>
        </div>

        <div class="canvas-area">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="control-panel">
            <div class="bet-row">
                <div class="quick-bets">
                    <button class="q-btn" onclick="setBet(2)">2</button>
                    <button class="q-btn" onclick="setBet(5)">5</button>
                    <button class="q-btn" onclick="setBet(10)">10</button>
                    <button class="q-btn" onclick="setBet(20)">20</button>
                </div>
                <div class="main-bet-input">
                    <button onclick="changeBet(-1)">-</button>
                    <input type="text" id="betInput" value="1.00">
                    <button onclick="changeBet(1)">+</button>
                </div>
            </div>

            <div class="diff-row">
                <span style="font-size: 13px; color: #94a3b8; font-weight: 600;">Difficulty</span>
                <div class="diff-buttons">
                    <button class="diff-btn active" data-diff="easy" onclick="setDiff('easy', this)">Easy</button>
                    <button class="diff-btn" data-diff="medium" onclick="setDiff('medium', this)">Medium</button>
                    <button class="diff-btn" data-diff="hard" onclick="setDiff('hard', this)">Hard</button>
                    <button class="diff-btn" data-diff="hardcore" onclick="setDiff('hardcore', this)">Hardcore</button>
                </div>
            </div>

            <!-- THE MISSING BUTTONS ARE NOW VISIBLE -->
            <div>
                <button id="mainPlayBtn" class="action-button" onclick="startOrGoGame()">Play</button>
                <div id="activeGameBtns" class="action-container">
                    <button id="cashoutBtn" class="btn-cashout" onclick="cashOutGame()">CASH OUT</button>
                    <button id="goBtn" class="btn-go" onclick="stepForwardGame()">GO</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 720;
        canvas.height = 420;

        let balance = 1000.00;
        let gameState = 'IDLE'; 
        let currentLane = 0; 
        let difficulty = 'easy';

        const multipliers = [1.00, 1.10, 1.25, 1.50, 1.80, 2.20];

        // Awesome Real Emoji Vehicles (Taxi, Police, Cars, Trucks, Fire Engines)
        const lanes = [
            { y: 350, speed: 0, cars: [] },
            { y: 290, speed: 2.2, cars: [{x: 120, emoji: '🚕'}, {x: 480, emoji: '🚓'}] },
            { y: 230, speed: -2.8, cars: [{x: 200, emoji: '🚙'}, {x: 520, emoji: '🚚'}] },
            { y: 170, speed: 3.2, cars: [{x: 100, emoji: '🚐'}, {x: 450, emoji: '🚒'}] },
            { y: 110, speed: -3.8, cars: [{x: 180, emoji: '🚕'}, {x: 500, emoji: '🚗'}] },
            { y: 50, speed: 4.2, cars: [{x: 250, emoji: '🚚'}, {x: 550, emoji: '🚓'}] }
        ];

        let chicken = { x: 55, y: 350 };

        function setBet(val) {
            if (gameState === 'PLAYING') return;
            document.getElementById('betInput').value = val.toFixed(2);
        }

        function changeBet(amt) {
            if (gameState === 'PLAYING') return;
            let val = parseFloat(document.getElementById('betInput').value) || 1;
            val = Math.max(1, val + amt);
            document.getElementById('betInput').value = val.toFixed(2);
        }

        function setDiff(d, btn) {
            if (gameState === 'PLAYING') return;
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            difficulty = d;
        }

        function updateButtonUI() {
            const playBtn = document.getElementById('mainPlayBtn');
            const activeBtns = document.getElementById('activeGameBtns');
            const cashoutBtn = document.getElementById('cashoutBtn');

            if (gameState === 'IDLE' || gameState === 'GAMEOVER' || gameState === 'WON') {
                playBtn.style.display = 'block';
                activeBtns.style.display = 'none';
                if (gameState === 'GAMEOVER') {
                    playBtn.innerText = "CRASHED! PLAY AGAIN";
                    playBtn.style.background = "#ef4444";
                } else if (gameState === 'WON') {
                    playBtn.innerText = "PLAY AGAIN";
                    playBtn.style.background = "#22c55e";
                } else {
                    playBtn.innerText = "Play";
                    playBtn.style.background = "#22c55e";
                }
            } else if (gameState === 'PLAYING') {
                playBtn.style.display = 'none';
                activeBtns.style.display = 'flex';
                let currentWin = (betInputVal() * multipliers[currentLane]).toFixed(2);
                cashoutBtn.innerText = `CASH OUT ₹${currentWin}`;
            }
        }

        function betInputVal() {
            return parseFloat(document.getElementById('betInput').value) || 1.00;
        }

        function startOrGoGame() {
            let bet = betInputVal();
            if (balance < bet) {
                alert("Insufficient Balance!");
                return;
            }
            balance -= bet;
            updateBalance();
            gameState = 'PLAYING';
            currentLane = 0;
            chicken.x = 55;
            chicken.y = lanes[0].y;
            updateButtonUI();
        }

        function stepForwardGame() {
            if (currentLane < 5) {
                let risk = difficulty === 'easy' ? 0.05 : difficulty === 'medium' ? 0.15 : difficulty === 'hard' ? 0.25 : 0.40;
                if (currentLane >= 2 && Math.random() < risk) {
                    gameState = 'GAMEOVER';
                    updateButtonUI();
                    return;
                }

                currentLane++;
                chicken.y = lanes[currentLane].y;

                if (currentLane === 5) {
                    gameState = 'WON';
                    let winAmt = betInputVal() * multipliers[5];
                    balance += winAmt;
                    updateBalance();
                    updateButtonUI();
                } else {
                    updateButtonUI();
                }
            }
        }

        function cashOutGame() {
            if (gameState === 'PLAYING' && currentLane > 0) {
                let winAmt = betInputVal() * multipliers[currentLane];
                balance += winAmt;
                updateBalance();
                gameState = 'WON';
                updateButtonUI();
            }
        }

        function updateBalance() {
            document.getElementById('balanceDisplay').innerText = `₹${balance.toFixed(2)}`;
        }

        function updateGame() {
            lanes.forEach((lane, index) => {
                if (index === 0) return;
                let speedMult = difficulty === 'medium' ? 1.3 : difficulty === 'hard' ? 1.6 : difficulty === 'hardcore' ? 2.0 : 1.0;
                lane.cars.forEach(car => {
                    car.x += lane.speed * speedMult;
                    if (car.x > canvas.width + 60) car.x = -90;
                    if (car.x < -90) car.x = canvas.width + 60;

                    if (gameState === 'PLAYING' && currentLane === index) {
                        // Collision check
                        if (Math.abs(chicken.x - car.x) < 35) {
                            gameState = 'GAMEOVER';
                            updateButtonUI();
                        }
                    }
                });
            });
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Left Grass Area
            ctx.fillStyle = '#166534';
            ctx.fillRect(0, 0, 110, canvas.height);
            ctx.fillStyle = '#15803d';
            ctx.fillRect(90, 0, 20, canvas.height);

            // Real Trees on grass using Emojis
            ctx.font = '45px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🌳', 55, 90);
            ctx.fillText('🌳', 55, 230);
            ctx.fillText('🌳', 55, 370);

            // 2. Asphalt Road
            ctx.fillStyle = '#262626';
            ctx.fillRect(110, 0, canvas.width - 110, canvas.height);

            // Dashed white lines
            ctx.strokeStyle = '#a1a1aa';
            ctx.lineWidth = 2;
            ctx.setLineDash([12, 12]);
            for (let i = 1; i < 6; i++) {
                let yPos = i * 60;
                ctx.beginPath();
                ctx.moveTo(110, yPos);
                ctx.lineTo(canvas.width, yPos);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            // 3. Multiplier Manhole Circles (Right side)
            lanes.forEach((lane, index) => {
                if (index === 0) return;
                let circleX = 520 + (index * 26);
                
                ctx.fillStyle = '#3f3f46';
                ctx.beginPath(); ctx.arc(circleX, lane.y + 30, 24, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#d4d4d8'; ctx.lineWidth = 2; ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px Arial';
                ctx.fillText(`${multipliers[index]}x`, circleX, lane.y + 30);
            });

            // 4. Vehicles (Taxis, Police, Trucks using Emojis)
            lanes.forEach((lane, index) => {
                if (index === 0) return;
                lane.cars.forEach(car => {
                    ctx.save();
                    ctx.font = '45px Arial';
                    ctx.translate(car.x, lane.y + 30);
                    
                    // Flip emoji horizontally if moving left, so car faces the right direction!
                    if (lane.speed < 0) {
                        ctx.scale(-1, 1);
                    }
                    
                    ctx.fillText(car.emoji, 0, 0);
                    ctx.restore();
                });
            });

            // 5. Chicken Player Animation
            let targetX = currentLane === 0 ? 55 : 210 + (currentLane * 55);
            chicken.x += (targetX - chicken.x) * 0.2;

            ctx.font = '40px Arial';
            let chickenEmoji = gameState === 'GAMEOVER' ? '💥' : '🐔';
            ctx.fillText(chickenEmoji, chicken.x, chicken.y + 30);
        }

        function gameLoop() {
            updateGame();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        // Initialize UI buttons properly
        updateButtonUI();
        gameLoop();
    </script>
</body>
</html>
