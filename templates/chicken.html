<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Road Game - Fm4bat</title>
    <link rel="stylesheet" href="/static/css/chicken.css">
</head>
<body>

    <div class="game-wrapper">
        <div class="top-bar">
            <div class="logo-area">
                <span class="logo-main">CHICKEN</span><span class="logo-sub">2ROAD</span>
            </div>
            <div class="live-wins-ticker">
                <span class="win-badge">👑 Niki mafija</span> <span class="win-amt">+€146.35</span>
            </div>
            <div class="header-right">
                <button class="info-btn">ⓘ How to play?</button>
                <div class="balance-pill" id="balanceDisplay">1 000 980.32 Ⓢ</div>
                <button class="fullscreen-btn">⛶</button>
            </div>
        </div>

        <div class="canvas-area">
            <canvas id="gameCanvas" width="720" height="420"></canvas>
        </div>

        <div class="control-panel">
            <div class="bet-presets">
                <div class="min-max-group">
                    <button class="mm-btn" onclick="setBetMin()">MIN</button>
                    <input type="number" id="betMultiplierInput" value="3" style="width: 40px; text-align:center; background:#111827; color:#fff; border:1px solid #374151; border-radius:4px;">
                    <button class="mm-btn" onclick="setBetMax()">MAX</button>
                </div>
                <div class="quick-bet-chips">
                    <button class="chip-btn" onclick="setBetVal(2)">2 $</button>
                    <button class="chip-btn" onclick="setBetVal(3)">3 $</button>
                    <button class="chip-btn" onclick="setBetVal(8)">8 $</button>
                    <button class="chip-btn" onclick="setBetVal(20)">20 $</button>
                </div>
            </div>

            <div class="settings-row">
                <div class="diff-selector">
                    <span class="diff-label">Difficulty</span>
                    <div class="diff-buttons">
                        <button class="diff-btn active" onclick="setDifficulty('easy', this)">Easy</button>
                        <button class="diff-btn" onclick="setDifficulty('medium', this)">Medium</button>
                        <button class="diff-btn" onclick="setDifficulty('hard', this)">Hard</button>
                        <button class="diff-btn" onclick="setDifficulty('hardcore', this)">Hardcore</button>
                    </div>
                </div>
                <div class="chance-text">Chance of being shot down</div>
            </div>

            <div class="action-bar">
                <button id="playBtn" class="play-main-btn" onclick="startPlay()">Play</button>
                <div id="playingActionBtns" class="playing-btns-group" style="display: none;">
                    <button id="cashoutBtn" class="cashout-action-btn" onclick="cashOutGame()">CASH OUT <span id="cashoutAmt">0.0</span> $</button>
                    <button id="goBtn" class="go-action-btn" onclick="goNextLane()">GO</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let balance = 1000980.32;
        let gameState = 'IDLE'; 
        let currentStep = 0; 
        let cameraX = 0; // Infinite scrolling camera
        let difficulty = 'easy';

        // Load all PNG assets
        const imgBg = new Image(); imgBg.src = '/static/images/bg.png';
        const imgChicken = new Image(); imgChicken.src = '/static/images/chicken.png';
        const imgRip = new Image(); imgRip.src = '/static/images/cheken_rip.png';
        const imgBarrier = new Image(); imgBarrier.src = '/static/images/barrier.png';
        const imgCarSheet = new Image(); imgCarSheet.src = '/static/images/car-1.png';

        // Infinite Road Lanes Setup (Road X ranges strictly from 135 to 650)
        let lanes = [];
        for (let i = 0; i < 20; i++) {
            lanes.push({
                x: 175 + (i * 100),
                dir: i % 2 === 0 ? 1 : -1,
                speed: 2.2 + (i % 3) * 0.4,
                cars: [{y: 40, type: i % 4}, {y: 250, type: (i + 1) % 4}]
            });
        }

        let chicken = { x: 50, y: 340 };

        function setBetVal(val) {
            if (gameState === 'PLAYING') return;
            document.getElementById('betMultiplierInput').value = val;
        }
        function setBetMin() { setBetVal(2); }
        function setBetMax() { setBetVal(20); }

        function setDifficulty(diff, btn) {
            if (gameState === 'PLAYING') return;
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            difficulty = diff;
        }

        function getBetAmount() {
            return parseFloat(document.getElementById('betMultiplierInput').value) || 3.00;
        }

        function getMultiplier(step) {
            return (1.00 + (step * 0.18) + (step * step * 0.03)).toFixed(2);
        }

        function startPlay() {
            let bet = getBetAmount();
            if (balance < bet) {
                alert("Insufficient Balance!");
                return;
            }
            balance -= bet;
            updateBalance();
            gameState = 'PLAYING';
            currentStep = 0;
            cameraX = 0;
            chicken.x = 50;

            document.getElementById('playBtn').style.display = 'none';
            document.getElementById('playingActionBtns').style.display = 'flex';
            updateCashoutDisplay();
        }

        function goNextLane() {
            if (gameState === 'PLAYING') {
                let targetLane = lanes[currentStep];
                let hitCar = false;

                targetLane.cars.forEach(car => {
                    if (car.y > 140 && car.y < 320) {
                        hitCar = true;
                    }
                });

                let risk = difficulty === 'easy' ? 0.02 : difficulty === 'medium' ? 0.08 : difficulty === 'hard' ? 0.15 : 0.25;
                if (hitCar || (currentStep >= 1 && Math.random() < risk)) {
                    gameState = 'GAMEOVER';
                    endGame("CRASHED! PLAY AGAIN", "#ef4444");
                    return;
                }

                currentStep++;
                cameraX = currentStep * 100; // Smooth camera scroll forward

                updateCashoutDisplay();
            }
        }

        function cashOutGame() {
            if (gameState === 'PLAYING' && currentStep > 0) {
                let mult = parseFloat(getMultiplier(currentStep));
                let winAmt = (getBetAmount() * mult).toFixed(2);
                balance += parseFloat(winAmt);
                updateBalance();
                gameState = 'WON';
                endGame(`CASHED OUT ₹${winAmt}! PLAY AGAIN`, "#22c55e");
            }
        }

        function updateCashoutDisplay() {
            let mult = getMultiplier(currentStep + 1);
            let amt = (getBetAmount() * mult).toFixed(2);
            document.getElementById('cashoutAmt').innerText = amt;
        }

        function endGame(text, bgColor) {
            document.getElementById('playingActionBtns').style.display = 'none';
            let playBtn = document.getElementById('playBtn');
            playBtn.style.display = 'block';
            playBtn.innerText = text;
            playBtn.style.background = bgColor;
        }

        function updateBalance() {
            document.getElementById('balanceDisplay').innerText = `${balance.toFixed(2)} Ⓢ`;
        }

        function update() {
            lanes.forEach((lane, index) => {
                if (index < currentStep) return; 

                let speedMult = difficulty === 'medium' ? 1.3 : difficulty === 'hard' ? 1.6 : difficulty === 'hardcore' ? 2.0 : 1.0;
                lane.cars.forEach(car => {
                    car.y += lane.speed * lane.dir * speedMult;
                    if (car.y > canvas.height + 50) car.y = -60;
                    if (car.y < -60) car.y = canvas.height + 50;

                    // Real-time collision check
                    if (gameState === 'PLAYING' && currentStep === index) {
                        if (Math.abs(340 - car.y) < 30) {
                            gameState = 'GAMEOVER';
                            endGame("CRASHED! PLAY AGAIN", "#ef4444");
                        }
                    }
                });
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, 0); // Apply infinite scrolling camera offset

            // Draw repeating background seamlessly
            if (imgBg.complete) {
                ctx.drawImage(imgBg, 0, 0, canvas.width, canvas.height);
                ctx.drawImage(imgBg, canvas.width, 0, canvas.width, canvas.height);
                ctx.drawImage(imgBg, canvas.width * 2, 0, canvas.width, canvas.height);
            }

            // Draw Barriers strictly inside road bounds (X: 135 to 650)
            for (let i = 0; i < currentStep; i++) {
                let barrierX = lanes[i].x;
                if (imgBarrier.complete) {
                    ctx.drawImage(imgBarrier, barrierX - 22, 170, 45, 28);
                }
            }

            // Draw Cars strictly within road lanes
            if (imgCarSheet.complete && imgCarSheet.naturalWidth > 0) {
                let totalCars = 4;
                let sw = imgCarSheet.naturalWidth / totalCars;
                let sh = imgCarSheet.naturalHeight;

                lanes.forEach((lane, index) => {
                    if (index < currentStep) return;
                    lane.cars.forEach(car => {
                        ctx.save();
                        ctx.translate(lane.x, car.y + 25);
                        if (lane.dir === -1) ctx.scale(1, -1);
                        
                        ctx.drawImage(
                            imgCarSheet,
                            car.type * sw, 0, sw, sh,
                            -18, -22, 36, 44
                        );
                        ctx.restore();
                    });
                });
            }

            // Draw Multiplier Hatches dynamically for infinite steps
            lanes.forEach((lane, index) => {
                if (index >= currentStep) {
                    ctx.fillStyle = '#1f2937';
                    ctx.beginPath();
                    ctx.arc(lane.x, 340, 24, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#4b5563';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 11px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`${getMultiplier(index + 1)}x`, lane.x, lane.y = 344);
                }
            });

            // Smooth Chicken Movement & Positioning
            let targetX = currentStep === 0 ? 50 : lanes[currentStep - 1].x;
            chicken.x += (targetX - chicken.x) * 0.2;
            chicken.y = 340;

            if (gameState === 'GAMEOVER') {
                if (imgRip.complete) {
                    ctx.drawImage(imgRip, chicken.x + cameraX - 22, chicken.y - 22, 44, 44);
                }
            } else {
                if (imgChicken.complete) {
                    // Lock chicken to screen viewport so it moves forward with camera
                    ctx.drawImage(imgChicken, chicken.x - 20, chicken.y - 20, 40, 40);
                }
            }

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
