<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Road Game - Fm4bat</title>
    <link rel="stylesheet" href="/static/css/chicken.css">
</head>
<body>

    <div class="game-wrapper">
        <div class="top-bar">
            <div class="logo-area">
                <span class="logo-main">CHICKEN</span><span class="logo-sub">2ROAD</span>
            </div>
            <div class="live-wins-ticker">
                <span class="win-badge">👑 Niki mafija</span> <span class="win-amt">+€146.35</span>
            </div>
            <div class="header-right">
                <button class="info-btn">ⓘ How to play?</button>
                <div class="balance-pill" id="balanceDisplay">1 000 000 Ⓢ</div>
                <button class="fullscreen-btn">⛶</button>
            </div>
        </div>

        <div class="canvas-area">
            <canvas id="gameCanvas" width="720" height="420"></canvas>
        </div>

        <div class="control-panel">
            <div class="bet-presets">
                <div class="min-max-group">
                    <button class="mm-btn" onclick="setBetMin()">MIN</button>
                    <input type="number" id="betMultiplierInput" value="3" style="width: 40px; text-align:center; background:#111827; color:#fff; border:1px solid #374151; border-radius:4px;">
                    <button class="mm-btn" onclick="setBetMax()">MAX</button>
                </div>
                <div class="quick-bet-chips">
                    <button class="chip-btn" onclick="setBetVal(2)">2 $</button>
                    <button class="chip-btn" onclick="setBetVal(3)">3 $</button>
                    <button class="chip-btn" onclick="setBetVal(8)">8 $</button>
                    <button class="chip-btn" onclick="setBetVal(20)">20 $</button>
                </div>
            </div>

            <div class="settings-row">
                <div class="diff-selector">
                    <span class="diff-label">Difficulty</span>
                    <div class="diff-buttons">
                        <button class="diff-btn active" onclick="setDifficulty('easy', this)">Easy</button>
                        <button class="diff-btn" onclick="setDifficulty('medium', this)">Medium</button>
                        <button class="diff-btn" onclick="setDifficulty('hard', this)">Hard</button>
                        <button class="diff-btn" onclick="setDifficulty('hardcore', this)">Hardcore</button>
                    </div>
                </div>
                <div class="chance-text">Chance of being shot down</div>
            </div>

            <div class="action-bar">
                <button id="playBtn" class="play-main-btn" onclick="startPlay()">Play</button>
                <div id="playingActionBtns" class="playing-btns-group" style="display: none;">
                    <button id="cashoutBtn" class="cashout-action-btn" onclick="cashOutGame()">COLLECT TOKENS <span id="cashoutAmt">0.0</span> $</button>
                    <button id="goBtn" class="go-action-btn" onclick="goNextLane()">GO</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let balance = 1000000.00;
        let gameState = 'IDLE'; 
        let currentLane = 0; 
        let difficulty = 'easy';

        const multipliers = [1.00, 1.09, 1.25, 1.43, 1.66, 1.94];

        // Load background and all 3 Car PNGs + Chicken assets
        const imgBg = new Image(); imgBg.src = '/static/images/bg.png';
        const imgChicken = new Image(); imgChicken.src = '/static/images/chicken.png';
        const imgRip = new Image(); imgRip.src = '/static/images/cheken_rip.png';
        const imgBarrier = new Image(); imgBarrier.src = '/static/images/barrier.png';
        
        const carImages = [
            (new Image()).src = '/static/images/car-1.png',
            (new Image()).src = '/static/images/car.png',
            (new Image()).src = '/static/images/car_2.png'
        ];
        
        // Proper Image objects array for rendering
        const loadedCars = [
            Object.assign(new Image(), { src: '/static/images/car-1.png' }),
            Object.assign(new Image(), { src: '/static/images/car.png' }),
            Object.assign(new Image(), { src: '/static/images/car_2.png' })
        ];

        // 5 Lanes matching the background hatch positions
        const lanes = [
            { x: 195, dir: 1, speed: 2.2, cars: [{y: 50, imgIdx: 0}, {y: 280, imgIdx: 1}] },
            { x: 295, dir: -1, speed: 2.6, cars: [{y: 100, imgIdx: 2}, {y: 320, imgIdx: 0}] },
            { x: 395, dir: 1, speed: 3.0, cars: [{y: 20, imgIdx: 1}, {y: 240, imgIdx: 2}] },
            { x: 495, dir: -1, speed: 3.4, cars: [{y: 150, imgIdx: 0}, {y: 350, imgIdx: 1}] },
            { x: 595, dir: 1, speed: 3.8, cars: [{y: 80, imgIdx: 2}, {y: 300, imgIdx: 0}] }
        ];

        let chicken = { x: 50, y: 340 };

        function setBetVal(val) {
            if (gameState === 'PLAYING') return;
            document.getElementById('betMultiplierInput').value = val;
        }
        function setBetMin() { setBetVal(2); }
        function setBetMax() { setBetVal(20); }

        function setDifficulty(diff, btn) {
            if (gameState === 'PLAYING') return;
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            difficulty = diff;
        }

        function getBetAmount() {
            return parseFloat(document.getElementById('betMultiplierInput').value) || 3.00;
        }

        function startPlay() {
            let bet = getBetAmount();
            if (balance < bet) {
                alert("Insufficient Balance!");
                return;
            }
            balance -= bet;
            updateBalance();
            gameState = 'PLAYING';
            currentLane = 0;
            chicken.x = 50;

            document.getElementById('playBtn').style.display = 'none';
            document.getElementById('playingActionBtns').style.display = 'flex';
            updateCashoutDisplay();
        }

        function goNextLane() {
            if (gameState === 'PLAYING' && currentLane < 5) {
                let targetLaneIdx = currentLane;
                let lane = lanes[targetLaneIdx];
                let hitCar = false;

                lane.cars.forEach(car => {
                    if (car.y > 140 && car.y < 320) {
                        hitCar = true;
                    }
                });

                let risk = difficulty === 'easy' ? 0.03 : difficulty === 'medium' ? 0.10 : difficulty === 'hard' ? 0.20 : 0.35;
                if (hitCar || (currentLane >= 1 && Math.random() < risk)) {
                    gameState = 'GAMEOVER';
                    endGame("CRASHED! PLAY AGAIN", "#ef4444");
                    return;
                }

                currentLane++;
                if (currentLane === 5) {
                    gameState = 'WON';
                    let winAmt = (getBetAmount() * multipliers[5]).toFixed(2);
                    balance += parseFloat(winAmt);
                    updateBalance();
                    endGame(`WON ₹${winAmt}! PLAY AGAIN`, "#22c55e");
                } else {
                    updateCashoutDisplay();
                }
            }
        }

        function cashOutGame() {
            if (gameState === 'PLAYING' && currentLane > 0) {
                let winAmt = (getBetAmount() * multipliers[currentLane]).toFixed(2);
                balance += parseFloat(winAmt);
                updateBalance();
                gameState = 'WON';
                endGame(`COLLECTED ₹${winAmt}! PLAY AGAIN`, "#22c55e");
            }
        }

        function updateCashoutDisplay() {
            let amt = (getBetAmount() * multipliers[currentLane]).toFixed(1);
            document.getElementById('cashoutAmt').innerText = amt;
        }

        function endGame(text, bgColor) {
            document.getElementById('playingActionBtns').style.display = 'none';
            let playBtn = document.getElementById('playBtn');
            playBtn.style.display = 'block';
            playBtn.innerText = text;
            playBtn.style.background = bgColor;
        }

        function updateBalance() {
            document.getElementById('balanceDisplay').innerText = `${balance.toFixed(2)} Ⓢ`;
        }

        function update() {
            lanes.forEach((lane, index) => {
                if (index < currentLane) return; 

                let speedMult = difficulty === 'medium' ? 1.3 : difficulty === 'hard' ? 1.6 : difficulty === 'hardcore' ? 2.0 : 1.0;
                lane.cars.forEach(car => {
                    car.y += lane.speed * lane.dir * speedMult;
                    if (car.y > canvas.height + 50) car.y = -60;
                    if (car.y < -60) car.y = canvas.height + 50;

                    if (gameState === 'PLAYING' && currentLane === index + 1) {
                        if (Math.abs(340 - car.y) < 30) {
                            gameState = 'GAMEOVER';
                            endGame("CRASHED! PLAY AGAIN", "#ef4444");
                        }
                    }
                });
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (imgBg.complete) {
                ctx.drawImage(imgBg, 0, 0, canvas.width, canvas.height);
            }

            // Barriers on crossed lanes
            for (let i = 0; i < currentLane; i++) {
                let barrierX = lanes[i].x;
                if (imgBarrier.complete) {
                    ctx.drawImage(imgBarrier, barrierX - 25, 170, 50, 30);
                }
            }

            // Moving Cars using 3 different loaded car images
            lanes.forEach((lane, index) => {
                if (index < currentLane) return;
                lane.cars.forEach(car => {
                    let carImg = loadedCars[car.imgIdx] || loadedCars[0];
                    if (carImg.complete) {
                        ctx.save();
                        ctx.translate(lane.x, car.y + 25);
                        if (lane.dir === -1) ctx.scale(1, -1);
                        ctx.drawImage(carImg, -20, -25, 40, 50);
                        ctx.restore();
                    }
                });
            });

            // Chicken position & animation
            let targetX = currentLane === 0 ? 50 : lanes[currentLane - 1].x;
            chicken.x += (targetX - chicken.x) * 0.2;
            chicken.y = 340;

            if (gameState === 'GAMEOVER') {
                if (imgRip.complete) {
                    ctx.drawImage(imgRip, chicken.x - 22, chicken.y - 22, 44, 44);
                }
            } else {
                if (imgChicken.complete) {
                    ctx.drawImage(imgChicken, chicken.x - 20, chicken.y - 20, 40, 40);
                }
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
