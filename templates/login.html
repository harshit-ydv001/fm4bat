<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - fm4bat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0b0e14; color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
        }
        .auth-card {
            width: 100%; max-width: 400px; background: #141822;
            border: 2px solid #2a2f40; border-radius: 12px; padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .brand-title { font-size: 24px; font-weight: 900; color: #34d399; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 12px; color: #94a3b8; font-weight: bold; }
        .form-group input {
            background: #1c212e; border: 1px solid #374151; border-radius: 8px;
            padding: 10px 14px; color: #fff; font-size: 14px; outline: none;
        }
        .form-group input:focus { border-color: #34d399; }
        .submit-btn {
            width: 100%; background: linear-gradient(135deg, #34d399 0%, #059669 100%);
            color: #fff; border: none; padding: 12px; border-radius: 8px;
            font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 10px;
            text-transform: uppercase;
        }
        .submit-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand-title">⚡ fm4bat Login</div>
        
        <form action="/login" method="POST">
            <div class="form-group">
                <label>Username or Email</label>
                <input type="text" name="identifier" required placeholder="Enter username or email">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Enter password">
            </div>

            <button type="submit" class="submit-btn">Login</button>
        </form>
    </div>

</body>
</html>
