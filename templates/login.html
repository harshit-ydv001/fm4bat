<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup - fm4bat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0b0e14; color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
        }
        .auth-card {
            width: 100%; max-width: 440px; background: #141822;
            border: 1px solid #2a2f40; border-radius: 16px; padding: 28px 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .brand-title { font-size: 26px; font-weight: 900; color: #f1c40f; text-align: center; margin-bottom: 20px; font-style: italic; }
        
        .tab-buttons { display: flex; margin-bottom: 24px; background: #0f131a; border-radius: 10px; padding: 4px; border: 1px solid #2a2f40; }
        .tab-btn { flex: 1; background: none; border: none; color: #8a99ad; padding: 10px; font-weight: bold; font-size: 14px; cursor: pointer; border-radius: 8px; transition: 0.3s; }
        .tab-btn.active { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: #fff; box-shadow: 0 4px 12px rgba(59,130,246,0.3); }

        .form-box { display: none; }
        .form-box.active { display: block; }

        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; position: relative; }
        .form-group label { font-size: 12px; color: #cbd5e1; font-weight: bold; }
        
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .form-group input {
            width: 100%;
            background: #0f131a; border: 1.5px solid #2a2f40; border-radius: 10px;
            padding: 12px 42px 12px 14px; color: #fff; font-size: 14px; outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus { border-color: #3b82f6; }

        .toggle-password {
            position: absolute; right: 14px; background: none; border: none;
            color: #94a3b8; cursor: pointer; font-size: 16px;
        }

        .forgot-link {
            text-align: right; font-size: 12px; color: #3b82f6; text-decoration: none; margin-top: -4px; margin-bottom: 14px; display: block; cursor: pointer; font-weight: bold;
        }
        .forgot-link:hover { text-decoration: underline; }
        
        .submit-btn {
            width: 100%; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: #fff; border: none; padding: 13px; border-radius: 10px;
            font-weight: 900; font-size: 14px; cursor: pointer; margin-top: 6px;
            text-transform: uppercase; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: transform 0.2s;
        }
        .submit-btn:hover { transform: scale(1.02); }

        /* Modal styling for Forgot Password */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; padding: 20px;
        }
        .modal-content {
            background: #141822; border: 1.5px solid #2a2f40; padding: 24px; border-radius: 16px;
            width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .modal-title { font-size: 18px; font-weight: bold; color: #f1c40f; margin-bottom: 16px; }
        .close-modal { float: right; background: none; border: none; color: #94a3b8; font-size: 18px; cursor: pointer; }
        .close-modal:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand-title">⚡ fm4bat Gaming</div>
        
        <div class="tab-buttons">
            <button class="tab-btn active" id="login-tab" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" id="signup-tab" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="form-box active" action="/login" method="POST">
            <div class="form-group">
                <label>Username or Email</label>
                <input type="text" name="identifier" required placeholder="Enter username or email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" name="password" id="login-pass" required placeholder="Enter password">
                    <button type="button" class="toggle-password" onclick="togglePassword('login-pass', this)">👁️</button>
                </div>
            </div>
            <a class="forgot-link" onclick="openForgotModal()">Forgot Password?</a>
            <button type="submit" class="submit-btn">Login</button>
        </form>

        <!-- Signup Form -->
        <form id="signup-form" class="form-box" action="/signup" method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label>Email or Mobile</label>
                <input type="text" name="identifier" required placeholder="Enter email or mobile">
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" name="password" id="signup-pass" required placeholder="Create a password">
                    <button type="button" class="toggle-password" onclick="togglePassword('signup-pass', this)">👁️</button>
                </div>
            </div>
            <button type="submit" class="submit-btn">Register & Start</button>
        </form>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgot-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeForgotModal()">✕</button>
            <div class="modal-title">Reset Password</div>
            <form action="/forgot-password-request" method="POST">
                <div class="form-group">
                    <label>Username or Email</label>
                    <input type="text" name="identifier" required placeholder="Enter registered username/email">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <div class="input-wrapper">
                        <input type="password" name="password" id="forgot-pass" required placeholder="Enter new password">
                        <button type="button" class="toggle-password" onclick="togglePassword('forgot-pass', this)">👁️</button>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Update Password</button>
            </form>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.getElementById('login-tab').classList.remove('active');
            document.getElementById('signup-tab').classList.remove('active');
            document.getElementById('login-form').classList.remove('active');
            document.getElementById('signup-form').classList.remove('active');

            if (tab === 'login') {
                document.getElementById('login-tab').classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.getElementById('signup-tab').classList.add('active');
                document.getElementById('signup-form').classList.add('active');
            }
        }

        function togglePassword(fieldId, btn) {
            const field = document.getElementById(fieldId);
            if (field.type === "password") {
                field.type = "text";
                btn.innerText = "🙈";
            } else {
                field.type = "password";
                btn.innerText = "👁️";
            }
        }

        function openForgotModal() {
            document.getElementById('forgot-modal').style.display = 'flex';
        }
        function closeForgotModal() {
            document.getElementById('forgot-modal').style.display = 'none';
        }
    </script>

</body>
</html>
