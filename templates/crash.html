<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Arena - Live Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121418;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        /* Top Navigation */
        .navbar {
            width: 100%;
            max-width: 480px;
            background: #1a1d24;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid #2a2e39;
        }
        .logo {
            color: #ff5252;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
        }
        .balance-box {
            background: #242833;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            color: #00e676;
            font-weight: 600;
        }
        .logout-link {
            color: #b0bec5;
            text-decoration: none;
            font-size: 13px;
        }

        /* Multiplier History Bar */
        .history-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            gap: 6px;
            padding: 8px 12px;
            background: #161920;
            overflow-x: auto;
            white-space: nowrap;
        }
        .history-pill {
            background: #242833;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            color: #00e676;
        }
        .history-pill.red { color: #ff5252; }

        /* Main Game Screen */
        .game-container {
            width: 100%;
            max-width: 480px;
            background: #0f1115;
            height: 220px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-bottom: 2px solid #2a2e39;
        }
        .multiplier-display {
            font-size: 42px;
            font-weight: 900;
            color: #fff;
            z-index: 2;
        }
        .status-text {
            font-size: 13px;
            color: #ff5252;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        /* Betting Panels Container (Double Bet) */
        .betting-section {
            width: 100%;
            max-width: 480px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #121418;
        }

        /* Single Bet Panel */
        .bet-panel {
            background: #1a1d24;
            border: 1px solid #2a2e39;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .bet-controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .amount-control {
            display: flex;
            background: #121418;
            border-radius: 8px;
            border: 1px solid #2a2e39;
            align-items: center;
            overflow: hidden;
        }
        .amount-btn {
            background: #242833;
            color: #fff;
            border: none;
            padding: 8px 12px;
            font-size: 16px;
            cursor: pointer;
        }
        .amount-input {
            width: 70px;
            background: transparent;
            border: none;
            color: #fff;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            outline: none;
        }
        .action-btn {
            flex: 1;
            margin-left: 10px;
            background: #00c853;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 200, 83, 0.3);
        }
        .action-btn.cancel {
            background: #ff5252;
            box-shadow: 0 4px 10px rgba(255, 82, 82, 0.3);
        }
        .quick-presets {
            display: flex;
            gap: 5px;
        }
        .preset-pill {
            background: #242833;
            border: none;
            color: #b0bec5;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        /* Live Bets / Stats Tabs */
        .stats-section {
            width: 100%;
            max-width: 480px;
            background: #1a1d24;
            border-top: 1px solid #2a2e39;
            margin-top: 5px;
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid #2a2e39;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 12px;
            color: #8c9eff;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .tab.active {
            border-bottom: 2px solid #00e676;
            color: #fff;
        }
        .bets-list {
            max-height: 140px;
            overflow-y: auto;
            padding: 5px 10px;
        }
        .bet-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 6px 0;
            border-bottom: 1px solid #222630;
            color: #b0bec5;
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <div class="navbar">
        <a href="/dashboard" class="logout-link">← Lobby</a>
        <div class="logo">AVIATOR ARENA</div>
        <div class="balance-box" id="userBalance">1000.00 🪙</div>
    </div>

    <!-- History Multipliers Bar -->
    <div class="history-bar">
        <span class="history-pill">1.89x</span>
        <span class="history-pill red">1.00x</span>
        <span class="history-pill">2.28x</span>
        <span class="history-pill">1.36x</span>
        <span class="history-pill">15.40x</span>
    </div>

    <!-- Game Screen / Multiplier Area -->
    <div class="game-container">
        <div class="status-text" id="gameStatus">MULTIPLIER RISING 🚀</div>
        <div class="multiplier-display" id="multiplier">1.64x</div>
    </div>

    <!-- Double Betting Panels Section -->
    <div class="betting-section">
        
        <!-- Panel 1 -->
        <div class="bet-panel">
            <div class="bet-controls-row">
                <div class="amount-control">
                    <button class="amount-btn" onclick="adjustBet(1, -10)">-</button>
                    <input type="text" id="betInput1" class="amount-input" value="50.00">
                    <button class="amount-btn" onclick="adjustBet(1, 10)">+</button>
                </div>
                <button class="action-btn" id="betBtn1" onclick="toggleBet(1)">PLACE BET</button>
            </div>
            <div class="quick-presets">
                <button class="preset-pill" onclick="setPreset(1, 10)">10</button>
                <button class="preset-pill" onclick="setPreset(1, 50)">50</button>
                <button class="preset-pill" onclick="setPreset(1, 100)">100</button>
                <button class="preset-pill" onclick="setPreset(1, 500)">500</button>
            </div>
        </div>

        <!-- Panel 2 -->
        <div class="bet-panel">
            <div class="bet-controls-row">
                <div class="amount-control">
                    <button class="amount-btn" onclick="adjustBet(2, -10)">-</button>
                    <input type="text" id="betInput2" class="amount-input" value="50.00">
                    <button class="amount-btn" onclick="adjustBet(2, 10)">+</button>
                </div>
                <button class="action-btn" id="betBtn2" onclick="toggleBet(2)">PLACE BET</button>
            </div>
            <div class="quick-presets">
                <button class="preset-pill" onclick="setPreset(2, 10)">10</button>
                <button class="preset-pill" onclick="setPreset(2, 50)">50</button>
                <button class="preset-pill" onclick="setPreset(2, 100)">100</button>
                <button class="preset-pill" onclick="setPreset(2, 500)">500</button>
            </div>
        </div>

    </div>

    <!-- Live Stats & Bets -->
    <div class="stats-section">
        <div class="tabs">
            <button class="tab active">All Bets</button>
            <button class="tab">Previous</button>
            <button class="tab">Top</button>
        </div>
        <div class="bets-list" id="liveBetsList">
            <div class="bet-row"><span>Rahul_99</span><span>50.00</span><span style="color:#00e676;">1.40x</span></div>
            <div class="bet-row"><span>Priya_Vip</span><span>100.00</span><span style="color:#00e676;">1.51x</span></div>
            <div class="bet-row"><span>Sahil_K</span><span>200.00</span><span>--</span></div>
        </div>
    </div>

    <script>
        function adjustBet(panelNum, amount) {
            const input = document.getElementById(`betInput${panelNum}`);
            let val = parseFloat(input.value) + amount;
            if (val < 10) val = 10;
            input.value = val.toFixed(2);
        }

        function setPreset(panelNum, amount) {
            document.getElementById(`betInput${panelNum}`).value = amount.toFixed(2);
        }

        function toggleBet(panelNum) {
            const btn = document.getElementById(`betBtn${panelNum}`);
            if (btn.innerText === "PLACE BET") {
                btn.innerText = "CANCEL";
                btn.classList.add("cancel");
            } else {
                btn.innerText = "PLACE BET";
                btn.classList.remove("cancel");
            }
        }
    </script>
</body>
</html>
