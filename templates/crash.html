<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0e14;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .navbar {
            width: 100%; max-width: 480px; background: #12151c; display: flex;
            justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid #1e222d;
        }
        .brand-logo { font-size: 18px; font-weight: 900; color: #ff3b30; font-style: italic; text-decoration: none; }
        .user-balance-section { display: flex; align-items: center; gap: 8px; }
        .balance-pill { background: #1c212e; padding: 4px 10px; border-radius: 16px; font-size: 13px; color: #f1c40f; font-weight: bold; border: 1px solid #2a2f40; }

        .history-bar {
            width: 100%; max-width: 480px; display: flex; gap: 5px; padding: 6px 10px; background: #0f1219; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid #1a1e29;
        }
        .history-pill { background: #181d28; padding: 2px 7px; border-radius: 10px; font-size: 11px; font-weight: bold; color: #2ecc71; cursor: pointer; }
        .history-pill.pill-red { color: #e74c3c; }

        .game-info-bar {
            width: 100%; max-width: 480px; background: #141822; display: flex; justify-content: space-between; padding: 4px 12px; font-size: 11px; color: #8a99ad; border-bottom: 1px solid #1e222d;
        }

        .game-container {
            width: 100%; max-width: 480px; 
            background: linear-gradient(135deg, #0f172a 0%, #0b0e14 100%);
            height: 190px; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; border-bottom: 2px solid #1e222d;
        }
        
        .grid-bg {
            position: absolute; top: 0; left: 0; width: 200%; height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
            background-size: 24px 24px;
            animation: moveGrid 15s linear infinite;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes moveGrid {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .text-layer {
            position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; pointer-events: none;
        }

        .flight-svg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3;
        }

        .multiplier-display { font-size: 38px; font-weight: 900; color: #fff; text-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
        .status-text { font-size: 10px; color: #00f0ff; font-weight: bold; margin-bottom: 3px; letter-spacing: 1px; text-transform: uppercase; }
        
        .plane-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .plane { 
            position: absolute; bottom: 12px; left: 15px; font-size: 36px; 
            filter: drop-shadow(0 0 14px rgba(0, 240, 255, 0.9));
            transition: transform 0.05s linear; will-change: transform; 
        }

        /* Dual Betting Section */
        .betting-section { width: 100%; max-width: 480px; padding: 6px 8px; display: flex; flex-direction: column; gap: 6px; background: #0b0e14; }
        .bet-panel { background: #141822; border: 1px solid #1e222d; border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
        .bet-mode-tabs { display: flex; background: #0b0e14; border-radius: 6px; padding: 2px; width: fit-content; }
        .bet-mode-tab { background: transparent; border: none; color: #8a99ad; font-size: 10px; padding: 2px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .bet-mode-tab.active { background: #1c212e; color: #fff; }

        .bet-controls-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .amount-control { display: flex; background: #0b0e14; border-radius: 8px; border: 1px solid #1e222d; align-items: center; overflow: hidden; }
        .amount-btn { background: #181d28; color: #fff; border: none; padding: 5px 8px; font-size: 13px; cursor: pointer; }
        .amount-input { width: 55px; background: transparent; border: none; color: #fff; text-align: center; font-size: 12px; font-weight: bold; outline: none; }
        .action-btn { flex: 1; background: #2ecc71; color: #fff; border: none; padding: 9px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; text-align: center; box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3); text-transform: uppercase; }
        .action-btn:disabled { background: #1c212e !important; color: #6c7a9c !important; cursor: not-allowed !important; box-shadow: none; }
        .quick-presets { display: flex; gap: 4px; }
        .preset-pill { background: #181d28; border: none; color: #8a99ad; padding: 2px 5px; border-radius: 6px; font-size: 10px; cursor: pointer; flex: 1; text-align: center; }

        /* Full Page All Bets Section */
        .stats-section { 
            width: 100%; max-width: 480px; 
            background: #12151c; 
            border-top: 1px solid #1e222d; 
            margin-top: 2px; 
            display: flex; 
            flex-direction: column; 
            flex: 1; 
        }
        .stats-tabs { display: flex; background: #0f1219; border-bottom: 1px solid #1e222d; padding: 0 10px; gap: 10px; }
        .stats-tab { padding: 8px 16px; font-size: 11px; color: #8a99ad; background: none; border: none; cursor: pointer; font-weight: bold; }
        .stats-tab.active { color: #fff; border-bottom: 2px solid #e74c3c; }
        
        .bets-header {
            display: flex; justify-content: space-between; padding: 6px 12px; font-size: 10px; color: #5a6882; background: #141822; border-bottom: 1px solid #1a1e29; font-weight: bold;
        }
        .bets-list { 
            flex: 1;
            height: calc(100vh - 510px);
            min-height: 200px;
            overflow-y: auto; 
            padding: 0 8px; 
        }
        .bet-row { 
            display: flex; justify-content: space-between; align-items: center; 
            font-size: 11px; padding: 6px 8px; border-bottom: 1px solid #181c25; color: #b0bec5; 
        }
        
        .bet-row.cashed-row {
            background: rgba(46, 204, 113, 0.12);
            border-radius: 6px;
            margin-bottom: 2px;
        }

        /* Only the logged in real user row gets red highlight */
        .bet-row.my-real-highlight {
            background: rgba(231, 76, 60, 0.3) !important;
            border-left: 3px solid #e74c3c !important;
            font-weight: bold;
        }

        .col-user { width: 35%; text-align: left; display: flex; align-items: center; gap: 6px; }
        .col-bet { width: 30%; text-align: center; }
        .col-cashout { width: 35%; text-align: right; }
        
        .user-avatar {
            width: 22px; height: 22px; border-radius: 50%; background: #242833; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff;
        }
        .multiplier-badge {
            background: rgba(46, 204, 113, 0.25);
            color: #2ecc71;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 10px;
        }

        /* Full Screen History Modal */
        .history-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 14, 20, 0.95); z-index: 100; flex-direction: column; align-items: center; padding: 15px;
        }
        .history-modal-content {
            width: 100%; max-width: 480px; background: #12151c; border: 1px solid #1e222d; border-radius: 12px; display: flex; flex-direction: column; height: 90vh; overflow: hidden;
        }
        .history-modal-header {
            display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #141822; border-bottom: 1px solid #1e222d; font-weight: bold; font-size: 14px;
        }
        .close-modal-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
        .history-list-full { flex: 1; overflow-y: auto; padding: 10px; }
        .history-full-row {
            display: flex; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid #181c25; font-size: 13px; align-items: center;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="/dashboard" class="brand-logo">Aviator</a>
        <div class="user-balance-section">
            <div class="balance-pill"><span id="token-balance">1000.00</span> 🪙</div>
            <a href="/dashboard" style="color: #8a99ad; text-decoration: none; font-size: 12px;">🏠 Lobby</a>
        </div>
    </div>

    <div class="history-bar" id="history-bar" onclick="openHistoryModal()"></div>

    <div class="game-info-bar">
        <span>Round ID: <span id="round-id-disp">28479568</span></span>
        <span>👤 <span id="session-user">{{ username }}</span></span>
        <span>Ping: 39ms</span>
    </div>

    <div class="game-container">
        <div class="grid-bg"></div>
        
        <div class="text-layer">
            <div class="status-text" id="game-status">WAITING FOR TAKE OFF</div>
            <div class="multiplier-display" id="multiplier-display">1.00x</div>
        </div>

        <svg class="flight-svg" viewBox="0 0 480 180" preserveAspectRatio="none">
            <defs>
                <linearGradient id="curveGradient" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="rgba(0, 240, 255, 0.25)"/>
                    <stop offset="100%" stop-color="rgba(0, 240, 255, 0.0)"/>
                </linearGradient>
            </defs>
            <path id="area-path" d="M 0 180 L 0 180 L 480 180 Z" fill="url(#curveGradient)" />
            <path id="line-path" d="M 0 180 L 0 180" fill="none" stroke="#00f0ff" stroke-width="3.5" />
        </svg>
        
        <div class="plane-container">
            <div class="plane" id="plane">✈️</div>
        </div>
    </div>

    <!-- Dual Betting Panels -->
    <div class="betting-section">
        <!-- Panel 1 -->
        <div class="bet-panel">
            <div class="bet-mode-tabs">
                <button class="bet-mode-tab active">Bet</button>
                <button class="bet-mode-tab">Auto</button>
            </div>
            <div class="bet-controls-row">
                <div class="amount-control">
                    <button class="amount-btn" onclick="adjustBet(1, -10)">-</button>
                    <input type="text" id="bet-amount-1" class="amount-input" value="50.00">
                    <button class="amount-btn" onclick="adjustBet(1, 10)">+</button>
                </div>
                <button class="action-btn" id="btn-action-1" onclick="handleWagerAction(1)" disabled>WAIT FOR NEXT ROUND</button>
            </div>
            <div class="quick-presets">
                <button class="preset-pill" onclick="setPreset(1, 10)">10</button>
                <button class="preset-pill" onclick="setPreset(1, 50)">50</button>
                <button class="preset-pill" onclick="setPreset(1, 100)">100</button>
                <button class="preset-pill" onclick="setPreset(1, 1000)">1,000</button>
            </div>
        </div>

        <!-- Panel 2 -->
        <div class="bet-panel">
            <div class="bet-mode-tabs">
                <button class="bet-mode-tab active">Bet</button>
                <button class="bet-mode-tab">Auto</button>
            </div>
            <div class="bet-controls-row">
                <div class="amount-control">
                    <button class="amount-btn" onclick="adjustBet(2, -10)">-</button>
                    <input type="text" id="bet-amount-2" class="amount-input" value="50.00">
                    <button class="amount-btn" onclick="adjustBet(2, 10)">+</button>
                </div>
                <button class="action-btn" id="btn-action-2" onclick="handleWagerAction(2)" disabled>WAIT FOR NEXT ROUND</button>
            </div>
            <div class="quick-presets">
                <button class="preset-pill" onclick="setPreset(2, 10)">10</button>
                <button class="preset-pill" onclick="setPreset(2, 50)">50</button>
                <button class="preset-pill" onclick="setPreset(2, 100)">100</button>
                <button class="preset-pill" onclick="setPreset(2, 1000)">1,000</button>
            </div>
        </div>
    </div>

    <!-- Bottom Section: All Bets & My Bets Only -->
    <div class="stats-section">
        <div class="stats-tabs">
            <button class="stats-tab active" id="tab-all" onclick="switchTab('all')">All Bets (<span id="player-count">0</span>)</button>
            <button class="stats-tab" id="tab-my" onclick="switchTab('my')">My Bets</button>
        </div>
        <div class="bets-header">
            <span class="col-user">User</span>
            <span class="col-bet">Bet (🪙)</span>
            <span class="col-cashout">Cash out (🪙)</span>
        </div>
        <div class="bets-list" id="live-bets-list"></div>
    </div>

    <!-- Full Screen History Modal -->
    <div class="history-modal" id="historyModal">
        <div class="history-modal-content">
            <div class="history-modal-header">
                <span>Detailed Round History</span>
                <button class="close-modal-btn" onclick="closeHistoryModal()">✕</button>
            </div>
            <div class="bets-header">
                <span style="width: 50%;">Multiplier</span>
                <span style="width: 50%; text-align: right;">Status / Result</span>
            </div>
            <div class="history-list-full" id="fullHistoryList"></div>
        </div>
    </div>

    <script>
        let currentUsername = "{{ username }}".trim();
        if (!currentUsername || currentUsername === "{{ username }}") {
            const userSpan = document.getElementById("session-user");
            if (userSpan) currentUsername = userSpan.innerText.trim();
        }

        let ws;
        let balance = 1000.00;
        
        let bet1Active = false;
        let bet1Cashed = false;
        let bet1Wager = 0;

        let bet2Active = false;
        let bet2Cashed = false;
        let bet2Wager = 0;

        let roundInProgress = true;
        let globalHistory = [];
        let currentTabFilter = 'all'; 
        let latestBetsData = {};

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let jetNoiseNode = null;
        let jetFilterNode = null;
        let jetGainNode = null;

        function startJetEngineSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (jetNoiseNode) return;

            const bufferSize = audioCtx.sampleRate * 2;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            jetNoiseNode = audioCtx.createBufferSource();
            jetNoiseNode.buffer = noiseBuffer;
            jetNoiseNode.loop = true;

            jetFilterNode = audioCtx.createBiquadFilter();
            jetFilterNode.type = 'lowpass';
            jetFilterNode.frequency.setValueAtTime(150, audioCtx.currentTime);

            jetGainNode = audioCtx.createGain();
            jetGainNode.gain.setValueAtTime(0.001, audioCtx.currentTime);
            jetGainNode.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 0.5);

            jetNoiseNode.connect(jetFilterNode);
            jetFilterNode.connect(jetGainNode);
            jetGainNode.connect(audioCtx.destination);
            
            jetNoiseNode.start();
        }

        function updateJetEngineSound(multiplier) {
            if (!jetFilterNode || !jetGainNode) return;
            
            let progress = Math.log(multiplier);
            let targetFreq = 150 + (progress * 300);
            let targetGain = 0.04 + (progress * 0.015);
            
            if (targetFreq > 900) targetFreq = 900;
            if (targetGain > 0.12) targetGain = 0.12;

            jetFilterNode.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
            jetGainNode.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.1);
        }

        function stopJetEngineSound() {
            if (jetGainNode && jetNoiseNode) {
                try {
                    jetGainNode.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                    setTimeout(() => {
                        if (jetNoiseNode) {
                            jetNoiseNode.stop();
                            jetNoiseNode.disconnect();
                            jetNoiseNode = null;
                            jetFilterNode = null;
                            jetGainNode = null;
                        }
                    }, 200);
                } catch(e) {
                    jetNoiseNode = null;
                    jetFilterNode = null;
                    jetGainNode = null;
                }
            }
        }

        function playCoinChimeSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let now = audioCtx.currentTime;
            [987.77, 1318.51, 1567.98].forEach((freq, index) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + (index * 0.05));
                
                gain.gain.setValueAtTime(0.001, now + (index * 0.05));
                gain.gain.linearRampToValueAtTime(0.1, now + (index * 0.05) + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + (index * 0.05) + 0.25);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + (index * 0.05));
                osc.stop(now + (index * 0.05) + 0.25);
            });
        }

        function playSmoothCashout() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let now = audioCtx.currentTime;
            [523.25, 783.99].forEach((freq, index) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + (index * 0.08));
                
                gain.gain.setValueAtTime(0.001, now + (index * 0.08));
                gain.gain.linearRampToValueAtTime(0.12, now + (index * 0.08) + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + (index * 0.08) + 0.6);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + (index * 0.08));
                osc.stop(now + (index * 0.08) + 0.6);
            });
        }

        function playCrashSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            stopJetEngineSound();

            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
            
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.0, audioCtx.currentTime + 0.4);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        function connectWebSocket() {
            const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws/crash?mode=token`);

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                const display = document.getElementById("multiplier-display");
                const status = document.getElementById("game-status");
                const plane = document.getElementById("plane");
                const btn1 = document.getElementById("btn-action-1");
                const btn2 = document.getElementById("btn-action-2");
                const roundDisp = document.getElementById("round-id-disp");
                const linePath = document.getElementById("line-path");
                const areaPath = document.getElementById("area-path");

                if (data.round_id && roundDisp) {
                    roundDisp.innerText = data.round_id;
                }

                if (data.history) {
                    globalHistory = data.history;
                    updateHistoryBar(data.history);
                }

                if (data.type === "ROUND_READY") {
                    roundInProgress = false;
                    bet1Active = false;
                    bet1Cashed = false;
                    bet2Active = false;
                    bet2Cashed = false;

                    stopJetEngineSound();

                    status.innerText = "WAITING FOR TAKE OFF";
                    status.style.color = "#00f0ff";
                    display.innerText = "1.00x";
                    display.style.color = "#fff";
                    if(plane) plane.style.transform = `translate(15px, -15px) rotate(15deg)`;
                    if(linePath) linePath.setAttribute("d", "M 15 165 L 15 165");
                    if(areaPath) areaPath.setAttribute("d", "M 15 180 L 15 165 L 15 180 Z");
                    
                    let v1 = document.getElementById("bet-amount-1").value;
                    let v2 = document.getElementById("bet-amount-2").value;

                    btn1.innerText = `BET ${parseFloat(v1).toFixed(2)} 🪙`;
                    btn1.style.background = "#2ecc71";
                    btn1.disabled = false;

                    btn2.innerText = `BET ${parseFloat(v2).toFixed(2)} 🪙`;
                    btn2.style.background = "#2ecc71";
                    btn2.disabled = false;
                } 
                else if (data.type === "ROUND_STARTED") {
                    roundInProgress = true;
                    status.innerText = "FLIGHT IN PROGRESS";
                    status.style.color = "#00f0ff";
                    if(plane) plane.style.transform = `translate(15px, -15px) rotate(15deg)`;
                    
                    startJetEngineSound();
                    
                    if (bet1Active && !bet1Cashed) {
                        btn1.innerText = "CASH OUT";
                        btn1.style.background = "#f1c40f";
                        btn1.disabled = false;
                    } else if (!bet1Active) {
                        btn1.innerText = "WAIT FOR NEXT ROUND";
                        btn1.style.background = "#1c212e";
                        btn1.disabled = true;
                    }

                    if (bet2Active && !bet2Cashed) {
                        btn2.innerText = "CASH OUT";
                        btn2.style.background = "#f1c40f";
                        btn2.disabled = false;
                    } else if (!bet2Active) {
                        btn2.innerText = "WAIT FOR NEXT ROUND";
                        btn2.style.background = "#1c212e";
                        btn2.disabled = true;
                    }
                } 
                else if (data.type === "TICK") {
                    if(display) display.innerText = data.multiplier.toFixed(2) + "x";
                    status.innerText = "MULTIPLIER RISING";
                    status.style.color = "#00f0ff";
                    
                    updateJetEngineSound(data.multiplier);

                    let progress = Math.log(data.multiplier) * 0.9;
                    let xPos = 15 + (progress * 90);
                    let yPos = 15 + (progress * 40);
                    
                    if (xPos > 360) xPos = 360;
                    if (yPos > 120) yPos = 120;
                    
                    let hover = Math.sin(Date.now() / 200) * 4;
                    let finalY = yPos + hover;

                    let svgX = xPos + 10;
                    let svgY = 180 - finalY;

                    let angle = 15 - (progress * 1.2);
                    if (angle < 4) angle = 4;
                    
                    if(plane) plane.style.transform = `translate(${xPos}px, -${finalY}px) rotate(${angle}deg)`;

                    if(linePath && areaPath) {
                        let pathString = `M 15 165 Q ${svgX * 0.45} 165, ${svgX} ${svgY}`;
                        linePath.setAttribute("d", pathString);
                        areaPath.setAttribute("d", `M 15 180 L 15 165 Q ${svgX * 0.45} 165, ${svgX} ${svgY} L ${svgX} 180 Z`);
                    }

                    if (bet1Active && !bet1Cashed && btn1) {
                        let currentWin = (bet1Wager * data.multiplier).toFixed(2);
                        btn1.innerText = `CASH OUT (${currentWin} 🪙)`;
                        btn1.style.background = "#f1c40f";
                        btn1.disabled = false;
                    }

                    if (bet2Active && !bet2Cashed && btn2) {
                        let currentWin = (bet2Wager * data.multiplier).toFixed(2);
                        btn2.innerText = `CASH OUT (${currentWin} 🪙)`;
                        btn2.style.background = "#f1c40f";
                        btn2.disabled = false;
                    }
                } 
                else if (data.type === "ROUND_CRASHED") {
                    roundInProgress = false;
                    if(display) {
                        display.innerText = data.multiplier.toFixed(2) + "x (CRASHED)";
                        display.style.color = "#e74c3c";
                    }
                    status.innerText = "FLEW AWAY!";
                    status.style.color = "#e74c3c";
                    if(plane) plane.style.transform = `translate(370px, 20px) rotate(65deg)`;

                    playCrashSound();

                    bet1Active = false;
                    bet1Cashed = false;
                    bet2Active = false;
                    bet2Cashed = false;
                    
                    btn1.innerText = "WAIT FOR NEXT ROUND";
                    btn1.style.background = "#1c212e";
                    btn1.disabled = true;

                    btn2.innerText = "WAIT FOR NEXT ROUND";
                    btn2.style.background = "#1c212e";
                    btn2.disabled = true;
                }

                if (data.bets || data.active_bets) {
                    latestBetsData = data.bets || data.active_bets;
                    updateLiveBetsUI();
                }
            };

            ws.onclose = function() {
                setTimeout(function() {
                    connectWebSocket();
                }, 1500);
            };
        }

        function switchTab(tabName) {
            currentTabFilter = tabName;
            document.getElementById('tab-all').classList.toggle('active', tabName === 'all');
            document.getElementById('tab-my').classList.toggle('active', tabName === 'my');
            updateLiveBetsUI();
        }

        function handleWagerAction(panelNum) {
            const amountInput = document.getElementById(`bet-amount-${panelNum}`);
            const actionBtn = document.getElementById(`btn-action-${panelNum}`);
            const amount = parseFloat(amountInput.value);

            if (!amount || amount <= 0) {
                alert("Please enter a valid bet amount!");
                return;
            }

            if (roundInProgress && panelNum === 1 && !bet1Active) return;
            if (roundInProgress && panelNum === 2 && !bet2Active) return;

            if (!roundInProgress) {
                if (amount > balance) { 
                    alert("Insufficient Token Balance!"); 
                    return; 
                }
                balance -= amount;
                updateBalanceDisplay();

                playCoinChimeSound();

                if (panelNum === 1) {
                    bet1Active = true;
                    bet1Cashed = false;
                    bet1Wager = amount;
                } else {
                    bet2Active = true;
                    bet2Cashed = false;
                    bet2Wager = amount;
                }
                
                actionBtn.innerText = "BET PLACED";
                actionBtn.style.background = "#1c212e";
                actionBtn.disabled = true;

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ 
                        action: "PLACE_BET", 
                        amount: amount, 
                        mode: "token", 
                        username: currentUsername + (panelNum === 2 ? " [2]" : "")
                    }));
                }
            } 
            else if (roundInProgress) {
                let currentMult = parseFloat(document.getElementById("multiplier-display").innerText);
                
                if (panelNum === 1 && bet1Active && !bet1Cashed) {
                    bet1Cashed = true;
                    let winAmount = bet1Wager * currentMult;
                    balance += winAmount;
                    updateBalanceDisplay();

                    playSmoothCashout();

                    actionBtn.innerText = `CASHED OUT (${winAmount.toFixed(2)} 🪙)`;
                    actionBtn.style.background = "#2ecc71";
                    actionBtn.disabled = true;
                } 
                else if (panelNum === 2 && bet2Active && !bet2Cashed) {
                    bet2Cashed = true;
                    let winAmount = bet2Wager * currentMult;
                    balance += winAmount;
                    updateBalanceDisplay();

                    playSmoothCashout();

                    actionBtn.innerText = `CASHED OUT (${winAmount.toFixed(2)} 🪙)`;
                    actionBtn.style.background = "#2ecc71";
                    actionBtn.disabled = true;
                }

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ 
                        action: "CASH_OUT", 
                        mode: "token", 
                        username: currentUsername + (panelNum === 2 ? " [2]" : "")
                    }));
                }
            }
        }

        function updateBalanceDisplay() {
            const balanceEl = document.getElementById('token-balance');
            if (balanceEl) balanceEl.innerText = balance.toFixed(2);
        }

        function updateHistoryBar(historyArr) {
            const bar = document.getElementById("history-bar");
            if (!bar) return;
            bar.innerHTML = "";
            let reversedHistory = [...historyArr].reverse();

            reversedHistory.slice(0, 15).forEach(val => {
                let pill = document.createElement("span");
                pill.className = "history-pill " + (val < 2.00 ? "pill-red" : "");
                pill.innerText = val.toFixed(2) + "x";
                bar.appendChild(pill);
            });
        }

        function openHistoryModal() {
            const modal = document.getElementById("historyModal");
            const fullList = document.getElementById("fullHistoryList");
            fullList.innerHTML = "";

            let reversed = [...globalHistory].reverse();
            reversed.forEach((val) => {
                let row = document.createElement("div");
                row.className = "history-full-row";
                let colorClass = val < 2.00 ? "color: #e74c3c;" : "color: #2ecc71;";
                row.innerHTML = `
                    <span style="font-weight: bold; font-size: 14px; ${colorClass}">${val.toFixed(2)}x</span>
                    <span style="color: #8a99ad; font-size: 11px;">Round completed</span>
                `;
                fullList.appendChild(row);
            });

            modal.style.display = "flex";
        }

        function closeHistoryModal() {
            document.getElementById("historyModal").style.display = "none";
        }

        function updateLiveBetsUI() {
            const listContainer = document.getElementById("live-bets-list");
            const countEl = document.getElementById("player-count");
            if (!listContainer || !countEl) return;
            
            listContainer.innerHTML = "";
            let keys = Object.keys(latestBetsData);
            countEl.innerText = keys.length;

            let myRealBets = [];
            let otherBets = [];

            keys.forEach(uid => {
                let bet = latestBetsData[uid];
                let cleanName = bet.username.replace(" [2]", "").trim();
                
                // STRICT CHECK: Only separate the user who is actually logged into THIS specific browser/device session
                let isMe = (cleanName === currentUsername);

                if (isMe) {
                    myRealBets.push(bet);
                } else {
                    otherBets.push(bet);
                }
            });

            // Put ONLY the logged-in user on top, followed by all other players/bots normally
            let displayBets = currentTabFilter === 'my' ? myRealBets : [...myRealBets, ...otherBets];

            displayBets.forEach(bet => {
                let row = document.createElement("div");
                let cleanName = bet.username.replace(" [2]", "").trim();
                let isMe = (cleanName === currentUsername);
                
                let rowClass = "bet-row";
                if (isMe) {
                    rowClass += " my-real-highlight"; // ONLY highlight the logged-in user in red
                }
                if (bet.cashed_out) rowClass += " cashed-row";
                row.className = rowClass;

                let avatarLetter = bet.username.charAt(0).toUpperCase();
                let cashoutDisplay = bet.cashed_out 
                    ? `<span class="multiplier-badge">${bet.multiplier.toFixed(2)}x</span> &nbsp; <b>${bet.payout.toFixed(2)} 🪙</b>` 
                    : `-`;

                row.innerHTML = `
                    <span class="col-user"><div class="user-avatar" style="${isMe ? 'background: #e74c3c; color: #fff;' : ''}">${avatarLetter}</div> <b style="${isMe ? 'color: #ff6b6b;' : ''}">${bet.username} ${isMe ? '(You)' : ''}</b></span>
                    <span class="col-bet">${bet.amount.toFixed(2)} 🪙</span>
                    <span class="col-cashout">${cashoutDisplay}</span>
                `;
                listContainer.appendChild(row);
            });
        }

        function adjustBet(panelNum, amount) {
            const input = document.getElementById(`bet-amount-${panelNum}`);
            let val = parseFloat(input.value) + amount;
            if (val < 10) val = 10;
            input.value = val.toFixed(2);
            if (!roundInProgress) {
                document.getElementById(`btn-action-${panelNum}`).innerText = `BET ${val.toFixed(2)} 🪙`;
            }
        }

        function setPreset(panelNum, val) { 
            document.getElementById(`bet-amount-${panelNum}`).value = val.toFixed(2); 
            if (!roundInProgress) {
                document.getElementById(`btn-action-${panelNum}`).innerText = `BET ${val.toFixed(2)} 🪙`;
            }
        }

        connectWebSocket();
    </script>
</body>
</html>
