<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0e14;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        /* Top Navigation Header */
        .navbar {
            width: 100%;
            max-width: 480px;
            background: #12151c;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #1e222d;
        }
        .brand-logo {
            font-size: 18px;
            font-weight: 900;
            color: #ff3b30;
            font-style: italic;
            text-decoration: none;
        }
        .user-balance-section {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .balance-pill {
            background: #1c212e;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 13px;
            color: #f1c40f;
            font-weight: bold;
            border: 1px solid #2a2f40;
        }

        /* History Bar */
        .history-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            gap: 5px;
            padding: 6px 10px;
            background: #0f1219;
            overflow-x: auto;
            white-space: nowrap;
            border-bottom: 1px solid #1a1e29;
        }
        .history-pill {
            background: #181d28;
            padding: 2px 7px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            color: #2ecc71;
        }
        .history-pill.pill-red { color: #e74c3c; }

        /* Game Sub-header info */
        .game-info-bar {
            width: 100%;
            max-width: 480px;
            background: #141822;
            display: flex;
            justify-content: space-between;
            padding: 4px 12px;
            font-size: 11px;
            color: #8a99ad;
            border-bottom: 1px solid #1e222d;
        }

        /* Main Game Screen */
        .game-container {
            width: 100%;
            max-width: 480px;
            background: linear-gradient(135deg, #160a0d 0%, #0d0f15 100%);
            height: 220px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-bottom: 2px solid #1e222d;
        }
        
        /* Grid background dots */
        .grid-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
            z-index: 1;
        }

        /* Red Fill Area under curve */
        .flight-curve-fill {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(231, 76, 60, 0.25) 0%, transparent 70%);
            clip-path: polygon(0 100%, 10% 90%, 30% 75%, 50% 60%, 75% 35%, 100% 15%, 100% 100%);
            pointer-events: none;
            z-index: 1;
        }

        .multiplier-display {
            font-size: 42px;
            font-weight: 900;
            color: #fff;
            z-index: 3;
            text-shadow: 0 0 12px rgba(255, 59, 48, 0.4);
        }
        .status-text {
            font-size: 11px;
            color: #e74c3c;
            font-weight: bold;
            margin-bottom: 4px;
            letter-spacing: 1px;
            z-index: 3;
            text-transform: uppercase;
        }
        
        /* Plane Container */
        .plane-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        .plane {
            position: absolute;
            bottom: 15px;
            left: 20px;
            font-size: 30px;
            color: #e74c3c;
            transition: transform 0.08s linear;
            will-change: transform;
            z-index: 3;
        }

        /* Double Betting Section */
        .betting-section {
            width: 100%;
            max-width: 480px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0b0e14;
        }

        .bet-panel {
            background: #141822;
            border: 1px solid #1e222d;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .bet-mode-tabs {
            display: flex;
            background: #0b0e14;
            border-radius: 6px;
            padding: 2px;
            width: fit-content;
        }
        .bet-mode-tab {
            background: transparent;
            border: none;
            color: #8a99ad;
            font-size: 11px;
            padding: 3px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .bet-mode-tab.active {
            background: #1c212e;
            color: #fff;
        }

        .bet-controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .amount-control {
            display: flex;
            background: #0b0e14;
            border-radius: 8px;
            border: 1px solid #1e222d;
            align-items: center;
            overflow: hidden;
        }
        .amount-btn {
            background: #181d28;
            color: #fff;
            border: none;
            padding: 8px 10px;
            font-size: 15px;
            cursor: pointer;
        }
        .amount-input {
            width: 65px;
            background: transparent;
            border: none;
            color: #fff;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            outline: none;
        }
        .action-btn {
            flex: 1;
            background: #2ecc71;
            color: #fff;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
            text-transform: uppercase;
        }
        .action-btn:disabled {
            background: #1c212e !important;
            color: #6c7a9c !important;
            cursor: not-allowed !important;
            box-shadow: none;
        }
        .quick-presets {
            display: flex;
            gap: 4px;
        }
        .preset-pill {
            background: #181d28;
            border: none;
            color: #8a99ad;
            padding: 3px 6px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        /* Live Bets / Stats Tabs */
        .stats-section {
            width: 100%;
            max-width: 480px;
            background: #12151c;
            border-top: 1px solid #1e222d;
            margin-top: 4px;
        }
        .stats-tabs {
            display: flex;
            background: #0f1219;
            border-bottom: 1px solid #1e222d;
            padding: 0 10px;
        }
        .stats-tab {
            padding: 8px 12px;
            font-size: 11px;
            color: #8a99ad;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .stats-tab.active {
            color: #fff;
            border-bottom: 2px solid #e74c3c;
        }
        .bets-list {
            max-height: 130px;
            overflow-y: auto;
            padding: 4px 10px;
        }
        .bet-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            padding: 5px 0;
            border-bottom: 1px solid #181c25;
            color: #8a99ad;
        }
        .bet-row.my-bet {
            color: #ff3b30 !important;
            font-weight: bold;
            background: rgba(231, 76, 60, 0.1);
            padding-left: 6px;
            padding-right: 6px;
            border-radius: 4px;
        }
        .cashed-tag { color: #2ecc71; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Top Navigation Header -->
    <div class="navbar">
        <a href="/dashboard" class="brand-logo">Aviator</a>
        <div class="user-balance-section">
            <div class="balance-pill"><span id="token-balance">1000.00</span> 🪙</div>
            <a href="/dashboard" style="color: #8a99ad; text-decoration: none; font-size: 12px;">🏠 Lobby</a>
        </div>
    </div>

    <!-- History Multipliers Bar -->
    <div class="history-bar" id="history-bar"></div>

    <!-- Game Info Bar -->
    <div class="game-info-bar">
        <span>Round ID: <span id="round-id-disp">28479568</span></span>
        <span>👤 {{ username }}</span>
        <span>Ping: 39ms</span>
    </div>

    <!-- Game Screen / Multiplier Area -->
    <div class="game-container">
        <div class="grid-bg"></div>
        <div class="flight-curve-fill"></div>

        <div class="status-text" id="game-status">WAITING FOR TAKE OFF</div>
        <div class="multiplier-display" id="multiplier-display">1.00x</div>
        
        <div class="plane-container">
            <div class="plane" id="plane">✈️</div>
        </div>
    </div>

    <!-- Betting Panels Section (Panel 1) -->
    <div class="betting-section">
        <div class="bet-panel">
            <div class="bet-mode-tabs">
                <button class="bet-mode-tab active">Bet</button>
                <button class="bet-mode-tab">Auto</button>
            </div>
            <div class="bet-controls-row">
                <div class="amount-control">
                    <button class="amount-btn" onclick="adjustBet(-10)">-</button>
                    <input type="text" id="bet-amount" class="amount-input" value="10.00">
                    <button class="amount-btn" onclick="adjustBet(10)">+</button>
                </div>
                <button class="action-btn" id="btn-action" onclick="handleWagerAction()" disabled>WAIT FOR NEXT ROUND</button>
            </div>
            <div class="quick-presets">
                <button class="preset-pill" onclick="setPreset(10)">10</button>
                <button class="preset-pill" onclick="setPreset(50)">50</button>
                <button class="preset-pill" onclick="setPreset(100)">100</button>
                <button class="preset-pill" onclick="setPreset(1000)">1,000</button>
            </div>
        </div>
    </div>

    <!-- Live Stats & Bets -->
    <div class="stats-section">
        <div class="stats-tabs">
            <button class="stats-tab active">All Bets (<span id="player-count">0</span>)</button>
            <button class="stats-tab">My Bets</button>
            <button class="stats-tab">Top</button>
        </div>
        <div class="bets-list" id="live-bets-list"></div>
    </div>

    <script>
        const currentUsername = "{{ username }}";

        let ws;
        let balance = 1000.00;
        let currentWager = 0;
        let isPlaying = false;
        let hasCashedOut = false;
        let roundInProgress = true;

        function connectWebSocket() {
            const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws/crash?mode=token`);

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                const display = document.getElementById("multiplier-display");
                const status = document.getElementById("game-status");
                const plane = document.getElementById("plane");
                const actionBtn = document.getElementById("btn-action");
                const roundDisp = document.getElementById("round-id-disp");

                if (data.round_id && roundDisp) {
                    roundDisp.innerText = data.round_id;
                }

                if (data.history) {
                    updateHistoryBar(data.history);
                }

                if (data.type === "ROUND_READY") {
                    roundInProgress = false;
                    isPlaying = false;
                    hasCashedOut = false;

                    status.innerText = "WAITING FOR TAKE OFF";
                    status.style.color = "#f39c12";
                    display.innerText = "1.00x";
                    display.style.color = "#fff";
                    if(plane) plane.style.transform = `translate(10px, -10px) rotate(15deg)`;
                    
                    actionBtn.innerText = "BET 10.00 INR";
                    actionBtn.style.background = "#2ecc71";
                    actionBtn.disabled = false;
                } 
                else if (data.type === "ROUND_STARTED") {
                    roundInProgress = true;
                    status.innerText = "FLIGHT IN PROGRESS";
                    status.style.color = "#2ecc71";
                    if(plane) plane.style.transform = `translate(10px, -10px) rotate(15deg)`;
                    
                    if (isPlaying && !hasCashedOut) {
                        actionBtn.innerText = "CASH OUT";
                        actionBtn.style.background = "#f1c40f";
                        actionBtn.disabled = false;
                    } else if (!isPlaying) {
                        actionBtn.innerText = "WAIT FOR NEXT ROUND";
                        actionBtn.style.background = "#1c212e";
                        actionBtn.disabled = true;
                    }
                } 
                else if (data.type === "TICK") {
                    if(display) display.innerText = data.multiplier.toFixed(2) + "x";
                    status.innerText = "MULTIPLIER RISING";
                    status.style.color = "#2ecc71";
                    
                    let progress = Math.min(Math.log(data.multiplier) * 1.3, 3.0);
                    let xPos = 15 + (progress * 90);
                    let yPos = 10 + (progress * 55);
                    
                    if (xPos > 330) xPos = 330;
                    if (yPos > 145) yPos = 145;
                    
                    let angle = 22 - (progress * 2);
                    if (angle < 8) angle = 8;
                    
                    if(plane) plane.style.transform = `translate(${xPos}px, -${yPos}px) rotate(${angle}deg)`;

                    if (isPlaying && !hasCashedOut && actionBtn) {
                        let currentWin = (currentWager * data.multiplier).toFixed(2);
                        actionBtn.innerText = `CASH OUT (${currentWin})`;
                        actionBtn.style.background = "#f1c40f";
                        actionBtn.disabled = false;
                    }
                } 
                else if (data.type === "ROUND_CRASHED") {
                    roundInProgress = false;
                    if(display) {
                        display.innerText = data.multiplier.toFixed(2) + "x (CRASHED)";
                        display.style.color = "#e74c3c";
                    }
                    status.innerText = "FLEW AWAY!";
                    status.style.color = "#e74c3c";
                    if(plane) plane.style.transform = `translate(340px, 20px) rotate(65deg)`;

                    isPlaying = false;
                    hasCashedOut = false;
                    
                    actionBtn.innerText = "WAIT FOR NEXT ROUND";
                    actionBtn.style.background = "#1c212e";
                    actionBtn.disabled = true;
                }

                if (data.bets || data.active_bets) {
                    updateLiveBetsUI(data.bets || data.active_bets);
                }
            };

            ws.onclose = function() {
                setTimeout(function() {
                    connectWebSocket();
                }, 1500);
            };
        }

        function handleWagerAction() {
            const amountInput = document.getElementById("bet-amount");
            const actionBtn = document.getElementById("btn-action");
            const amount = parseFloat(amountInput.value);

            if (!amount || amount <= 0) {
                alert("Please enter a valid bet amount!");
                return;
            }

            if (roundInProgress && !isPlaying) {
                return; 
            }

            if (!roundInProgress && !isPlaying) {
                if (amount > balance) { 
                    alert("Insufficient Token Balance!"); 
                    return; 
                }
                currentWager = amount;
                balance -= amount;
                updateBalanceDisplay();

                isPlaying = true;
                hasCashedOut = false;
                
                actionBtn.innerText = "BET PLACED";
                actionBtn.style.background = "#1c212e";
                actionBtn.disabled = true;

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ 
                        action: "PLACE_BET", 
                        amount: amount, 
                        mode: "token", 
                        username: currentUsername 
                    }));
                }
            } 
            else if (roundInProgress && isPlaying && !hasCashedOut) {
                hasCashedOut = true;
                let currentMult = parseFloat(document.getElementById("multiplier-display").innerText);
                let winAmount = currentWager * currentMult;
                
                balance += winAmount;
                updateBalanceDisplay();

                actionBtn.innerText = `CASHED OUT (${winAmount.toFixed(2)})`;
                actionBtn.style.background = "#2ecc71";
                actionBtn.disabled = true;

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ 
                        action: "CASH_OUT", 
                        mode: "token", 
                        username: currentUsername 
                    }));
                }
            }
        }

        function updateBalanceDisplay() {
            const balanceEl = document.getElementById('token-balance');
            if (balanceEl) balanceEl.innerText = balance.toFixed(2);
        }

        function updateHistoryBar(historyArr) {
            const bar = document.getElementById("history-bar");
            if (!bar) return;
            bar.innerHTML = "";
            let reversedHistory = [...historyArr].reverse();

            reversedHistory.slice(0, 15).forEach(val => {
                let pill = document.createElement("span");
                pill.className = "history-pill " + (val < 2.00 ? "pill-red" : "");
                pill.innerText = val.toFixed(2) + "x";
                bar.appendChild(pill);
            });
        }

        function updateLiveBetsUI(betsObj) {
            const listContainer = document.getElementById("live-bets-list");
            const countEl = document.getElementById("player-count");
            if (!listContainer || !countEl) return;
            
            listContainer.innerHTML = "";
            let keys = Object.keys(betsObj);
            countEl.innerText = keys.length;

            let myBets = [];
            let botBets = [];

            keys.forEach(uid => {
                let bet = betsObj[uid];
                let isMe = (bet.username === currentUsername);
                if (isMe) {
                    myBets.push(bet);
                } else {
                    botBets.push(bet);
                }
            });

            let sortedBets = [...myBets, ...botBets];

            sortedBets.forEach(bet => {
                let row = document.createElement("div");
                let isMe = (bet.username === currentUsername);
                row.className = "bet-row " + (isMe ? "my-bet" : "");

                let statusText = bet.cashed_out ? `<span class="cashed-tag">${bet.multiplier.toFixed(2)}x</span>` : `<span>${bet.amount} INR</span>`;
                row.innerHTML = `<strong>${bet.username} ${isMe ? '(You)' : ''}</strong> ${statusText}`;
                listContainer.appendChild(row);
            });
        }

        function adjustBet(amount) {
            const input = document.getElementById("bet-amount");
            let val = parseFloat(input.value) + amount;
            if (val < 10) val = 10;
            input.value = val.toFixed(2);
            document.getElementById("btn-action").innerText = `BET ${val.toFixed(2)} INR`;
        }

        function setPreset(val) { 
            document.getElementById("bet-amount").value = val.toFixed(2); 
            document.getElementById("btn-action").innerText = `BET ${val.toFixed(2)} INR`;
        }

        connectWebSocket();
    </script>
</body>
</html>
