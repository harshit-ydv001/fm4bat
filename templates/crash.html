<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Arena - Live Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121418;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        /* Top Navigation */
        .navbar {
            width: 100%;
            max-width: 480px;
            background: #1a1d24;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid #2a2e39;
        }
        .logo {
            color: #ff5252;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
        }
        .balance-box {
            background: #242833;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            color: #00e676;
            font-weight: 600;
        }
        .logout-link {
            color: #b0bec5;
            text-decoration: none;
            font-size: 13px;
        }

        /* Multiplier History Bar */
        .history-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            gap: 6px;
            padding: 8px 12px;
            background: #161920;
            overflow-x: auto;
            white-space: nowrap;
        }
        .history-pill {
            background: #242833;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            color: #00e676;
        }
        .history-pill.pill-red { color: #ff5252; }
        .history-pill.pill-green { color: #00e676; }

        /* Main Game Screen */
        .game-container {
            width: 100%;
            max-width: 480px;
            background: radial-gradient(circle at bottom left, #1e222d 0%, #0f1115 70%);
            height: 240px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-bottom: 2px solid #2a2e39;
        }
        .multiplier-display {
            font-size: 46px;
            font-weight: 900;
            color: #34d399;
            z-index: 3;
            text-shadow: 0 0 15px rgba(52, 211, 153, 0.3);
        }
        .status-text {
            font-size: 12px;
            color: #fbbf24;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
            z-index: 3;
        }
        
        /* Plane Animation */
        .plane-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        .plane {
            position: absolute;
            bottom: 20px;
            left: 30px;
            font-size: 32px;
            transition: transform 0.15s ease-out;
            will-change: transform;
        }

        /* Betting Panels Container */
        .betting-section {
            width: 100%;
            max-width: 480px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #121418;
        }

        .bet-panel {
            background: #1a1d24;
            border: 1px solid #2a2e39;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .bet-controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .amount-control {
            display: flex;
            background: #121418;
            border-radius: 8px;
            border: 1px solid #2a2e39;
            align-items: center;
            overflow: hidden;
        }
        .amount-btn {
            background: #242833;
            color: #fff;
            border: none;
            padding: 8px 12px;
            font-size: 16px;
            cursor: pointer;
        }
        .amount-input {
            width: 70px;
            background: transparent;
            border: none;
            color: #fff;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            outline: none;
        }
        .action-btn {
            flex: 1;
            margin-left: 10px;
            background: #059669;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 10px rgba(5, 150, 105, 0.3);
        }
        .action-btn:disabled {
            background: #1f2937 !important;
            color: #9ca3af !important;
            cursor: not-allowed !important;
            box-shadow: none;
        }
        .quick-presets {
            display: flex;
            gap: 5px;
        }
        .preset-pill {
            background: #242833;
            border: none;
            color: #b0bec5;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        /* Live Bets / Stats Tabs */
        .stats-section {
            width: 100%;
            max-width: 480px;
            background: #1a1d24;
            border-top: 1px solid #2a2e39;
            margin-top: 5px;
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid #2a2e39;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 12px;
            color: #8c9eff;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .bets-list {
            max-height: 140px;
            overflow-y: auto;
            padding: 5px 10px;
        }
        .bet-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 6px 0;
            border-bottom: 1px solid #222630;
            color: #b0bec5;
        }
        .bet-row.my-bet {
            background: rgba(0, 230, 118, 0.08);
            padding-left: 5px;
            padding-right: 5px;
            border-radius: 4px;
            color: #fff;
        }
        .cashed-tag {
            color: #34d399;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <div class="navbar">
        <a href="/dashboard" class="logout-link">← Lobby</a>
        <div class="logo">AVIATOR ARENA</div>
        <div class="balance-box"><span id="token-balance">1000.00</span> 🪙</div>
    </div>

    <!-- History Multipliers Bar -->
    <div class="history-bar" id="history-bar"></div>

    <!-- Game Screen / Multiplier Area -->
    <div class="game-container">
        <div class="status-text" id="game-status">WAITING FOR TAKE OFF</div>
        <div class="multiplier-display" id="multiplier-display">1.00x</div>
        
        <div class="plane-container">
            <div class="plane" id="plane">✈️</div>
        </div>
    </div>

    <!-- Betting Panels Section -->
    <div class="betting-section">
        <div class="bet-panel">
            <div class="bet-controls-row">
                <div class="amount-control">
                    <button class="amount-btn" onclick="adjustBet(-10)">-</button>
                    <input type="text" id="bet-amount" class="amount-input" value="50.00">
                    <button class="amount-btn" onclick="adjustBet(10)">+</button>
                </div>
                <button class="action-btn" id="btn-action" onclick="handleWagerAction()" disabled>WAIT FOR NEXT ROUND</button>
            </div>
            <div class="quick-presets">
                <button class="preset-pill" onclick="setPreset(10)">10</button>
                <button class="preset-pill" onclick="setPreset(50)">50</button>
                <button class="preset-pill" onclick="setPreset(100)">100</button>
                <button class="preset-pill" onclick="setPreset(500)">500</button>
            </div>
        </div>
    </div>

    <!-- Live Stats & Bets -->
    <div class="stats-section">
        <div class="tabs">
            <button class="tab active">Live Bets (<span id="player-count">0</span>)</button>
        </div>
        <div class="bets-list" id="live-bets-list"></div>
    </div>

    <script>
        // FastAPI session se logged-in user ka username inject hoga
        const currentUsername = "{{ username if username else 'Player_' + Math.floor(Math.random()*1000).toString() }}";

        let ws;
        let balance = 1000.00;
        let currentWager = 0;
        let isPlaying = false;
        let hasCashedOut = false;
        let roundInProgress = true;

        function connectWebSocket() {
            const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws/crash?mode=token`);

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                const display = document.getElementById("multiplier-display");
                const status = document.getElementById("game-status");
                const plane = document.getElementById("plane");
                const actionBtn = document.getElementById("btn-action");

                if (data.history) {
                    updateHistoryBar(data.history);
                }

                if (data.type === "ROUND_READY") {
                    roundInProgress = false;
                    status.innerText = "WAITING FOR TAKE OFF";
                    status.style.color = "#fbbf24";
                    display.innerText = "1.00x";
                    display.style.color = "#34d399";
                    if(plane) plane.style.transform = `translate(0px, 0px) rotate(0deg)`;
                    
                    if (!isPlaying) {
                        actionBtn.innerText = "PLACE BET";
                        actionBtn.style.background = "#059669";
                        actionBtn.disabled = false;
                    }
                } 
                else if (data.type === "ROUND_STARTED") {
                    roundInProgress = true;
                    status.innerText = "FLIGHT IN PROGRESS ✈️";
                    status.style.color = "#34d399";
                    if(plane) plane.style.transform = `translate(0px, 0px) rotate(0deg)`;
                    
                    if (isPlaying && !hasCashedOut) {
                        actionBtn.innerText = "CASH OUT";
                        actionBtn.style.background = "#f59e0b";
                        actionBtn.disabled = false;
                    } else if (!isPlaying) {
                        actionBtn.innerText = "WAIT FOR NEXT ROUND";
                        actionBtn.style.background = "#1f2937";
                        actionBtn.disabled = true;
                    }
                } 
                else if (data.type === "TICK") {
                    if(display) display.innerText = data.multiplier.toFixed(2) + "x";
                    status.innerText = "MULTIPLIER RISING 🚀";
                    status.style.color = "#34d399";
                    
                    let xPos = Math.min((data.multiplier - 1) * 90, 280);
                    let yPos = Math.min((data.multiplier - 1) * 60, 150);
                    if(plane) plane.style.transform = `translate(${xPos}px, -${yPos}px) rotate(-18deg)`;

                    if (isPlaying && !hasCashedOut && actionBtn) {
                        let currentWin = (currentWager * data.multiplier).toFixed(2);
                        actionBtn.innerText = `CASH OUT (${currentWin})`;
                        actionBtn.style.background = "#f59e0b";
                        actionBtn.disabled = false;
                    }
                } 
                else if (data.type === "ROUND_CRASHED") {
                    roundInProgress = false;
                    if(display) {
                        display.innerText = data.multiplier.toFixed(2) + "x (CRASHED)";
                        display.style.color = "#f87171";
                    }
                    status.innerText = "ROUND CRASHED 💥";
                    status.style.color = "#f87171";
                    if(plane) plane.style.transform = `translate(320px, 80px) rotate(50deg)`;

                    isPlaying = false;
                    hasCashedOut = false;
                    
                    actionBtn.innerText = "WAIT FOR NEXT ROUND";
                    actionBtn.style.background = "#1f2937";
                    actionBtn.disabled = true;
                }

                if (data.bets || data.active_bets) {
                    updateLiveBetsUI(data.bets || data.active_bets);
                }
            };

            ws.onclose = function() {
                setTimeout(function() {
                    connectWebSocket();
                }, 1500);
            };
        }

        function handleWagerAction() {
            const amountInput = document.getElementById("bet-amount");
            const actionBtn = document.getElementById("btn-action");
            const amount = parseFloat(amountInput.value);

            if (!amount || amount <= 0) {
                alert("Please enter a valid bet amount!");
                return;
            }

            if (roundInProgress && !isPlaying) {
                return; 
            }

            if (!roundInProgress && !isPlaying) {
                if (amount > balance) { 
                    alert("Insufficient Token Balance!"); 
                    return; 
                }
                currentWager = amount;
                balance -= amount;
                updateBalanceDisplay();

                isPlaying = true;
                hasCashedOut = false;
                
                actionBtn.innerText = "BET PLACED (WAITING...)";
                actionBtn.style.background = "#374151";
                actionBtn.disabled = true;

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ 
                        action: "PLACE_BET", 
                        amount: amount, 
                        mode: "token", 
                        username: currentUsername 
                    }));
                }
            } 
            else if (roundInProgress && isPlaying && !hasCashedOut) {
                hasCashedOut = true;
                let currentMult = parseFloat(document.getElementById("multiplier-display").innerText);
                let winAmount = currentWager * currentMult;
                
                balance += winAmount;
                updateBalanceDisplay();

                actionBtn.innerText = `CASHED OUT (${winAmount.toFixed(2)})`;
                actionBtn.style.background = "#10b981";
                actionBtn.disabled = true;

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ 
                        action: "CASH_OUT", 
                        mode: "token", 
                        username: currentUsername 
                    }));
                }
            }
        }

        function updateBalanceDisplay() {
            const balanceEl = document.getElementById('token-balance');
            if (balanceEl) balanceEl.innerText = balance.toFixed(2);
        }

        function updateHistoryBar(historyArr) {
            const bar = document.getElementById("history-bar");
            if (!bar) return;
            bar.innerHTML = "";
            let reversedHistory = [...historyArr].reverse();

            reversedHistory.slice(0, 20).forEach(val => {
                let pill = document.createElement("span");
                pill.className = "history-pill " + (val < 2.00 ? "pill-red" : "pill-green");
                pill.innerText = val.toFixed(2) + "x";
                bar.appendChild(pill);
            });
        }

        function updateLiveBetsUI(betsObj) {
            const listContainer = document.getElementById("live-bets-list");
            const countEl = document.getElementById("player-count");
            if (!listContainer || !countEl) return;
            
            listContainer.innerHTML = "";
            let keys = Object.keys(betsObj);
            countEl.innerText = keys.length;

            keys.forEach(uid => {
                let bet = betsObj[uid];
                let row = document.createElement("div");
                
                // Agar yeh bet logged-in user ki khud ki hai, toh alag highlight style do
                let isMe = (bet.username === currentUsername);
                row.className = "bet-row " + (isMe ? "my-bet" : "");

                let statusText = bet.cashed_out ? `<span class="cashed-tag">${bet.multiplier.toFixed(2)}x</span>` : `<span>${bet.amount} 🪙</span>`;
                row.innerHTML = `<strong>${bet.username} ${isMe ? '(You)' : ''}</strong> ${statusText}`;
                listContainer.appendChild(row);
            });
        }

        function adjustBet(amount) {
            const input = document.getElementById("bet-amount");
            let val = parseFloat(input.value) + amount;
            if (val < 10) val = 10;
            input.value = val.toFixed(2);
        }

        function setPreset(val) { 
            document.getElementById("bet-amount").value = val.toFixed(2); 
        }

        connectWebSocket();
    </script>
</body>
</html>
