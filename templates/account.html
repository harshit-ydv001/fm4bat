<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - fm4bat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #0b0e14; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .main-content { 
            width: 100%;
            max-width: 480px;
            padding: 16px; 
            margin-bottom: 80px;
        }
        .account-header-card {
            background: #141822;
            border: 1px solid #1e222d;
            border-radius: 16px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .account-avatar {
            width: 60px; height: 60px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; color: #fff;
            box-shadow: 0 4px 12px rgba(59,130,246,0.4);
        }
        .account-meta h3 { font-size: 17px; color: #fff; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        .vip-badge { background: #1e222d; color: #fbbf24; font-size: 10px; padding: 3px 9px; border-radius: 12px; font-weight: bold; border: 1px solid rgba(251,191,36,0.3); }
        .uid-text { font-size: 12px; color: #94a3b8; }

        .wallet-card {
            background: linear-gradient(135deg, #181d28, #11151d);
            border: 1px solid #1e222d;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .wallet-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .wallet-top span { font-size: 13px; color: #94a3b8; }
        .wallet-top h2 { font-size: 24px; color: #34d399; font-weight: bold; }
        .wallet-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center; }
        .wallet-action-btn { background: #1e222d; border: 1px solid #2a2f40; border-radius: 12px; padding: 12px 6px; color: #fff; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: background 0.2s; }
        .wallet-action-btn:hover { background: #2a2f40; }
        .wallet-action-btn span { font-size: 18px; }

        .menu-group {
            background: #141822; border: 1px solid #1e222d; border-radius: 16px; overflow: hidden; margin-bottom: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .menu-item {
            padding: 15px 18px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #1a1f2c; color: #cbd5e1; font-size: 14px; text-decoration: none; cursor: pointer;
            transition: background 0.2s;
        }
        .menu-item:hover { background: rgba(255,255,255,0.02); }
        .menu-item:last-child { border-bottom: none; }
        .menu-item span { color: #94a3b8; }
        
        .btn-logout { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; border: none; padding: 15px; border-radius: 14px; font-weight: bold; text-decoration: none; font-size: 15px; display: block; text-align: center; width: 100%; box-shadow: 0 6px 20px rgba(239,68,68,0.4); text-transform: uppercase; letter-spacing: 0.5px; }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; max-width: 480px;
            background: #141822; border-top: 1px solid #1e222d; display: flex; justify-content: space-around; padding: 10px 0; z-index: 100;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; color: #94a3b8;
            text-decoration: none; font-size: 11px; gap: 4px; cursor: pointer; background: none; border: none;
        }
        .nav-item.active { color: #34d399; font-weight: bold; }
        .nav-icon { font-size: 20px; }
    </style>
</head>
<body>

    <main class="main-content">
        <!-- Profile Top Box with Real Username -->
        <div class="account-header-card">
            <div class="account-avatar">👤</div>
            <div class="account-meta">
                <h3>{{ username }} <span class="vip-badge">VIP 0</span></h3>
                <span class="uid-text">UID | 98452103</span>
            </div>
        </div>

        <!-- Wallet Card -->
        <div class="wallet-card">
            <div class="wallet-top">
                <span>Total balance</span>
                <h2>1,000.00 🪙</h2>
            </div>
            <div class="wallet-actions">
                <div class="wallet-action-btn" onclick="alert('ARWallet is Coming Soon!')"><span>💼</span> ARWallet</div>
                <div class="wallet-action-btn" onclick="alert('Deposit is Coming Soon!')"><span>💳</span> Deposit</div>
                <div class="wallet-action-btn" onclick="alert('Withdraw is Coming Soon!')"><span>🏦</span> Withdraw</div>
                <div class="wallet-action-btn" onclick="alert('VIP features are Coming Soon!')"><span>⭐</span> VIP</div>
            </div>
        </div>

        <!-- Menu Lists -->
        <div class="menu-group">
            <div class="menu-item" onclick="alert('Game History is Coming Soon!')">Game History <span>&gt;</span></div>
            <div class="menu-item" onclick="alert('Transaction History is Coming Soon!')">Transaction <span>&gt;</span></div>
            <div class="menu-item" onclick="alert('Deposit History is Coming Soon!')">Deposit History <span>&gt;</span></div>
            <div class="menu-item" onclick="alert('Withdraw History is Coming Soon!')">Withdraw History <span>&gt;</span></div>
        </div>

        <div class="menu-group">
            <div class="menu-item" onclick="alert('Notifications coming soon!')">Notification <span style="background: #ef4444; color: #fff; padding: 2px 7px; border-radius: 10px; font-size: 11px;">1</span></div>
            <div class="menu-item" onclick="alert('Gifts feature is Coming Soon!')">Gifts <span>&gt;</span></div>
            <div class="menu-item" onclick="alert('Game statistics coming soon!')">Game statistics <span>&gt;</span></div>
            <div class="menu-item" onclick="alert('Language settings coming soon!')">Language <span>English &gt;</span></div>
        </div>

        <div class="menu-group">
            <div class="menu-item" onclick="alert('Settings coming soon!')">Settings <span>&gt;</span></div>
            <div class="menu-item" onclick="alert('Customer Service coming soon!')">Customer Service <span>&gt;</span></div>
            <div class="menu-item" onclick="alert('About us coming soon!')">About us <span>&gt;</span></div>
        </div>

        <a href="/logout" class="btn-logout">Log out</a>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="/dashboard" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </a>
        <button class="nav-item" onclick="alert('Activity is Coming Soon!')">
            <span class="nav-icon">🎯</span>
            <span>Activity</span>
        </button>
        <button class="nav-item" onclick="alert('Promotion is Coming Soon!')">
            <span class="nav-icon">🎁</span>
            <span>Promotion</span>
        </button>
        <a href="/account" class="nav-item active">
            <span class="nav-icon">👤</span>
            <span>Account</span>
        </a>
    </nav>

</body>
</html>
